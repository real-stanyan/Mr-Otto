# 打包配置(issue #73 / ADR-0026)。产物:macOS arm64 的 .dmg。
# 跑法:npm run dist:mac —— 它先 electron-vite build 出 out/,再由本文件打成 app。
appId: com.stanyan.mrotto
productName: Mr Otto
copyright: © 2026 stan yan

directories:
  output: dist
  buildResources: resources

# 灵动岛 Swift helper 的 release 二进制在此拷进 .app 并 ad-hoc 签,见
# scripts/afterPack.cjs 与 scripts/build-island.mjs(dist:mac 前置跑后者)
afterPack: scripts/afterPack.cjs

# out/ 是 electron-vite 的三个 bundle;resources/ 里的 icon.png 被主进程
# 在运行时按 app.getAppPath() 拼路径读(设 dock 图标),所以必须一起进包
files:
  - out/**
  - resources/**
  - package.json

# 原生模块(better-sqlite3)的 .node 不能留在 asar 里:dlopen 读不了压缩包内的文件
asarUnpack:
  - "**/*.node"

# mrotto://auth-callback 是 OAuth 登录的回调。开发期靠 setAsDefaultProtocolClient
# 就够,打包后还得让 Info.plist 里有 CFBundleURLTypes,否则 macOS 不知道该把
# 这个 scheme 交给谁 —— 登录会卡在浏览器那一步回不来
protocols:
  - name: Mr Otto
    schemes:
      - mrotto

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  darkModeSupport: true
  # 产物名不能带空格（issue #306）：GitHub Release 上传时把空格改写成点
  # （Mr Otto-… 变 Mr.Otto-…），release.mjs 按本地名写的 SHA256SUMS 就跟
  # 资产名对不上，更新器查不到条目直接报错。索性本地名就用点，三处
  # （本地文件 / Release 资产 / SHA256SUMS 条目）从此同名。
  # zip 的 -arm64-mac.zip 后缀是线上更新器（updaterCore）认资产的暗号，动不得
  artifactName: Mr.Otto-${version}-${arch}-mac.${ext}
  # napi-rs 平台包按平台裁剪:ensure-win-bindings（dist:win 前置）会把 win32-x64
  # binding 补进 node_modules 且常驻,mac 包别把它带上（issue #308）。
  # 列表必须带正模式（与顶层 files 相同）:electron-builder 对"只含排除模式"的
  # fileset 会隐式补 **/*,纯排除列表等于把整个仓库目录打进 asar
  # （issue #312,v1.0.1 win 包 1.6GB 就是这么来的）
  files:
    - out/**
    - resources/**
    - package.json
    - "!**/node_modules/**/*-win32-*/**"
  # dmg 给首次安装；zip 给 OTA 换包下载（ADR-0075,src/main/updater.ts 认
  # -arm64-mac.zip 后缀的 Release 资产）
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # 没有 Apple Developer 账号,不做签名证书与公证。electron-builder 会退到
  # ad-hoc 签名(codesign -s -),这是 Apple Silicon 上 app 能启动的最低要求。
  # 代价:从网上下载的包带 quarantine 标记,首次打开要用户手动放行,见 README
  identity: "-"
  # ad-hoc 签名 + hardenedRuntime 会撞上 library validation:better-sqlite3 的 .node
  # 不是同一个签名主体签的,加载时会被拒,app 直接起不来。hardened runtime 的唯一
  # 用途是过公证,而我们没有开发者账号也就公证不了 —— 关掉它,别留个必炸的组合
  hardenedRuntime: false

dmg:
  # dmg 不进 OTA 链路，不用 -mac 后缀，保持 v1.0.x 以来的 Mr.Otto-<版本>-arm64.dmg 形状
  artifactName: Mr.Otto-${version}-${arch}.${ext}
  title: Mr Otto ${version}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows:NSIS .exe,x64。灵动岛是 macOS 专属,三处守卫保证 win 包干净:
# build-island.mjs 非 mac 跳过、afterPack.cjs 非 darwin 直接 return、
# 运行时 resolveIslandBinPath() 找不到二进制则岛静默不启动。
# 原生模块:node-pty 与 better-sqlite3 都是 NAPI + 包内自带 win32-x64 prebuilds,
# 运行时按 process.platform 挑对应二进制 —— 所以 win 出包不重编原生模块
# (dist:win 带 --config.npmRebuild=false;交叉 node-gyp 本来就不可能)。
# node-pty 的 build/Release 是本机 mac 编译产物,win 包里排掉,逼 loader 走
# prebuilds/win32-x64。不签名(没有代码签名证书,SmartScreen 会拦,
# 用户点"仍要运行"放行 —— 与 mac 无公证同一档待遇)。
win:
  icon: resources/icon.png
  # 同 mac:正模式必须在,否则纯排除列表触发隐式 **/*（issue #312）
  files:
    - out/**
    - resources/**
    - package.json
    - "!**/node_modules/node-pty/build/**"
    # 反向裁剪:win 包不带 darwin/linux 的 napi 平台包（issue #308）。
    # 模式带前缀连字符,不会误伤 node-pty/better-sqlite3 包内的 prebuilds 目录
    - "!**/node_modules/**/*-darwin-*/**"
    - "!**/node_modules/**/*-linux-*/**"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 同 mac：不用 ${productName}（带空格，GitHub 会改名成点），直接写死点名
  artifactName: Mr.Otto-${version}-win-x64-setup.${ext}
