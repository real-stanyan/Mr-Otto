# 打包配置(issue #73 / ADR-0026)。产物:macOS arm64 的 .dmg。
# 跑法:npm run dist:mac —— 它先 electron-vite build 出 out/,再由本文件打成 app。
appId: com.stanyan.mrotto
productName: Mr Otto
copyright: © 2026 stan yan

directories:
  output: dist
  buildResources: resources

# 灵动岛 Swift helper 的 release 二进制在此拷进 .app 并 ad-hoc 签,见
# scripts/afterPack.cjs 与 scripts/build-island.mjs(dist:mac 前置跑后者)
afterPack: scripts/afterPack.cjs

# out/ 是 electron-vite 的三个 bundle;resources/ 里的 icon.png 被主进程
# 在运行时按 app.getAppPath() 拼路径读(设 dock 图标),所以必须一起进包
files:
  - out/**
  - resources/**
  - package.json

# 原生模块(better-sqlite3)的 .node 不能留在 asar 里:dlopen 读不了压缩包内的文件
asarUnpack:
  - "**/*.node"

# mrotto://auth-callback 是 OAuth 登录的回调。开发期靠 setAsDefaultProtocolClient
# 就够,打包后还得让 Info.plist 里有 CFBundleURLTypes,否则 macOS 不知道该把
# 这个 scheme 交给谁 —— 登录会卡在浏览器那一步回不来
protocols:
  - name: Mr Otto
    schemes:
      - mrotto

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  darkModeSupport: true
  # dmg 给首次安装；zip 给 OTA 换包下载（ADR-0075,src/main/updater.ts 认
  # -arm64-mac.zip 后缀的 Release 资产）
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # 没有 Apple Developer 账号,不做签名证书与公证。electron-builder 会退到
  # ad-hoc 签名(codesign -s -),这是 Apple Silicon 上 app 能启动的最低要求。
  # 代价:从网上下载的包带 quarantine 标记,首次打开要用户手动放行,见 README
  identity: "-"
  # ad-hoc 签名 + hardenedRuntime 会撞上 library validation:better-sqlite3 的 .node
  # 不是同一个签名主体签的,加载时会被拒,app 直接起不来。hardened runtime 的唯一
  # 用途是过公证,而我们没有开发者账号也就公证不了 —— 关掉它,别留个必炸的组合
  hardenedRuntime: false

dmg:
  title: Mr Otto ${version}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
