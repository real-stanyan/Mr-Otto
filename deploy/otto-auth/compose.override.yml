# otto 第二套 Supabase 栈的端口锁定 override。
# 用法: scp 到服务器 ~/otto-supabase/docker/docker-compose.override.yml,
# 与官方 docker-compose.yml 一起用 `docker compose -p otto up -d`(compose 会自动加载同目录下的 docker-compose.override.yml)。
#
# 为什么需要这个文件:
# 官方 docker-compose.yml 里 api-gw / supavisor 的 ports 没绑 host IP
# (`${API_GW_HTTP_PORT}:8000` 会监听 0.0.0.0),这里改成只监听 127.0.0.1,
# 和机上已跑的 dryrun 栈保持一致的暴露策略——外部访问都走后续任务里的反代/域名。
#
# 端口分配(与 dryrun 的 8000/5432/6543 不冲突):
#   api-gw(网关,新版 supabase/docker 默认用 Envoy 不是 Kong,
#          但 .env 里仍叫 KONG_HTTP_PORT/API_GW_HTTP_PORT 兼容旧键名)-> 8100
#   supavisor session pooling (POSTGRES_PORT)                      -> 5433
#   supavisor transaction pooling (POOLER_PROXY_PORT_TRANSACTION)  -> 6544
#
# studio 本来就没有对外 ports(新版 compose 里 studio 只在容器网络内被 api-gw 反代),
# 不需要额外锁定。
#
# 踩坑记录:docker compose 对 `ports` 这类数组字段默认是"合并/拼接"而不是"替换"——
# 光写这个 override 文件,base docker-compose.yml 里原来不绑 host IP 的 ports 行还在,
# 会拼出两条指向同一个 host 端口的映射,容器起不来。必须用 Compose Specification 的
# `!override` merge 标签强制替换整个 ports 数组(需要 docker compose >= v2.24 / 这台机器上是 v5.1.3)。
#
# 另外这个文件要能被自动加载,~/otto-supabase/docker/.env 里的 COMPOSE_FILE 必须显式
# 包含它(这份新版 supabase/docker 的 .env.example 自带 `COMPOSE_FILE=docker-compose.yml`,
# 设了这个变量后 compose 就不会再"顺手"叠加同目录的 docker-compose.override.yml 了,
# 得手动改成 `COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml`)。

services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8100}:8000"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6544}:6543"

  # issue #77:Envoy 的 realtime 集群写死了 upstream 主机名
  # `realtime-dev.supabase-realtime:4000`(`volumes/api/envoy/cds.yaml`,
  # `type: STRICT_DNS`)。那个名字原本来自 base compose 里 realtime 服务的
  # `container_name:` —— 而本部署把全部 11 行 `container_name:` 删掉了
  # (README「关键决定 / 踩坑」第 2 条),于是这个主机名在 docker DNS 里不存在,
  # STRICT_DNS 解析不到任何 endpoint,Envoy 对 /realtime/v1/* 一律回
  # 503 `no healthy upstream`。README 第 2 条当时写「确认过 compose 文件内部
  # 没有任何地方用 container_name 的值当 hostname 互相访问」——这句话对
  # **compose 文件**成立,但漏了挂载进网关的 envoy 配置,它正是这么用的。
  #
  # 补一个网络别名而不是去改 `volumes/api/envoy/cds.yaml`:那份是 upstream
  # 原样 clone 下来的文件,改它等于以后每次升级 supabase/docker 都要重新打一遍
  # 补丁,而删 container_name 这个决定当初图的就是"升级时脚本可以照抄"。
  # 别名这条路 upstream 自己就在用:base compose 里 api-gw 服务挂着
  # `aliases: [envoy, kong]`,理由一模一样(内部配置引用的是旧网关的名字)。
  #
  # 名字不能随便取:realtime 是多租户的,靠**解析 Host 的子域**得出 tenant id
  # (base compose 在那行 container_name 上方的注释原话:"realtime constructs
  # tenant id by parsing the subdomain"),健康检查打的是
  # `/api/tenants/realtime-dev/health`。所以别名必须正好是
  # `realtime-dev.supabase-realtime`,子域正好是 `realtime-dev`。
  realtime:
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime

  # Task 3: 官方 docker-compose.yml 的 auth 服务 environment 是显式白名单,
  # GOTRUE_EXTERNAL_GOOGLE_*/GITHUB_* 这几个键完全不在名单里(base 文件里只有
  # 被注释掉的示例,而且引用的是 ${GOOGLE_ENABLED} 这种不同的变量名),不会自动
  # 从 .env 透传进容器。这里显式把 .env 里已经填好的 8 个键映射进 auth 的
  # environment——值仍然是 ${VAR} 引用,不把 CLIENT_ID/SECRET 写死进这个文件
  # (这个文件要回抄进 git repo,不能带密钥)。
  auth:
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI}
