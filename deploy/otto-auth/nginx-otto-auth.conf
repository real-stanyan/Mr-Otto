# 部署状态(2026-08-17):此为服务器上当前生效的版本(仅 HTTP/80)。
# certbot --nginx 未能签发证书 —— 不是这份 vhost 的问题,是 otto-auth.duckdns.org
# 的公网流量在到达这台 VPS 之前,先被一个上游反代/网关拦截并短路返回了它自己的
# catch-all 404(证书 CN=catch-all, O=Atlas),LE 的 HTTP-01 挑战因此拿不到 200。
# 细节见 deploy/otto-auth/README.md「TLS 部署」一节。TLS 跑通后需回抄 certbot
# 改写后的最终版(会新增 443 server block + 80→443 跳转)替换本文件。
server {
    listen 80;
    server_name otto-auth.duckdns.org;
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;   # 必需:Envoy 网关对 HTTP/1.0 请求回 426 Upgrade Required
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
