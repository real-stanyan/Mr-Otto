# 部署状态(2026-08-17,方案变更后的最终版):服务器上当前生效的版本,仅监听 80。
# 域名从 otto-auth.duckdns.org 改为 otto-auth.stan.damianslife.com——原因见
# deploy/otto-auth/README.md「TLS 部署」一节:duckdns 域名前面的网关只对手动
# 登记的规则放行,otto-auth.duckdns.org 从未登记过;*.stan.damianslife.com 是
# 网关持有通配符 Let's Encrypt 证书、自动放行的域,443 在网关终止 TLS 后以明文
# HTTP 转发到这台 VM 的 80。**这台机器上不再需要 certbot**——TLS 由网关代管,
# 这台 VM 只在 80 上做反代。
#
# 这份文件是服务器上 /etc/nginx/sites-available/otto-auth 的**回抄**,不是模板:
# 改配置的顺序是先改服务器、`nginx -t` 过、再把生效版本抄回这里(issue #76 的
# 教训是反过来做会漂——仓库里这份曾经落后服务器两个 location:#45 的 /gw/ 和
# #76 的 /rest/v1/ + /realtime/v1/ 都只在服务器上存在过)。
#
# 现在放行四个前缀:/auth/v1/(GoTrue)、/gw/(otto-gateway)、/rest/v1/(PostgREST)、
# /realtime/v1/(Realtime websocket)。其余一律 404。
server {
    listen 80;
    server_name otto-auth.stan.damianslife.com;
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;   # 必需:Envoy 网关对 HTTP/1.0 请求回 426 Upgrade Required
        proxy_set_header Host $host;
        # X-Forwarded-Proto:网关传什么就原样透传,不在这里写死 $scheme(网关到
        # 这台 VM 是明文 HTTP,$scheme 在这一跳会是 http,如果写死反而丢失网关
        # 侧的真实协议信息)。GoTrue 出绝对 URL 靠 API_EXTERNAL_URL,不依赖这个头。
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # otto-gateway：官方 key 网关（issue #45 / ADR-0019）。
    # 尾斜杠让 /gw/v1/... 转发时剥掉 /gw 前缀 → 网关看到的是 /v1/...
    location /gw/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        # SSE 命门：不关缓冲，流会被 nginx 攒成一坨等到最后才吐，
        # 客户端那边就成了"卡半天然后一次性刷出来"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # PostgREST（好友系统的找人/关系/私信全走这条）。Kong 已经在跑，这里只是
    # 把公网前缀放行；唯一的闸门是 RLS —— public 下每张表都开了 RLS 且有 policy，
    # 钱和牌的函数只授权给 service_role（issue #76）
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Realtime 是 websocket：少了 Upgrade/Connection 两个头，握手会被降级成普通
    # HTTP 然后 400，好友请求/消息的实时推送就静默失效
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
