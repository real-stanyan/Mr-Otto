<title>Otto 微信式桌面</title>
<style>
/*@@SHARED_CSS@@*/

/* ── 桌面骨架：竖条 64 / 会话列表 280 / 聊天区 ─────────────────────────── */
.win { display: grid; grid-template-columns: 64px 280px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; overflow: hidden; }
.win > * { min-height: 0; }
.rail {
  position: relative;
  background: var(--rail);
  border-right: 1px solid var(--line-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 48px 0 14px;
}
.lights { position: absolute; top: 17px; left: 14px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.rail-me { border-radius: 8px; margin-bottom: 10px; position: relative; transition: transform 120ms var(--ease); }
.rail-me:active { transform: scale(0.95); }
.rail-me::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 10px;
  box-shadow: 0 0 0 2px var(--tab-active);
  opacity: 0;
  transition: opacity 150ms var(--ease);
}
.rail-me[aria-current="page"]::after { opacity: 1; }
.rail-btn {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--fg-2);
  transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
}
.rail-btn:hover { background: var(--hover); color: var(--fg); }
.rail-btn:active { transform: scale(0.94); }
.rail-btn[aria-current="page"] { color: var(--tab-active); }
.rail-btn .badge { top: 1px; right: -1px; box-shadow: 0 0 0 2px var(--rail); }
.rail-spacer { flex: 1; }

.col { background: var(--side); border-right: 1px solid var(--line-2); display: flex; flex-direction: column; min-width: 0; }
.col-head { height: 58px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.search {
  flex: 1;
  min-width: 0;
  height: 28px;
  border-radius: 6px;
  background: var(--field);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  color: var(--fg-3);
  transition: box-shadow 150ms var(--ease);
}
.search:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 35%, transparent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; height: 100%; padding: 0; color: var(--fg); }
.col-head .icon-btn { width: 28px; height: 28px; background: var(--field); color: var(--fg); }
.col-head .icon-btn:hover { background: var(--press); }
.col-body { flex: 1; min-height: 0; }
.sub-head { height: 58px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.sub-head .t { flex: 1; font-weight: 600; font-size: 14px; text-align: center; margin-right: 28px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 会话列表的一行 */
.crow {
  width: 100%;
  height: 66px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 14px;
  text-align: left;
  position: relative;
  transition: background-color 100ms linear;
}
.crow:hover { background: var(--hover); }
.crow[aria-current="true"] { background: var(--select); color: var(--select-fg); }
.crow .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.crow .top { display: flex; align-items: baseline; gap: 8px; }
.crow .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .tm { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; flex: none; }
.crow .pv { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow[aria-current="true"] .tm, .crow[aria-current="true"] .pv { color: var(--select-fg-2); }
.crow .pv b { font-weight: 500; color: var(--fg); }
.crow .pv .at { color: var(--brand); font-weight: 500; }
:root[data-skin="green"] .crow .pv .at { color: #fa5151; }
.crow[aria-current="true"] .pv .at, .crow[aria-current="true"] .pv b { color: inherit; }
.crow .fold { color: var(--fg-3); }
.list-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--fg-2); padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between; }
.list-label .icon-btn { width: 22px; height: 22px; }
.crow .sub-role { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow.entry { height: 56px; }
.crow .tile { width: 36px; height: 36px; border-radius: 6px; background: var(--raised); color: var(--fg-2); display: grid; place-items: center; flex: none; }
.crow .count { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.crow.me-top { height: auto; padding: 12px 14px; gap: 12px; }
.me-card { display: flex; align-items: center; gap: 18px; background: var(--surface); border-radius: 12px; padding: 18px; }
.me-card .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.me-card .link { font-size: 12.5px; color: var(--fg-2); padding: 4px 2px; }
.me-card .link:hover { color: var(--fg); }
.crow .pill-badge { position: static; box-shadow: none; }

.gate-card { margin: 4px 12px 10px; padding: 14px; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.gate-card .h { font-weight: 600; font-size: 13.5px; }
.gate-card p { margin: 0; font-size: 12.5px; color: var(--fg-2); line-height: 1.55; }
.gate-card .btn { align-self: flex-start; height: 30px; }

/* ── 聊天区 ──────────────────────────────────────────────────────────── */
.pane { display: flex; flex-direction: column; min-width: 0; background: var(--ground); position: relative; }
.pane-head {
  height: 58px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px 0 24px;
  border-bottom: 1px solid var(--line-2);
}
.pane-head .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane-head .title .cnt { font-weight: 400; color: var(--fg-2); margin-left: 2px; }
.pane-head .status { font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.pane-head .spacer { flex: 1; }
.pane-body { flex: 1; min-height: 0; padding: 18px 24px 22px; }
.composer { flex: none; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; padding: 10px 16px 12px 24px; height: 152px; position: relative; }
.composer textarea {
  flex: 1;
  border: 0;
  resize: none;
  background: transparent;
  font-size: 14px;
  line-height: 1.6;
  padding: 2px 0;
  color: var(--fg);
}
.composer .bar { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
.composer .bar .hint { margin-left: auto; margin-right: 10px; font-size: 11.5px; color: var(--fg-3); opacity: 0; transition: opacity 150ms var(--ease); }
.composer:focus-within .bar .hint { opacity: 1; }
.composer .send { height: 30px; padding: 0 18px; }
.empty-pane { flex: 1; display: grid; place-items: center; }
.empty-pane .inner { display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.55; }
.empty-pane .inner .av { opacity: 0.8; }
.empty-pane .word { font-size: 12px; color: var(--fg-3); letter-spacing: 0.04em; }

/* 浮层：表情 / @ 名单 */
.pop {
  position: absolute;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 8px;
  z-index: 20;
  opacity: 0;
  transform: translateY(4px) scale(0.98);
  pointer-events: none;
  transition: opacity 140ms var(--ease), transform 180ms var(--ease);
  transform-origin: bottom left;
}
.pop.on { opacity: 1; transform: none; pointer-events: auto; }
.mention-list { width: 240px; display: flex; flex-direction: column; }
.mention-list button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; text-align: left; }
.mention-list button[aria-selected="true"], .mention-list button:hover { background: var(--hover); }
.mention-list .r { font-size: 11.5px; color: var(--fg-2); margin-left: auto; }

/* 右侧「聊天信息」抽屉 */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 340px;
  background: var(--surface);
  box-shadow: -1px 0 0 var(--line-2), var(--shadow-float);
  transform: translateX(calc(100% + 24px));
  transition: transform 260ms var(--ease);
  z-index: 30;
  display: flex;
  flex-direction: column;
}
.drawer.on { transform: none; }
.drawer-head { height: 58px; flex: none; display: flex; align-items: center; padding: 0 12px 0 20px; font-weight: 600; font-size: 14px; gap: 8px; }
.drawer-head .spacer { flex: 1; }
.drawer-body { flex: 1; min-height: 0; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.drawer .inset { background: var(--ground); }
.members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; padding: 4px 2px; }
.member { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.member .n { font-size: 11.5px; color: var(--fg-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .add {
  width: 46px;
  height: 46px;
  border-radius: 8px;
  border: 1.5px dashed var(--line);
  display: grid;
  place-items: center;
  color: var(--fg-2);
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.member .add:hover { background: var(--hover); color: var(--fg); }
.member button.av-btn { border-radius: 8px; transition: transform 120ms var(--ease); }
.member button.av-btn:active { transform: scale(0.95); }

/* 资料页（通讯录里点开一只 / 一个人） */
.profile { width: min(460px, 100%); margin: 0 auto; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 18px; }
.profile .head { display: flex; align-items: flex-start; gap: 18px; }
.profile .head .who { flex: 1; min-width: 0; padding-top: 4px; }
.profile .head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.profile .head .role { margin-top: 6px; color: var(--fg-2); font-size: 13px; line-height: 1.55; }
.kind-tag { font-size: 11px; font-weight: 500; color: var(--fg-2); background: var(--field); border-radius: 5px; padding: 1px 6px; letter-spacing: 0.02em; }
.profile .actions { display: flex; gap: 10px; }
.profile .actions .btn { flex: 1; height: 38px; }
.detail { width: min(560px, 100%); margin: 0 auto; padding: 40px 24px; display: flex; flex-direction: column; gap: 18px; }
.detail h2 { margin: 0 0 2px; font-size: 20px; font-weight: 600; }
.detail .lead-p { margin: 0; color: var(--fg-2); font-size: 13px; line-height: 1.6; }
.quota { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quota.one { grid-template-columns: 1fr; }
.quota .cell { background: var(--surface); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.quota .k { font-size: 12px; color: var(--fg-2); }
.quota .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.quota .v small { font-size: 12px; color: var(--fg-2); font-weight: 400; margin-left: 4px; }
.quota .r { font-size: 11.5px; color: var(--fg-3); }
.usage-row { display: grid; grid-template-columns: 28px 64px 1fr 44px; align-items: center; gap: 10px; padding: 8px 14px; }
.usage-row .n { font-size: 13px; }
.usage-row .p { font-size: 12px; color: var(--fg-2); text-align: right; font-variant-numeric: tabular-nums; }
.tree-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 13px; }
.tree-row .ic { color: var(--fg-3); }
.tree-row .sz { margin-left: auto; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.file-preview { background: var(--surface); border-radius: 12px; padding: 16px 18px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
.app-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.app-dot.off { background: var(--fg-3); }

/* 通话小窗：浮在上面，不挡着聊天（通话里照样能打字） */
.call {
  position: fixed;
  top: 76px;
  right: 28px;
  width: 320px;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 22px;
  gap: 14px;
  z-index: 35;
  opacity: 0;
  transform: scale(0.96) translateY(-6px);
  pointer-events: none;
  transition: opacity 180ms var(--ease), transform 220ms var(--ease);
}
.call.on { opacity: 1; transform: none; pointer-events: auto; }
.call .top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--call-fg-2); cursor: grab; user-select: none; }
.call .top .timer { font-variant-numeric: tabular-nums; }
.call .nm { font-size: 17px; font-weight: 600; margin-top: -4px; }
.call .st { font-size: 12.5px; color: var(--call-fg-2); margin-top: -10px; }
.call .ctrls { display: flex; gap: 22px; margin-top: 4px; }
.call .ctrls > div { display: flex; flex-direction: column; align-items: center; }
.call .tiles { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.call .tiles .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--call-fg-2); }

/* demo 面板 */
.demo {
  position: fixed;
  left: 74px;
  bottom: 12px;
  width: 340px;
  max-height: calc(100dvh - 24px);
  overflow: auto;
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow-float);
  padding: 16px 16px 14px;
  z-index: 45;
  display: flex;
  flex-direction: column;
  gap: 14px;
  opacity: 0;
  transform: translateY(6px) scale(0.98);
  transform-origin: bottom left;
  pointer-events: none;
  transition: opacity 160ms var(--ease), transform 200ms var(--ease);
}
.demo.on { opacity: 1; transform: none; pointer-events: auto; }
.demo .h { display: flex; align-items: center; justify-content: space-between; }
.demo .h b { font-size: 14px; }
.demo .ctl { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px 10px; font-size: 12.5px; color: var(--fg-2); }
.demo a { color: var(--brand); }

.pane-head .back { display: none; }
.pane-head.bare { display: none; }

/* 窄一点的窗口：三栏照旧，只收窄列表（微信 Mac 版拖窄了也是这样） */
@media (max-width: 1000px) { .win { grid-template-columns: 60px 240px minmax(0, 1fr); } }
@media (max-width: 760px) {
  .win { grid-template-columns: 60px 216px minmax(0, 1fr); }
  .lights { left: 10px; gap: 6px; }
  .crow { padding: 0 10px; gap: 9px; }
  .pane-head { padding-left: 16px; }
  .pane-body { padding: 14px 16px 18px; }
  .composer { padding-left: 16px; }
}
/* 真到手机那么窄才退成一栏：列表和聊天轮流占满，头部有返回 */
@media (max-width: 560px) {
  .win { grid-template-columns: 52px minmax(0, 1fr); }
  .win .pane { display: none; }
  .win.pane-open .col { display: none; }
  .win.pane-open .pane { display: flex; }
  .rail { padding-top: 16px; }
  .lights { display: none; }
  .pane-head .back { display: grid; }
  .pane-head.bare { display: flex; border-bottom: 0; }
  .drawer { width: 100%; }
  .demo { left: 8px; right: 8px; width: auto; }
  .call { right: 12px; left: 12px; width: auto; }
}

/* 第一次打开时一句提示，指着左下角那颗说明钮；不挡任何东西 */
.hint-tip {
  position: fixed;
  left: 66px;
  bottom: 20px;
  background: var(--menu);
  color: var(--menu-fg);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  box-shadow: var(--shadow-float);
  z-index: 44;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-4px);
  pointer-events: none;
  transition: opacity 180ms var(--ease), transform 220ms var(--ease);
}
.hint-tip::before { content: ""; position: absolute; left: -4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; background: inherit; transform: rotate(45deg); border-radius: 1px; }
.hint-tip.on { opacity: 1; transform: none; }
</style>

<div class="win" id="win">
  <nav class="rail" aria-label="主导航">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <button class="rail-me" data-nav="me" title="我"></button>
    <button class="rail-btn" data-nav="chats" title="聊天"></button>
    <button class="rail-btn" data-nav="contacts" title="通讯录"></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="demo-btn" title="Demo 说明与开关"></button>
  </nav>
  <section class="col" id="col"></section>
  <main class="pane" id="pane"></main>
</div>
<aside class="drawer" id="drawer" aria-label="聊天信息"></aside>
<div class="scrim" id="scrim"></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="call call-shell" id="call" role="dialog" aria-label="语音通话"></div>
<div class="demo" id="demo"></div>
<div class="hint-tip" id="hint" role="status">demo 的说明和开关在这里</div>

<script>/*@@OTTOFACE@@*/</script>
<script>/*@@ICONS@@*/</script>
<script>/*@@SHARED_JS@@*/</script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const win = $("#win"), colEl = $("#col"), paneEl = $("#pane"), drawer = $("#drawer"), scrim = $("#scrim"), dialog = $("#dialog"), menu = $("#menu"), callEl = $("#call"), demo = $("#demo");

  const S = {
    view: "chats",       // chats | contacts | me
    open: null,          // 开着的聊天 id
    contact: null,       // 通讯录里选中的：{type, id}
    me: "quota",         // 「我」里选中的那一格
    sub: "pro",          // pro | free
    q: "",               // 搜索
    call: null,
  };

  /* ── 竖条 ─────────────────────────────────────────────────────────── */
  function renderRail() {
    const me = $(".rail-me");
    me.innerHTML = avatar("me", 34);
    me.setAttribute("aria-current", S.view === "me" ? "page" : "false");
    const unread = S.sub === "free" ? Object.values(CHATS).filter(visibleChat).reduce((n, c) => n + c.unread, 0) : totalUnread();
    const chats = $('[data-nav="chats"]');
    chats.innerHTML = ic("message-circle", 22, S.view === "chats" ? 2.1 : 1.75) + (unread ? `<span class="badge">${unread > 99 ? "99+" : unread}</span>` : "");
    chats.setAttribute("aria-current", S.view === "chats" ? "page" : "false");
    const con = $('[data-nav="contacts"]');
    con.innerHTML = ic("contact-round", 22, S.view === "contacts" ? 2.1 : 1.75) + (FRIEND_REQUESTS.length ? `<span class="badge">${FRIEND_REQUESTS.length}</span>` : "");
    con.setAttribute("aria-current", S.view === "contacts" ? "page" : "false");
    $("#demo-btn").innerHTML = ic("info", 20);
  }
  $$(".rail [data-nav]").forEach((b) => b.addEventListener("click", () => go(b.dataset.nav)));
  function go(view) {
    closeDrawer();
    /* 窄到一栏时，再点一次「聊天」= 回到列表 */
    if (view === "chats" && S.view === "chats" && matchMedia("(max-width: 560px)").matches) { S.open = null; Sim.setOpen(null); }
    S.view = view;
    if (view !== "chats") Sim.setOpen(null);
    else if (S.open) Sim.setOpen(S.open);
    renderAll();
  }

  /* ── 可见性（没订阅时，自己的智能体那一半不在） ─────────────────────── */
  function visibleChat(c) {
    if (S.sub !== "free") return true;
    if (c.kind === "dm") return false;
    if (c.kind === "group" && c.owner === "me") return false; // 自己建的群里是自己的智能体
    return true;
  }
  function matchQ(text) { return !S.q || text.toLowerCase().includes(S.q.toLowerCase()); }

  /* ── 左栏 ─────────────────────────────────────────────────────────── */
  function colHead(placeholder) {
    return `<header class="col-head"><label class="search">${ic("search", 15)}<input id="q" placeholder="${placeholder}" value="${esc(S.q)}" autocomplete="off"></label><button class="icon-btn" id="plus" title="新建" aria-haspopup="menu">${ic("plus", 17, 2)}</button></header>`;
  }
  function renderCol() {
    let body = "";
    if (S.view === "chats") body = chatListHTML();
    if (S.view === "contacts") body = contactListHTML();
    if (S.view === "me") body = meListHTML();
    colEl.innerHTML = colHead(S.view === "contacts" ? "搜索智能体、朋友" : "搜索") + `<div class="col-body scroll" id="col-body">${body}</div>`;
    const q = $("#q");
    q.addEventListener("input", () => { S.q = q.value; const pos = q.selectionStart; renderCol(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); });

       和朋友之间今天没有通话 */

  function composerHTML(c) {
    const ph = c.kind === "group" ? "说点什么，输入 @ 点名…" : c.onboarding ? `回一句话，它就知道自己该干什么了` : `跟${chatTitle(c)}说点什么`;
    const at = c.kind === "group" ? `<button class="icon-btn" data-act="at" title="@ 谁">${ic("at-sign", 18)}</button>` : "";
    return `<div class="composer" id="composer">
      <textarea id="ta" placeholder="${esc(ph)}" aria-label="输入消息" enterkeyhint="send">${esc(c.draft || "")}</textarea>
      <div class="bar">
        <button class="icon-btn" data-act="emoji" title="表情">${ic("smile", 18)}</button>${at}
        <span class="hint">Enter 发送 · Shift + Enter 换行</span>
        <button class="btn primary send" id="send" disabled>发送</button>
      </div>
      <div class="pop" id="emoji-pop" style="left:14px;bottom:calc(100% + 6px);width:312px"><div class="emoji-grid">${EMOJI.map((e) => `<button data-emoji="${e}">${e}</button>`).join("")}</div></div>
      <div class="pop mention-list" id="at-pop" style="left:14px;bottom:calc(100% + 6px)"></div>
    </div>`;
  }
  function syncSend() { const ta = $("#ta"); if (ta) $("#send").disabled = !ta.value.trim(); }
  function bindComposer(c) {
    const ta = $("#ta");
    const atPop = $("#at-pop"), emoPop = $("#emoji-pop");
    let atSel = 0, atItems = [];
    ta.addEventListener("input", () => {
      syncSend();
      c.draft = ta.value;
      const before = ta.value.slice(0, ta.selectionStart);
      const m = before.match(/(^|[\s，。])@([^\s@]*)$/);
      if (c.kind === "group" && m) showAt(m[2]); else hidePop(atPop);
    });
    ta.addEventListener("keydown", (e) => {
      if (atPop.classList.contains("on")) {
        if (e.key === "ArrowDown") { e.preventDefault(); atSel = (atSel + 1) % atItems.length; paintAt(); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); atSel = (atSel - 1 + atItems.length) % atItems.length; paintAt(); return; }
        if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); pickAt(atItems[atSel]); return; }
        if (e.key === "Escape") { hidePop(atPop); return; }
      }
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); doSend(); }
    });
    $("#send").addEventListener("click", doSend);
    function doSend() {
      const text = ta.value;
      if (!text.trim()) return;
      ta.value = "";
      c.draft = "";
      syncSend();
      hidePop(atPop);
      Sim.send(c, text);
    }
    function membersOf() {
      return [...c.agents.map((id) => ({ id, name: AGENTS[id].name, r: "智能体" })), ...(c.humans || []).map((id) => ({ id, name: FRIENDS[id].name, r: "朋友" }))];
    }
    function showAt(q) {
      atItems = membersOf().filter((m) => m.name.includes(q));
      if (!atItems.length) return hidePop(atPop);
      atSel = 0;
      paintAt();
      atPop.classList.add("on");
    }
    function paintAt() {
      atPop.innerHTML = atItems.map((m, i) => `<button data-pick="${m.id}" aria-selected="${i === atSel}">${avatar(m.id, 24)}<span>${esc(m.name)}</span><span class="r">${m.r}</span></button>`).join("");
      Face.hydrate(atPop);
      $$("[data-pick]", atPop).forEach((b, i) => b.addEventListener("mousedown", (e) => { e.preventDefault(); pickAt(atItems[i]); }));
    }
    function pickAt(m) {
      const pos = ta.selectionStart;
      const before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + m.name + " ");
      ta.value = before + ta.value.slice(pos);
      ta.setSelectionRange(before.length, before.length);
      hidePop(atPop);
      syncSend();
      ta.focus();
    }
    $$("[data-emoji]", emoPop).forEach((b) => b.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, pos) + b.dataset.emoji + ta.value.slice(ta.selectionEnd);
      ta.setSelectionRange(pos + b.dataset.emoji.length, pos + b.dataset.emoji.length);
      syncSend();
    }));
    paneEl.querySelector('[data-act="emoji"]').addEventListener("click", (e) => { e.stopPropagation(); hidePop(atPop); emoPop.classList.toggle("on"); });
    const atBtn = paneEl.querySelector('[data-act="at"]');
    if (atBtn) atBtn.addEventListener("click", () => {
      const pos = ta.selectionStart;
      const pre = ta.value.slice(0, pos);
      const ins = (pre && !/\s$/.test(pre) ? " " : "") + "@";
      ta.value = pre + ins + ta.value.slice(pos);
      ta.setSelectionRange(pos + ins.length, pos + ins.length);
      ta.focus();
      showAt("");
    });
    syncSend();
    setTimeout(() => ta.focus(), 0);
  }
  function hidePop(p) { p && p.classList.remove("on"); }
  document.addEventListener("click", (e) => {
    const pop = $("#emoji-pop");
    if (pop && !pop.contains(e.target)) hidePop(pop);

    showDialog(`<h3>说话的声音</h3><p class="desc">打电话时它用这个声音。</p><div class="inset" style="background:var(--ground)">${voices.map((v) => `<button class="row" data-v="${v}"><span class="t">${v}</span><span class="chk" style="color:var(--brand);opacity:${v === sel ? 1 : 0}">${ic("check", 16, 2.2)}</span></button>`).join("")}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">保存</button></div>`, (d) => {
      $$("[data-v]", d).forEach((b) => b.addEventListener("click", () => { sel = b.dataset.v; $$("[data-v] .chk", d).forEach((x) => (x.style.opacity = x.parentElement.dataset.v === sel ? 1 : 0)); }));
      d.querySelector("#ok").addEventListener("click", () => { a.voice = sel; closeDialog(); renderAll(); if (drawer.classList.contains("on")) openInfo(CHATS[S.open]); });
    });
  }

  function newAgentDialog() {
    let sel = 9;
    showDialog(`<h3>新建智能体</h3><p class="desc">起个名字、挑张脸。建好它会先跟你打招呼，你回的第一句话就是它的职责。</p>
      <div style="display:flex;justify-content:center;margin:2px 0 14px"><span class="av" id="prev" style="--s:88px;border-radius:16px" data-face="${sel}" data-state="alive" data-size="88"></span></div>
      <input class="field" id="nm" placeholder="名字，比如「客服」「小周」" maxlength="12" style="margin-bottom:14px">
      ${faceWall(sel)}
      <div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok" disabled>创建</button></div>`, (d) => {
      const nm = d.querySelector("#nm"), ok = d.querySelector("#ok");
      nm.addEventListener("input", () => (ok.disabled = !nm.value.trim()));
      nm.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && nm.value.trim()) ok.click(); });
      $$(".face-pick", d).forEach((b) => b.addEventListener("click", () => {
        sel = +b.dataset.slot;
        $$(".face-pick", d).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.slot === sel)));
        const prev = d.querySelector("#prev");
        prev.removeAttribute("data-hyd");
        prev.innerHTML = "";
        prev.dataset.face = sel;
        Face.hydrate(d);
      }));
      ok.addEventListener("click", () => {
        const name = nm.value.trim();
        const id = "a_" + Math.random().toString(36).slice(2, 8);
        AGENTS[id] = { id, name, slot: sel, role: "还没定", voice: "清亮女声", usage: 0 };
        MY_AGENTS.push(id);
        const cid = "c_" + id;
        CHATS[cid] = { id: cid, kind: "dm", agent: id, unread: 0, msgs: [] };
        closeDialog();
        openChat(cid);
        greet(CHATS[cid]);
      });
    });
  }
  async function greet(c) {
    const a = AGENTS[c.agent];
    c.pending = { agent: a.id, phase: "typing" };
    Sim.emit(c.id);
    await new Promise((r) => setTimeout(r, 1100));
    c.pending = null;
    Sim.push(c, a.id, `你好，我是${a.name}。你想让我帮你干点什么？`);
    await new Promise((r) => setTimeout(r, 650));
    c.onboarding = true;
    Sim.push(c, a.id, "说一句就行，这句话就是我以后的职责，写错了随时能改。");
  }

  /* 挑人：智能体和朋友分两段，一个群里两样都可以有（维护者 2026-09-27：不分团队和群聊） */
  function pickMembersDialog(o, fn) {
    const selA = new Set((o.preset && o.preset.agents) || []), selF = new Set((o.preset && o.preset.friends) || []);
    const chk = `<span class="chk" style="color:var(--brand)">${ic("check", 16, 2.2)}</span>`;
    const rowA = (id) => `<button class="row" data-pa="${id}" style="--inset:52px">${avatar(id, 30)}<span class="t">${esc(AGENTS[id].name)}<span class="sub">${esc(AGENTS[id].role)}</span></span>${chk}</button>`;
    const rowF = (id) => `<button class="row" data-pf="${id}" style="--inset:52px">${avatar(id, 30)}<span class="t">${esc(FRIENDS[id].name)}<span class="sub">${esc(FRIENDS[id].note)}</span></span>${chk}</button>`;
    const sec = (label, ids, row) => ids.length ? `<div class="group-label" style="padding:12px 4px 6px">${label}</div><div class="inset" style="background:var(--ground)">${ids.map(row).join("")}</div>` : "";
    showDialog(`<h3>${esc(o.title)}</h3>${o.desc ? `<p class="desc">${esc(o.desc)}</p>` : ""}${o.withName ? `<input class="field" id="gn" maxlength="30">` : ""}<div id="cnt" style="text-align:right;font-size:11.5px;color:var(--fg-3);margin:8px 4px 0"></div><div class="scroll" style="max-height:min(52vh, 440px);margin:0 -6px;padding:0 6px">${sec("智能体", o.agents, rowA)}${sec("朋友", o.friends, rowF)}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">${esc(o.okLabel || "确定")}</button></div>`, (d) => {
      const draw = () => {
        $$("[data-pa]", d).forEach((b) => { const on = selA.has(b.dataset.pa); b.querySelector(".chk").style.opacity = on ? 1 : 0; b.disabled = !on && selA.size >= o.maxAgents; b.style.opacity = b.disabled ? 0.45 : 1; });
        $$("[data-pf]", d).forEach((b) => { b.querySelector(".chk").style.opacity = selF.has(b.dataset.pf) ? 1 : 0; });
        const n = selA.size + selF.size;
        d.querySelector("#ok").disabled = n < (o.min || 1);
        d.querySelector("#cnt").textContent = `已选 ${selA.size} 只智能体 · ${selF.size} 位朋友`;
        const gn = d.querySelector("#gn");
        if (gn) gn.placeholder = n ? [...o.friends.filter((i) => selF.has(i)).map((i) => FRIENDS[i].name), ...o.agents.filter((i) => selA.has(i)).map((i) => AGENTS[i].name)].join("、") : "群名（不填就用成员名）";
      };
      $$("[data-pa]", d).forEach((b) => b.addEventListener("click", () => { selA.has(b.dataset.pa) ? selA.delete(b.dataset.pa) : selA.add(b.dataset.pa); draw(); }));
      $$("[data-pf]", d).forEach((b) => b.addEventListener("click", () => { selF.has(b.dataset.pf) ? selF.delete(b.dataset.pf) : selF.add(b.dataset.pf); draw(); }));
      d.querySelector("#ok").addEventListener("click", () => {
        const gn = d.querySelector("#gn");
        closeDialog();
        fn({ agents: o.agents.filter((i) => selA.has(i)), friends: o.friends.filter((i) => selF.has(i)), name: gn ? gn.value.trim() : "" });
      });
      draw();
    });
  }

  function newGroupDialog(preset = {}) {
    pickMembersDialog({
      title: "发起群聊",
      desc: "拉几只智能体、几个朋友，凑够 2 个就能建。没 @ 谁的话，智能体按职责自己接活。",
      agents: MY_AGENTS.slice(),
      friends: MY_FRIENDS.slice(),
      maxAgents: 6,
      min: 2,
      okLabel: "建群",
      withName: true,
      preset,
    }, ({ agents, friends, name }) => {
      const nm = name || [...friends.map((i) => FRIENDS[i].name), ...agents.map((i) => AGENTS[i].name)].join("、").slice(0, 30);
      const id = "g_" + Math.random().toString(36).slice(2, 7);
      CHATS[id] = { id, kind: "group", name: nm, owner: "me", humans: friends, agents, unread: 0, msgs: [] };
      openChat(id);
      Sim.push(CHATS[id], "sys", `你建了群聊「${nm}」`, "roster", { added: [...friends, ...agents] });
    });
  }
  function addFriendDialog() {
    showDialog(`<h3>添加朋友</h3><p class="desc">填对方的邮箱或用户名。加了朋友，才能拉 TA 进群、把你的应用借给 TA。</p><input class="field" id="fe" placeholder="邮箱或用户名"><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok" disabled>发送申请</button></div>`, (d) => {
      const fe = d.querySelector("#fe"), ok = d.querySelector("#ok");
      fe.addEventListener("input", () => (ok.disabled = !fe.value.trim()));
      ok.addEventListener("click", () => { closeDialog(); toast(`申请已发给 ${fe.value.trim()}，对方同意了会出现在朋友里`); });
    });
  }
  function subscribeDialog() {
    showDialog(`<h3>订阅</h3><p class="desc">Pro：自己的智能体，私聊、拉群、语音通话。Max：额度更多。</p><div class="inset" style="background:var(--ground)"><div class="row"><span class="t">Pro</span><button class="btn primary" style="height:30px" id="pro">订 Pro</button></div><div class="row"><span class="t">Max</span><button class="btn soft" style="height:30px" id="max">订 Max</button></div></div><div class="actions"><button class="btn soft" data-close>以后再说</button></div>`, (d) => {
      const done = () => { closeDialog(); S.sub = "pro"; renderAll(); renderDemo(); toast("demo：当作已经订上了"); };
      d.querySelector("#pro").addEventListener("click", done);
      d.querySelector("#max").addEventListener("click", done);
    });
  }
  function transcriptDialog(c, mid) {
    const m = c.msgs.find((x) => x.id === mid);
    if (!m) return;
    showDialog(`<h3>语音通话 · ${esc(m.meta.dur)}</h3><p class="desc">${esc(sepTime(m.t))} · ${m.meta.lines.length} 句</p><div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6">${m.meta.lines.map(([w, s, at]) => `<div style="display:grid;grid-template-columns:44px 1fr;gap:10px"><span style="color:var(--fg-3);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px">${at}</span><span><b style="font-weight:600">${esc(who(w).name)}</b>　${esc(s)}</span></div>`).join("")}</div><div class="actions"><button class="btn soft" data-close>关闭</button></div>`);
  }

  /* ── 通话 ─────────────────────────────────────────────────────────── */
  function startCall(c) {
    if (S.call) return;
    const agentId = c.kind === "dm" ? c.agent : chatParticipants(c).find((x) => AGENTS[x]);
    const script = callScript(agentId);
    const started = Date.now();
    const lines = [];
    const call = (S.call = { c, agentId, started, lines, muted: false, subs: true, stop: false });
    const tiles = c.kind === "dm" ? "" : `<div class="tiles">${chatParticipants(c).filter((x) => AGENTS[x]).slice(0, 3).map((id) => `<div class="tile"><span class="call-face" data-tile="${id}" style="width:64px;height:64px"><span class="av" style="--s:64px" data-face="${AGENTS[id].slot}" data-state="listening" data-size="64"></span></span>${esc(AGENTS[id].name)}</div>`).join("")}</div>`;
    const main = c.kind === "dm" ? `<span class="call-face" id="cface" style="width:132px;height:132px"><span class="av" style="--s:132px;border-radius:28%" data-face="${AGENTS[agentId].slot}" data-state="listening" data-size="132"></span></span><div class="nm">${esc(AGENTS[agentId].name)}</div><div class="st" id="cst">在听</div>` : `${tiles}<div class="nm">${esc(chatTitle(c))}</div><div class="st" id="cst">在听</div>`;
    callEl.innerHTML = `<div class="top" id="drag"><span>语音通话</span><span class="timer" id="ctime">00:00</span></div>${main}<div class="call-sub" id="csub"></div>
      <div class="ctrls"><div><button class="call-btn on" id="c-sub" title="转文字">${ic("type", 22)}</button><span class="call-label">转文字</span></div><div><button class="call-btn" id="c-mute" title="静音">${ic("mic", 22)}</button><span class="call-label">静音</span></div><div><button class="call-btn hang" id="c-end" title="挂断">${ic("phone-off", 24)}</button><span class="call-label">挂断</span></div></div>`;
    Face.hydrate(callEl);
    callEl.classList.add("on");
    const timer = setInterval(() => { const s = Math.floor((Date.now() - started) / 1000); $("#ctime").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 500);
    $("#c-end").addEventListener("click", endCall);
    $("#c-mute").addEventListener("click", (e) => { call.muted = !call.muted; e.currentTarget.classList.toggle("on", call.muted); e.currentTarget.innerHTML = ic(call.muted ? "mic-off" : "mic", 22); });
    $("#c-sub").addEventListener("click", (e) => { call.subs = !call.subs; e.currentTarget.classList.toggle("on", call.subs); $("#csub").style.visibility = call.subs ? "visible" : "hidden"; });
    dragWindow(callEl, $("#drag"));
    const faceEl = () => callEl.querySelector("#cface .av") || callEl.querySelector(`[data-tile="${agentId}"] .av`);
    const faceWrap = () => callEl.querySelector("#cface") || callEl.querySelector(`[data-tile="${agentId}"]`);
    (async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      await wait(900);
      for (const [w, text] of script) {
        if (call.stop) return;
        const agent = w !== "me";
        Face.setState(faceEl(), agent ? "speaking" : "listening");
        faceWrap().classList.toggle("talking", agent);
        $("#cst").textContent = agent ? "正在说" : "在听";
        const sub = $("#csub");
        for (let i = 1; i <= text.length; i++) {
          if (call.stop) return;
          sub.innerHTML = `<span class="who">${agent ? esc(AGENTS[agentId].name) : "你"}：</span>${esc(text.slice(0, i))}`;
          await wait(agent ? 70 : 55);
        }
        const s = Math.floor((Date.now() - started) / 1000);
        lines.push([w, text, `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`]);
        await wait(900);
      }
      Face.setState(faceEl(), "listening");
      faceWrap().classList.remove("talking");
      $("#cst").textContent = "在听";
    })();
    call.timer = timer;
  }
  function endCall() {
    const call = S.call;
    if (!call) return;
    call.stop = true;
    clearInterval(call.timer);
    callEl.classList.remove("on");
    const s = Math.max(1, Math.floor((Date.now() - call.started) / 1000));
    const dur = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    Sim.push(call.c, "me", "", "call", { dur, lines: call.lines });
    S.call = null;
  }
  function dragWindow(el, handle) {
    let sx, sy, ox, oy;
    handle.addEventListener("pointerdown", (e) => {
      const r = el.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      handle.setPointerCapture(e.pointerId);
      handle.style.cursor = "grabbing";
    });
    handle.addEventListener("pointermove", (e) => {
      if (!handle.hasPointerCapture(e.pointerId)) return;
      el.style.left = `${Math.max(8, Math.min(innerWidth - el.offsetWidth - 8, ox + e.clientX - sx))}px`;
      el.style.top = `${Math.max(8, Math.min(innerHeight - 60, oy + e.clientY - sy))}px`;
      el.style.right = "auto";
    });
    handle.addEventListener("pointerup", () => (handle.style.cursor = ""));
  }

  /* ── 小提示 ─────────────────────────────────────────────────────────── */
  function toast(text) {
    const t = document.createElement("div");
    t.textContent = text;
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--menu);color:var(--menu-fg);padding:8px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-float);z-index:70;transition:opacity 200ms var(--ease);max-width:calc(100vw - 32px)";
    document.body.appendChild(t);
    setTimeout(() => (t.style.opacity = "0"), 2200);
    setTimeout(() => t.remove(), 2500);
  }

  /* ── demo 面板 ───────────────────────────────────────────────────── */
  const pref = (() => { try { return JSON.parse(localStorage.getItem("otto-wx-demo") || "{}"); } catch { return {}; } })();
  function savePref() { try { localStorage.setItem("otto-wx-demo", JSON.stringify(pref)); } catch {} }
  function applyPref() {
    const r = document.documentElement;
    if (pref.theme === "light" || pref.theme === "dark") r.dataset.theme = pref.theme; else delete r.dataset.theme;
    if (pref.skin === "green") r.dataset.skin = "green"; else delete r.dataset.skin;
  }
  function renderDemo() {
    const seg = (key, opts, cur) => `<span class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</span>`;
    demo.innerHTML = `<div class="h"><b>微信式布局 · 桌面 demo</b><button class="icon-btn" id="demo-x" title="关闭">${ic("x", 16)}</button></div>
      <div class="ctl"><span>主题</span>${seg("theme", [["auto", "跟随系统"], ["light", "浅色"], ["dark", "深色"]], pref.theme || "auto")}
      <span>配色</span>${seg("skin", [["otto", "Otto"], ["green", "绿色气泡"]], pref.skin || "otto")}
      <span>订阅</span>${seg("sub", [["pro", "Pro"], ["free", "没订阅"]], S.sub)}</div>
      <p style="margin:0;color:var(--fg-2)">能点的都点点：发消息（群里试试 @），右上角「···」、电话，左上 + 号新建一只，头像进「我」。数据全是编的。<a href="wechat-mobile.html">手机 demo →</a></p>
      <div><h4>demo 里有、今天还没有的</h4><ul>${NEW_THINGS.map(([a, b]) => `<li><b>${a}</b>：${b}</li>`).join("")}</ul></div>
      <div><h4>这一版撤掉的（本机写代码那一半）</h4><ul>${REMOVED_THINGS.map((a) => `<li>${a}</li>`).join("")}</ul></div>`;
    $("#demo-x").addEventListener("click", () => demo.classList.remove("on"));
    $$("[data-k]", demo).forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === "sub") { S.sub = v; if (v === "free" && S.open && !visibleChat(CHATS[S.open])) S.open = null; renderAll(); }
      else { pref[k] = v; savePref(); applyPref(); }
      renderDemo();
    }));
  }
  $("#demo-btn").addEventListener("click", () => { renderDemo(); demo.classList.toggle("on"); });

  /* ── 装配 ─────────────────────────────────────────────────────────── */
  function renderAll() { renderRail(); renderCol(); renderPane(); }
  Sim.on((id) => {
    renderRail();
    const ae = document.activeElement;
    const typingInSearch = ae && ae.id === "q";
    if (!typingInSearch) renderCol();
    if (S.view === "chats" && S.open && (id === S.open || !id)) {
      const c = CHATS[S.open];
      if (c) { renderHead(c); renderTimeline(c, false); }
    }
  });
  applyPref();
  /* 宽屏一打开就是一条聊天（照微信 Mac 版）；窄到一栏时先给列表 */
  if (!matchMedia("(max-width: 560px)").matches) {
    S.open = "c_wenan";
    Sim.setOpen("c_wenan");
  }
  renderAll();
  renderDemo();
  /* 不自动弹面板（它会盖住会话列表），只在第一次打开时指一下那颗钮 */
  if (!pref.seen) {
    const hint = $("#hint");
    setTimeout(() => hint.classList.add("on"), 600);
    const off = () => { hint.classList.remove("on"); document.removeEventListener("pointerdown", off); };
    setTimeout(off, 7000);
    document.addEventListener("pointerdown", off);
    pref.seen = 1;
    savePref();
  }
})();
</script>
