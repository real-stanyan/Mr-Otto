<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otto 微信式桌面</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   微信式布局 demo 共用的一层（#1386）。
   令牌照 DESIGN.md：浅色暖纸 / 深色 Apple 四色底盘；「绿色气泡」那一套只是
   给维护者对照看的皮，不是提案的默认值。
   ───────────────────────────────────────────────────────────────────────── */

:root {
  /* 地面 / 浮起的表面 / 侧栏（竖条 + 会话列表） */
  --ground: #efece3;
  --surface: #f7f5ef;
  --side: #e9e5d8;
  --rail: #e9e5d8;
  --raised: #e5e1d3;
  --hover: rgba(0, 0, 0, 0.045);
  --press: rgba(0, 0, 0, 0.08);
  --select: #dce6f2;
  --select-fg: #000000;
  --select-fg-2: rgba(0, 0, 0, 0.55);
  --fg: #000000;
  --fg-2: rgba(0, 0, 0, 0.55);
  --fg-3: rgba(0, 0, 0, 0.4);
  --line: rgba(0, 0, 0, 0.12);
  --line-2: rgba(0, 0, 0, 0.07);
  --input: rgba(0, 0, 0, 0.12);
  --field: rgba(0, 0, 0, 0.055);
  --input-bg: #f7f5ef;
  --brand: #4a70a9;
  --primary: #4a70a9;
  --on-primary: #ffffff;
  --tab-active: #4a70a9;
  --bubble-them: #e5e1d3;
  --bubble-them-fg: #000000;
  --bubble-me: color-mix(in srgb, #4a70a9 18%, #f7f5ef);
  --bubble-me-fg: #000000;
  --bubble-radius: 12px;
  --badge: #4a70a9;
  --badge-fg: #ffffff;
  --danger: #c92a2a;
  --ok: #2b8a3e;
  --warn: #e67700;
  --face-disc: #f2f2f3;
  --voice: #2f94a6;
  --scrim: rgba(0, 0, 0, 0.28);
  --menu: #f7f5ef;
  --menu-fg: #000000;
  --menu-line: rgba(0, 0, 0, 0.08);
  --shadow-float: 0 12px 32px rgba(40, 32, 12, 0.16), 0 2px 6px rgba(40, 32, 12, 0.08);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000;
    --surface: #1d1d1f;
    --side: #1d1d1f;
    --rail: #1d1d1f;
    --raised: #2c2c2e;
    --hover: rgba(245, 245, 247, 0.05);
    --press: rgba(245, 245, 247, 0.09);
    --select: #2c2c2e;
    --select-fg: #f5f5f7;
    --select-fg-2: rgba(245, 245, 247, 0.56);
    --fg: #f5f5f7;
    --fg-2: rgba(245, 245, 247, 0.56);
    --fg-3: rgba(245, 245, 247, 0.38);
    --line: rgba(245, 245, 247, 0.12);
    --line-2: rgba(245, 245, 247, 0.07);
    --input: rgba(245, 245, 247, 0.14);
    --field: rgba(245, 245, 247, 0.08);
    --input-bg: #2c2c2e;
    --brand: #0a84ff;
    --primary: #0071e3;
    --tab-active: #0a84ff;
    --bubble-them: #2c2c2e;
    --bubble-them-fg: #f5f5f7;
    --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
    --bubble-me-fg: #f5f5f7;
    --badge: #0a84ff;
    --danger: #ff453a;
    --ok: #30d158;
    --warn: #ff9f0a;
    --scrim: rgba(0, 0, 0, 0.5);
    --menu: #2c2c2e;
    --menu-fg: #f5f5f7;
    --menu-line: rgba(245, 245, 247, 0.08);
    --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000;
  --surface: #1d1d1f;
  --side: #1d1d1f;
  --rail: #1d1d1f;
  --raised: #2c2c2e;
  --hover: rgba(245, 245, 247, 0.05);
  --press: rgba(245, 245, 247, 0.09);
  --select: #2c2c2e;
  --select-fg: #f5f5f7;
  --select-fg-2: rgba(245, 245, 247, 0.56);
  --fg: #f5f5f7;
  --fg-2: rgba(245, 245, 247, 0.56);
  --fg-3: rgba(245, 245, 247, 0.38);
  --line: rgba(245, 245, 247, 0.12);
  --line-2: rgba(245, 245, 247, 0.07);
  --input: rgba(245, 245, 247, 0.14);
  --field: rgba(245, 245, 247, 0.08);
  --input-bg: #2c2c2e;
  --brand: #0a84ff;
  --primary: #0071e3;
  --tab-active: #0a84ff;
  --bubble-them: #2c2c2e;
  --bubble-them-fg: #f5f5f7;
  --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
  --bubble-me-fg: #f5f5f7;
  --badge: #0a84ff;
  --danger: #ff453a;
  --ok: #30d158;
  --warn: #ff9f0a;
  --scrim: rgba(0, 0, 0, 0.5);
  --menu: #2c2c2e;
  --menu-fg: #f5f5f7;
  --menu-line: rgba(245, 245, 247, 0.08);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* 对照皮：绿色气泡（只为对照，不是提案） */
:root[data-skin="green"] {
  --ground: #ededed;
  --surface: #ffffff;
  --side: #f7f7f7;
  --rail: #ececec;
  --raised: #ffffff;
  --input-bg: #ffffff;
  --select: #dedede;
  --select-fg: #191919;
  --select-fg-2: rgba(0, 0, 0, 0.5);
  --fg: #191919;
  --brand: #07c160;
  --primary: #07c160;
  --tab-active: #07c160;
  --bubble-them: #ffffff;
  --bubble-them-fg: #191919;
  --bubble-me: #95ec69;
  --bubble-me-fg: #191919;
  --bubble-radius: 4px;
  --badge: #fa5151;
  --menu: #4c4c4c;
  --menu-fg: #ffffff;
  --menu-line: rgba(255, 255, 255, 0.1);
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="green"]:not([data-theme="light"]) {
    --ground: #111111;
    --surface: #1f1f1f;
    --side: #191919;
    --rail: #1f1f1f;
    --raised: #2c2c2c;
    --input-bg: #2c2c2c;
    --select: #07c160;
    --select-fg: #ffffff;
    --select-fg-2: rgba(255, 255, 255, 0.78);
    --fg: #d5d5d5;
    --bubble-them: #2c2c2c;
    --bubble-them-fg: #d5d5d5;
    --bubble-me: #3eb575;
    --bubble-me-fg: #0d0d0d;
    --menu: #2c2c2c;
  }
}
:root[data-skin="green"][data-theme="dark"] {
  --ground: #111111;
  --surface: #1f1f1f;
  --side: #191919;
  --rail: #1f1f1f;
  --raised: #2c2c2c;
  --input-bg: #2c2c2c;
  --select: #07c160;
  --select-fg: #ffffff;
  --select-fg-2: rgba(255, 255, 255, 0.78);
  --fg: #d5d5d5;
  --bubble-them: #2c2c2c;
  --bubble-them-fg: #d5d5d5;
  --bubble-me: #3eb575;
  --bubble-me-fg: #0d0d0d;
  --menu: #2c2c2c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--fg);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  caret-color: var(--brand);
}
::selection { background: color-mix(in srgb, var(--brand) 26%, transparent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); border-radius: 6px; }
.ic { display: block; flex: none; }

/* 滚动条跟着调色板走，不留浏览器默认的那一格 */
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ── 头像 ────────────────────────────────────────────────────────────────
   智能体 = 像素脸（纸白盘底，两个主题同值）；人 = 首字母；群 = 九宫格拼图。
   形状照微信：圆角方块，不是圆。 */
.av {
  --s: 40px;
  position: relative;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: calc(var(--s) * 0.16);
  overflow: hidden;
  background: var(--face-disc);
  display: inline-grid;
  place-items: center;
}
.av canvas { width: 100%; height: 100%; display: block; }
.av.human {
  background: var(--raised);
  color: var(--fg-2);
  font-weight: 600;
  font-size: calc(var(--s) * 0.42);
  line-height: 1;
}
.av.me-av { background: var(--fg); color: var(--ground); }
.av.grp {
  background: var(--raised);
  padding: calc(var(--s) * 0.06);
  gap: calc(var(--s) * 0.035);
  display: grid;
  align-content: center;
  justify-content: center;
}
.av.grp .mini {
  border-radius: 2px;
  overflow: hidden;
  background: var(--face-disc);
  display: grid;
  place-items: center;
  font-weight: 600;
  color: var(--fg-2);
  line-height: 1;
}
.av.grp .mini.human { background: color-mix(in srgb, var(--fg) 12%, var(--raised)); }
.av.grp .mini canvas { width: 100%; height: 100%; display: block; }
.av .dot-unread {
  position: absolute;
  top: -1px;
  right: -1px;
}
.av-wrap { position: relative; flex: none; display: inline-grid; }
.badge {
  position: absolute;
  top: -6px;
  right: -7px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--badge);
  color: var(--badge-fg);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--side);
  z-index: 1;
}
.badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }

/* ── 消息 ──────────────────────────────────────────────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 14px; }
.tl-time {
  align-self: center;
  font-size: 11.5px;
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  padding: 2px 0;
}
.tl-sys {
  align-self: center;
  max-width: 78%;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  color: var(--fg-2);
  padding: 3px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--fg) 5%, transparent);
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0 4px;
}
.tl-sys .who { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--fg); }
.tl-sys .who .av { --s: 14px; border-radius: 3px; }
.tl-sys.link { cursor: pointer; }
.tl-sys.link:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.msg { display: flex; align-items: flex-start; gap: 10px; }
.msg.me { flex-direction: row-reverse; }
.msg .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: min(72%, 560px); }
.msg.me .body { align-items: flex-end; }
.msg .name { font-size: 11.5px; color: var(--fg-2); padding: 0 2px; }
.bubble {
  position: relative;
  padding: 8px 12px;
  border-radius: var(--bubble-radius);
  background: var(--bubble-them);
  color: var(--bubble-them-fg);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.msg.them .bubble { border-top-left-radius: 4px; }
.msg.me .bubble { background: var(--bubble-me); color: var(--bubble-me-fg); border-top-right-radius: 4px; }
/* 绿色那套：小三角尾巴，照原样 */
:root[data-skin="green"] .msg .bubble { border-radius: 4px; }
:root[data-skin="green"] .msg .bubble::before {
  content: "";
  position: absolute;
  top: 12px;
  width: 8px;
  height: 8px;
  background: inherit;
  transform: rotate(45deg);
  border-radius: 1px;
}
:root[data-skin="green"] .msg.them .bubble::before { left: -4px; }
:root[data-skin="green"] .msg.me .bubble::before { right: -4px; }
.bubble .mention { color: var(--brand); }
:root[data-skin="green"] .msg.me .bubble .mention { color: inherit; font-weight: 600; }
.bubble.voice-note .vmark { display: inline-flex; vertical-align: -2px; margin-right: 6px; opacity: 0.55; }
.bubble.typing { display: inline-flex; gap: 4px; align-items: center; height: 38px; padding: 0 14px; }
.bubble.typing i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.35;
  animation: dot 1.2s infinite var(--ease);
}
.bubble.typing i:nth-child(2) { animation-delay: 0.15s; }
.bubble.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30% { opacity: 0.8; transform: translateY(-3px); }
}
.bubble.call { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.bubble.call:hover { filter: brightness(0.97); }
.msg.fresh { animation: msg-in 220ms var(--ease) both; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.role-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 46px; }
.chip {
  font-size: 12.5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  transition: background-color 150ms var(--ease), transform 120ms var(--ease);
}
.chip:hover { background: var(--hover); }
.chip:active { transform: scale(0.97); }

/* ── 通用控件 ──────────────────────────────────────────────────────────── */
.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  transition: background-color 150ms var(--ease), transform 120ms var(--ease), opacity 150ms var(--ease);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 90%, #000); }
.btn.soft { background: var(--field); color: var(--fg); }
.btn.soft:hover:not(:disabled) { background: var(--press); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: inline-grid;
  place-items: center;
  color: var(--fg-2);
  transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn:active { transform: scale(0.94); }
.field {
  height: 34px;
  width: 100%;
  border-radius: 6px;
  border: 1px solid var(--input);
  background: transparent;
  padding: 0 12px;
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.field::placeholder, textarea::placeholder { color: var(--fg-3); }
.plan {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 16%, transparent);
}
.plan.free { color: var(--fg-2); background: color-mix(in srgb, var(--fg-2) 14%, transparent); }

/* 正在发生的那一句：光带扫过（DESIGN.md 的 Shimmer） */
.shimmer {
  background: linear-gradient(90deg, var(--fg-2) 0%, var(--fg-2) 40%, var(--fg) 50%, var(--fg-2) 60%, var(--fg-2) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .shimmer { animation: none; color: var(--fg-2); background: none; } }

/* 分组卡（设置式） */
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--fg-2); padding: 0 16px 6px; }
.inset { background: var(--surface); border-radius: 12px; overflow: hidden; }
.inset + .group-foot { font-size: 11.5px; color: var(--fg-2); padding: 6px 16px 0; line-height: 1.5; }
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 8px 14px;
  width: 100%;
  text-align: left;
  transition: background-color 120ms var(--ease);
}
button.row:hover, a.row:hover { background: var(--hover); }
button.row:active { background: var(--press); }
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: var(--inset, 14px);
  height: 1px;
  background: var(--line-2);
}
.row .lead { width: 28px; height: 28px; border-radius: 7px; background: var(--field); display: grid; place-items: center; color: var(--fg-2); flex: none; }
.row .t { flex: 1; min-width: 0; }
.row .t .sub { display: block; font-size: 12px; color: var(--fg-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { color: var(--fg-2); font-size: 13px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { color: var(--fg-3); }
.row.danger { color: var(--danger); justify-content: center; }

/* 额度表：填「剩余」、色档按「已用」，充足时中性灰（ADR-0209 / 0239） */
.meter { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--fg-3); }
.meter.warn > i { background: var(--warn); }

/* 弹层 */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--ease);
  z-index: 40;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(420px, calc(100vw - 32px));
  max-height: calc(100dvh - 32px);
  overflow: auto;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 22px;
  transform: translate(-50%, -50%) scale(0.96);
  opacity: 0;
  pointer-events: none;
  transition: transform 200ms var(--ease), opacity 160ms var(--ease);
  z-index: 50;
}
.dialog.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.dialog h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.dialog .desc { margin: 0 0 16px; color: var(--fg-2); font-size: 13px; line-height: 1.55; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.menu {
  position: fixed;
  min-width: 168px;
  padding: 5px;
  background: var(--menu);
  color: var(--menu-fg);
  border-radius: 10px;
  box-shadow: var(--shadow-float);
  transform: scale(0.96);
  opacity: 0;
  pointer-events: none;
  transition: transform 160ms var(--ease), opacity 120ms var(--ease);
  z-index: 60;
}
.menu.on { transform: scale(1); opacity: 1; pointer-events: auto; }
.menu button {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border-radius: 6px;
  text-align: left;
  white-space: nowrap;
}
.menu button:hover { background: color-mix(in srgb, var(--menu-fg) 8%, transparent); }
.menu hr { border: 0; height: 1px; background: var(--menu-line); margin: 4px 6px; }

/* 选脸那面墙 */

/* ── 像素脸 ──────────────────────────────────────────────────────────────
   画料就是 src/shared/ottoFace（esbuild 内联进来的 OttoFace）。app 里脸画在圆盘上，
   这里照微信改成圆角方块：盘底色不变，脸按「64 格宽」缩进去，四角多露一点底。 */
const Face = (() => {
  const F = window.OttoFace;
  const CELLS = 63;
  const scratch = document.createElement("canvas");
  scratch.width = F.GRID_W;
  scratch.height = F.GRID_H;
  const sg = scratch.getContext("2d");
  const live = new Set();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");

  function draw(cv, t) {
    const g = cv.getContext("2d");
    if (!g) return;
    const px = cv.width;
    const slot = +cv.dataset.slot;
    const state = cv.dataset.state || "plain";
    const frame = F.composeFrame(slot, state, reduce.matches ? 0 : t);
    sg.clearRect(0, 0, F.GRID_W, F.GRID_H);
    for (const c of frame.cells) {
      const hex = frame.palette[c.key];
      if (!hex) continue;
      sg.fillStyle = hex;
      sg.fillRect(c.x, c.y, 1, 1);
    }
    g.clearRect(0, 0, px, px);
    g.fillStyle = F.DISC_COLOR;
    g.fillRect(0, 0, px, px);
    const cell = px / CELLS;
    g.imageSmoothingEnabled = cell < 1;
    g.imageSmoothingQuality = "high";
    if (frame.dim) g.globalAlpha = 0.45;
    g.drawImage(scratch, px / 2 - F.FACE_ORIGIN_X * cell, px / 2 - F.FACE_ORIGIN_Y * cell + 2 * cell, F.GRID_W * cell, F.GRID_H * cell);
    g.globalAlpha = 1;
  }

  function canvas(slot, state, size) {
    const cv = document.createElement("canvas");
    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
    cv.width = cv.height = Math.max(8, Math.round(size * dpr));
    cv.dataset.slot = slot;
    cv.dataset.state = state;
    draw(cv, 0);
    if (F.faceAnimates(state)) live.add(cv);
    return cv;
  }

  /* 把 [data-face] 占位换成画布。占位里写好尺寸（data-size），不量 DOM：
     藏着的节点量出来是 0。 */
  function hydrate(root = document) {
    root.querySelectorAll("[data-face]:not([data-hyd])").forEach((el) => {
      el.dataset.hyd = "1";
      const size = +(el.dataset.size || 40);
      el.appendChild(canvas(+el.dataset.face, el.dataset.state || "plain", size));
    });
  }

  function setState(el, state) {
    const cv = el && el.querySelector("canvas");
    if (!cv || cv.dataset.state === state) return;
    cv.dataset.state = state;
    el.dataset.state = state;
    if (F.faceAnimates(state)) live.add(cv);
    else live.delete(cv);
    draw(cv, performance.now());
  }

  let last = 0;
  (function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 33) return; // 30fps 够了：像素脸本来就是一格一格跳的
    last = now;
    for (const cv of live) {
      if (!cv.isConnected) { live.delete(cv); continue; }
      draw(cv, now);
    }
  })(0);

  return { hydrate, setState, canvas, animates: F.faceAnimates };
})();

/* ── 时间 ─────────────────────────────────────────────────────────────── */
const NOW = (() => {
  const d = new Date();
  d.setSeconds(0, 0);
  return d.getTime();
})();
const MIN = 60 * 1000;
const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function hhmm(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
/* 列表里那一格：今天报钟点，昨天写「昨天」，一周内写星期几，再早写月/日（照微信） */
function listTime(ts) {
  const today = dayStart(Date.now());
  const d = dayStart(ts);
  const days = Math.round((today - d) / 86400000);
  if (days <= 0) return hhmm(ts);
  if (days === 1) return "昨天";
  if (days < 7) return WEEK[new Date(ts).getDay()];
  const x = new Date(ts);
  return `${x.getMonth() + 1}/${x.getDate()}`;
}
/* 时间线里的分隔：同一天只写钟点，其余加上日子 */
function sepTime(ts) {
  const lt = listTime(ts);
  return lt.includes(":") ? lt : `${lt} ${hhmm(ts)}`;
}

/* 会话列表里的一行 = 一条聊天，或者一个团队（点进去是它的几条会话，照微信的「服务号」那种折叠行） */
function chatTitle(c) {
  if (c.kind === "dm") return AGENTS[c.agent].name;
  if (c.kind === "friend") return FRIENDS[c.friend].name;
  if (c.kind === "group") return c.name || c.agents.map((a) => AGENTS[a].name).join("、");
  if (c.kind === "team") return c.name;
  return "";
}
function chatHeadcount(c) {
  if (c.kind === "group") return c.agents.length + 1;
  if (c.kind === "team") { const t = TEAMS[c.team]; return t.humans.length + t.agents.length; }
  return 0;
}
function chatParticipants(c) {
  if (c.kind === "dm") return [c.agent];
  if (c.kind === "friend") return [c.friend];
  if (c.kind === "group") return c.agents;
  if (c.kind === "team") { const t = TEAMS[c.team]; return [...t.humans.filter((h) => h !== "me"), ...t.agents]; }
  return [];
}
function lastMsg(c) {
  for (let i = c.msgs.length - 1; i >= 0; i--) if (c.msgs[i].kind !== "relay") return c.msgs[i];
  return null;
}
function chatUpdated(c) { const m = c.msgs[c.msgs.length - 1]; return m ? m.t : 0; }

function previewOf(c) {
  if (c.draft) return { draft: true, text: c.draft };
  const m = lastMsg(c);
  if (!m) return { text: "" };
  if (m.kind === "call") return { text: "[语音通话]" };
  if (m.kind === "sys") return { text: m.text };
  if (m.kind === "roster") return { text: m.text };
  if (m.kind === "dispatch") return { text: `没 @ 谁，${AGENTS[m.meta.to].name}接了` };
  const multi = c.kind === "group" || c.kind === "team";
  const name = m.from === "me" ? "" : multi ? who(m.from).name + ": " : "";
  return { text: name + m.text.replace(/\n+/g, " ") };
}

/* 列表：聊天与团队混排，按最近一条排 */
function listRows() {
  const rows = [];
  for (const c of Object.values(CHATS)) {
    if (c.kind === "team") continue;
    rows.push({ type: "chat", id: c.id, ts: chatUpdated(c), chat: c });
  }
  for (const t of Object.values(TEAMS)) {
    const ss = t.sessions.map((s) => CHATS[s]);
    const newest = ss.slice().sort((a, b) => chatUpdated(b) - chatUpdated(a))[0];
    rows.push({ type: "team", id: t.id, ts: chatUpdated(newest), team: t, newest });
  }
  return rows.sort((a, b) => b.ts - a.ts);
}
function teamUnread(t) { return t.sessions.reduce((n, s) => n + CHATS[s].unread, 0); }
function teamMention(t) { return t.sessions.some((s) => CHATS[s].mention && CHATS[s].unread > 0); }
function totalUnread() {
  let n = 0;
  for (const c of Object.values(CHATS)) n += c.unread;
  return n;
}

/* ── 头像 HTML ────────────────────────────────────────────────────────── */
function avatar(id, size = 40, state = "plain") {
  if (id === "me") return `<span class="av human me-av" style="--s:${size}px">${ME.initial}</span>`;
  const a = AGENTS[id];
  if (a) return `<span class="av" style="--s:${size}px" data-face="${a.slot}" data-state="${state}" data-size="${size}" data-agent="${id}"></span>`;
  const f = FRIENDS[id] || { initial: id.slice(0, 1) };
  return `<span class="av human" style="--s:${size}px">${f.initial}</span>`;
}
/* 群头像：微信那种九宫格，不满一行的那一行放在最上面、居中 */
function groupAvatar(ids, size = 40) {
  const n = Math.min(ids.length, 9);
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  const pad = size * 0.06;
  const gap = Math.max(1, size * 0.035);
  const cell = (size - pad * 2 - gap * (cols - 1)) / cols;
  const rows = [];
  let rest = n;
  const first = n % cols || cols;
  rows.push(first);
  rest -= first;
  while (rest > 0) { rows.push(cols); rest -= cols; }
  let k = 0;
  const html = rows.map((cnt) => {
    const cells = [];
    for (let i = 0; i < cnt; i++, k++) {
      const id = ids[k];
      const a = AGENTS[id];
      if (a) cells.push(`<span class="mini" style="width:${cell}px;height:${cell}px" data-face="${a.slot}" data-size="${cell}"></span>`);
      else {
        const w = who(id);
        cells.push(`<span class="mini human" style="width:${cell}px;height:${cell}px;font-size:${cell * 0.5}px">${w.initial}</span>`);
      }
    }
    return `<span style="display:flex;justify-content:center;gap:${gap}px">${cells.join("")}</span>`;
  }).join("");
  return `<span class="av grp" style="--s:${size}px;gap:${gap}px;padding:${pad}px;display:flex;flex-direction:column;justify-content:center">${html}</span>`;
}
function chatAvatar(c, size = 40) {
  if (c.kind === "dm") return avatar(c.agent, size);
  if (c.kind === "friend") return avatar(c.friend, size);
  if (c.kind === "group") return groupAvatar(c.agents, size);
  if (c.kind === "team") return groupAvatar(chatParticipants(c), size);
  return "";
}
function teamAvatar(t, size = 40) { return groupAvatar([...t.humans.filter((h) => h !== "me"), ...t.agents], size); }

function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }
function richText(s) {
  return esc(s).replace(/@([一-龥A-Za-z0-9_]+)/g, '<span class="mention">@$1</span>');
}

function namesLine(ids) {
  return ids.map((id) => `<span class="who">${AGENTS[id] ? avatar(id, 14) : ""}${esc(who(id).name)}</span>`).join("<span>、</span>");
}
function timelineHTML(c, opts = {}) {
  const multi = c.kind === "group" || c.kind === "team";
  const av = opts.avatar || 36;
  let out = "";
  let prevT = 0;
  for (const m of c.msgs) {
    if (!prevT || m.t - prevT > 5 * MIN) out += `<div class="tl-time">${sepTime(m.t)}</div>`;
    prevT = m.t;
    const fresh = opts.fresh && opts.fresh.has(m.id) ? " fresh" : "";
    if (m.kind === "sys") { out += `<div class="tl-sys${fresh}">${esc(m.text)}</div>`; continue; }
    if (m.kind === "roster") { out += `<div class="tl-sys${fresh}"><span>${esc(m.text)}，拉进了</span>${namesLine(m.meta.added)}</div>`; continue; }
    if (m.kind === "rosterchg") { out += `<div class="tl-sys${fresh}"><span>${esc(m.text)}</span>${namesLine(m.meta.ids)}</div>`; continue; }
    if (m.kind === "relay") { out += `<div class="tl-sys${fresh}">${namesLine([m.meta.from])}<span>把话递给了</span>${namesLine([m.meta.to])}</div>`; continue; }
    if (m.kind === "dispatch") { out += `<div class="tl-sys${fresh}"><span>没 @ 谁，</span>${namesLine([m.meta.to])}<span>接了</span></div>`; continue; }
    if (m.kind === "call" && multi) {
      out += `<div class="tl-sys link${fresh}" data-call="${m.id}">${ic("phone", 13, 2)}<span>语音通话 ${esc(m.meta.dur)} · ${m.meta.lines.length} 句</span></div>`;
      continue;
    }
    const mine = m.from === "me";
    const w = who(m.from);
    const nameRow = multi && !mine ? `<div class="name">${esc(w.name)}</div>` : "";
    let bubble;
    if (m.kind === "call") bubble = `<div class="bubble call" data-call="${m.id}">${ic("phone", 15, 2)}<span>通话时长 ${esc(m.meta.dur)}</span></div>`;
    else if (m.meta && m.meta.voice) bubble = `<div class="bubble voice-note"><span class="vmark">${ic("mic", 14, 2)}</span>${richText(m.text)}</div>`;
    else bubble = `<div class="bubble">${richText(m.text)}</div>`;
    out += `<div class="msg ${mine ? "me" : "them"}${fresh}" data-from="${m.from}">${avatar(m.from, av)}<div class="body">${nameRow}${bubble}</div></div>`;
  }
  if (c.pending) {
    const p = c.pending;
    const nameRow = multi ? `<div class="name">${esc(who(p.agent).name)}</div>` : "";
    out += `<div class="msg them pending">${avatar(p.agent, av, p.phase === "typing" ? "composing" : "working")}<div class="body">${nameRow}<div class="bubble typing" aria-label="${esc(who(p.agent).name)}正在回复"><i></i><i></i><i></i></div></div></div>`;
  }
  if (c.onboarding) {
    out += `<div class="role-chips">${ROLE_CHIPS.map((r) => `<button class="chip" data-chip="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
  }
  return out;
}

const ROLE_CHIPS = ["回客人的私信", "写小红书笔记", "每天盯订单", "整理报销单", "做每周的周报", "查同行的价格"];

/* ── 聊天引擎 ─────────────────────────────────────────────────────────── */
const Sim = (() => {
  const subs = new Set();
  const fresh = new Set();
  let open = null; // 此刻开着的那条（开着的不记未读）
  const emit = (id) => subs.forEach((f) => f(id));
  const later = (ms) => new Promise((r) => setTimeout(r, ms));

  function push(c, from, text, kind = "text", meta) {
    const m = { id: "m" + Math.random().toString(36).slice(2, 10), t: Date.now(), from, text, kind, meta };
    c.msgs.push(m);
    fresh.add(m.id);
    if (from !== "me" && c.id !== open && kind !== "relay") c.unread++;
    emit(c.id);
    return m;
  }

  /* 一条回复按空行拆成几张气泡（ADR-0266），一张一张落 */
  async function reply(c, agentId, parts, voice) {
    c.pending = { agent: agentId, phase: "working" };
    emit(c.id);
    await later(900 + Math.random() * 700);
    c.pending = { agent: agentId, phase: "typing" };
    emit(c.id);
    await later(700 + Math.random() * 400);
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) c.pending = null;
      push(c, agentId, parts[i]);
      if (i < parts.length - 1) await later(650);
    }
    c.pending = null;
    emit(c.id);
  }

  function mentioned(c, text) {
    const ids = c.kind === "group" ? c.agents : c.kind === "team" ? TEAMS[c.team].agents : [];
    return ids.filter((id) => text.includes("@" + AGENTS[id].name));
  }

  function pickByRole(ids, text) {
    const hit = ids.find((id) => (KEYWORDS[id] || []).some((k) => text.includes(k)));
    return hit || ids[0];
  }

  async function send(c, text, meta) {
    text = text.trim();
    if (!text) return;
    c.draft = "";
    push(c, "me", text, "text", meta);
    if (c.onboarding) {
      const a = AGENTS[c.agent];
      a.role = text.split("\n")[0].slice(0, 40);
      c.onboarding = false;
      await reply(c, c.agent, [`好，记下了：「${a.role}」。`, "以后这类活直接丢给我。想改职责的话，点右上角随时能改。"]);
      return;
    }
    if (c.kind === "dm") return reply(c, c.agent, replyFor(c.agent, text));
    if (c.kind === "friend") {
      await later(2600);
      push(c, c.friend, FRIEND_REPLIES[c.friend] || "好");
      return;
    }
    const ids = c.kind === "group" ? c.agents : TEAMS[c.team].agents;
    let targets = mentioned(c, text);
    if (targets.length === 0) {
      const t = pickByRole(ids, text);
      push(c, "sys", "", "dispatch", { to: t });
      targets = [t];
    }
    for (const t of targets) await reply(c, t, replyFor(t, text));
  }

  return {
    on: (f) => (subs.add(f), () => subs.delete(f)),
    send,
    push,
    setOpen(id) {
      open = id;
      if (id && CHATS[id]) { CHATS[id].unread = 0; CHATS[id].mention = false; }
      emit(id);
    },
    get open() { return open; },
    fresh,
    emit,
  };
})();

  a_xuanpin: ["价格", "同行", "几点", "上新", "卖"],

const FRIEND_REPLIES = { f_xh: "好呀，明天店里见", f_aj: "收到", f_lw: "没问题，下周二发货" };

function replyFor(agentId, text) {
  const pick = (arr) => arr;
  switch (agentId) {

      if (/短|简|配图/.test(text)) return pick(["短版：", "下班，先点一支雪松。\n今晚只归自己。\n#山茶小铺"]);
      if (/标题/.test(text)) return pick(["给你三个挑：\n1. 下班后的四十分钟\n2. 把一整天关在门外\n3. 今晚只点一支雪松"]);
      return pick(["好，我改一下。", "改完了：把「仪式感」这个词拿掉了，读起来不那么像广告。你看行不行？"]);
    case "a_kefu":
      return pick(["收到，我去回。", "回完了。那位客人问能不能周五前到，我说周四发顺丰。"]);
    case "a_toufang":
      return pick(["好。", "关键词我加了「送女朋友 香薰」和「助眠 蜡烛」，预算不变，明早看数据。"]);
    case "a_shuju":
      return pick(["我拉一下后台。", "这周到目前 97 单，比上周同期多 12 单，主要是雪松的预售。"]);
    case "a_jizhang":
      return pick(["收到。", "流水对上了，这周没有对不上的。"]);
    case "a_xuanpin":
      return pick(["我去看一眼同行。", "「木屿」和「小森林」这周都没动价格，我们维持 ¥89 没问题。"]);
    case "a_admin":
      if (/建|新/.test(text)) return pick(["可以。想让它叫什么、主要干什么？", "说一句就行，比如「帮我回私信的，叫客服」。"]);
      return pick(["收到，我看看派给谁合适。", "这件事交给「客服」最顺手，我已经跟它说了。"]);
    case "t_zhiban":
      if (/立牌|收款/.test(text)) return pick(["收款码立牌店里有两个，我记在清单第 1 条了。"]);
      return pick(["收到。", "我加进周六的清单里了。"]);
    default:
      return pick(["收到，我去弄。", "弄好了，你看一下有没有要改的。"]);
  }
}

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const win = $("#win"), colEl = $("#col"), paneEl = $("#pane"), drawer = $("#drawer"), scrim = $("#scrim"), dialog = $("#dialog"), menu = $("#menu"), callEl = $("#call"), demo = $("#demo");

  const S = {
    view: "chats",       // chats | contacts | me
    open: null,          // 开着的聊天 id
    teamOpen: null,      // 列表里点开的团队（折叠行）
    contact: null,       // 通讯录里选中的：{type, id}
    me: "quota",         // 「我」里选中的那一格
    sub: "pro",          // pro | free
    q: "",               // 搜索
    call: null,
  };

  /* ── 竖条 ─────────────────────────────────────────────────────────── */
  function renderRail() {
    const me = $(".rail-me");
    me.innerHTML = avatar("me", 34);
    me.setAttribute("aria-current", S.view === "me" ? "page" : "false");
    const unread = S.sub === "free" ? Object.values(CHATS).filter(visibleChat).reduce((n, c) => n + c.unread, 0) : totalUnread();
    const chats = $('[data-nav="chats"]');
    chats.innerHTML = ic("message-circle", 22, S.view === "chats" ? 2.1 : 1.75) + (unread ? `<span class="badge">${unread > 99 ? "99+" : unread}</span>` : "");
    chats.setAttribute("aria-current", S.view === "chats" ? "page" : "false");
    const con = $('[data-nav="contacts"]');
    con.innerHTML = ic("contact-round", 22, S.view === "contacts" ? 2.1 : 1.75) + (FRIEND_REQUESTS.length ? `<span class="badge">${FRIEND_REQUESTS.length}</span>` : "");
    con.setAttribute("aria-current", S.view === "contacts" ? "page" : "false");
    $("#demo-btn").innerHTML = ic("info", 20);
  }
  $$(".rail [data-nav]").forEach((b) => b.addEventListener("click", () => go(b.dataset.nav)));
  function go(view) {
    closeDrawer();
    /* 窄到一栏时，再点一次「聊天」= 回到列表 */
    if (view === "chats" && S.view === "chats" && matchMedia("(max-width: 560px)").matches) { S.open = null; Sim.setOpen(null); }
    S.view = view;
    if (view !== "chats") Sim.setOpen(null);
    else if (S.open) Sim.setOpen(S.open);
    renderAll();
  }

  /* ── 可见性（没订阅时，自己的智能体那一半不在） ─────────────────────── */
  function visibleChat(c) {
    if (S.sub === "free" && (c.kind === "dm" || c.kind === "group")) return false;
    return true;
  }
  function matchQ(text) { return !S.q || text.toLowerCase().includes(S.q.toLowerCase()); }

  /* ── 左栏 ─────────────────────────────────────────────────────────── */

    return `<header class="col-head"><label class="search">${ic("search", 15)}<input id="q" placeholder="${placeholder}" value="${esc(S.q)}" autocomplete="off"></label><button class="icon-btn" id="plus" title="新建" aria-haspopup="menu">${ic("plus", 17, 2)}</button></header>`;

  function renderCol() {
    if (S.view === "chats" && S.teamOpen) return renderTeamList();

    if (S.view === "contacts") body = contactListHTML();
    if (S.view === "me") body = meListHTML();
    colEl.innerHTML = colHead(S.view === "contacts" ? "搜索智能体、朋友" : "搜索") + `<div class="col-body scroll" id="col-body">${body}</div>`;
    const q = $("#q");
    q.addEventListener("input", () => { S.q = q.value; const pos = q.selectionStart; renderCol(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); });

    bindCol();
    Face.hydrate(colEl);
  }

  function rowHTML({ id, attr, current, avatarHTML, badge, name, time, preview, extra = "" }) {

  }
  function badgeHTML(n) { return n ? `<span class="badge">${n > 99 ? "99+" : n}</span>` : ""; }

  function chatListHTML() {

      out += `<div class="gate-card"><div class="h">订阅 Pro，就能有自己的智能体</div><p>它们有名字、有职责，能私聊、拉群、打电话。团队里别人的智能体照样能用，走团队主人的额度。</p><button class="btn primary" data-act="subscribe">看看订阅</button></div>`;

    for (const r of listRows()) {

        const c = r.chat;
        if (!visibleChat(c)) continue;
        if (!matchQ(chatTitle(c) + " " + previewOf(c).text)) continue;
        const pv = previewOf(c);
        const pvHTML = pv.draft ? `<b>[草稿]</b> ${esc(pv.text)}` : esc(pv.text);

        const pv = previewOf(n);

      .map((c) => {
        const pv = previewOf(c);
        const at = c.mention && c.unread ? `<span class="at">[有人@我]</span> ` : "";
        return rowHTML({ id: c.id, attr: "data-chat", current: S.open === c.id, avatarHTML: teamAvatar(t, 42), badge: badgeHTML(c.unread), name: esc(c.name), time: listTime(chatUpdated(c)), preview: at + esc(pv.text) });

      .join("")}</div>`;
    $("#team-back").addEventListener("click", () => { S.teamOpen = null; renderCol(); });
    $("#team-new").addEventListener("click", () => {

  function contactListHTML() {
    const entry = (key, icon, label, right) => `<button class="crow entry" data-entry="${key}" aria-current="${S.contact && S.contact.type === key ? "true" : "false"}"><span class="tile">${ic(icon, 19)}</span><span class="meta"><span class="nm">${label}</span></span>${right || ""}</button>`;
    let out = "";
    out += entry("requests", "user-round-plus", "新的朋友", FRIEND_REQUESTS.length ? `<span class="badge pill-badge">${FRIEND_REQUESTS.length}</span>` : "");
    const groups = Object.values(CHATS).filter((c) => c.kind === "group" && visibleChat(c));
    out += entry("groups", "users-round", "群聊", `<span class="count">${groups.length}</span>`);
    out += entry("teams", "briefcase", "团队", `<span class="count">${Object.keys(TEAMS).length}</span>`);
    const agents = MY_AGENTS.filter((id) => AGENTS[id]).filter((id) => matchQ(AGENTS[id].name + AGENTS[id].role));
    out += `<div class="list-label"><span>智能体 · ${S.sub === "free" ? 0 : agents.length}</span>${S.sub === "free" ? "" : `<button class="icon-btn" data-act="new-agent" title="新建智能体">${ic("plus", 15, 2)}</button>`}</div>`;
    if (S.sub === "free") {
      out += `<div class="gate-card"><div class="h">智能体要 Pro 或 Max</div><p>订阅之后，这里就是你的同事：一只一个职责，像通讯录里的人一样找到它们。</p><button class="btn primary" data-act="subscribe">看看订阅</button></div>`;

        out += `<button class="crow" data-contact-agent="${id}" aria-current="${S.contact && S.contact.id === id ? "true" : "false"}"><span class="av-wrap">${avatar(id, 38)}</span><span class="meta"><span class="nm">${esc(a.name)}</span><span class="sub-role">${esc(a.role)}</span></span></button>`;

    for (const id of friends) {

      out += `<button class="crow" data-contact-friend="${id}" aria-current="${S.contact && S.contact.id === id ? "true" : "false"}"><span class="av-wrap">${avatar(id, 38)}</span><span class="meta"><span class="nm">${esc(f.name)}</span><span class="sub-role">${esc(f.note)}</span></span></button>`;

  }

  function composerHTML(c) {
    const ph = c.kind === "group" || c.kind === "team" ? "说点什么，输入 @ 点名…" : c.onboarding ? `回一句话，它就知道自己该干什么了` : `跟${chatTitle(c)}说点什么`;

    return `<div class="composer" id="composer">
      <textarea id="ta" placeholder="${esc(ph)}" aria-label="输入消息" enterkeyhint="send">${esc(c.draft || "")}</textarea>
      <div class="bar">
        <button class="icon-btn" data-act="emoji" title="表情">${ic("smile", 18)}</button>${at}

      </div>
      <div class="pop" id="emoji-pop" style="left:14px;bottom:calc(100% + 6px);width:312px"><div class="emoji-grid">${EMOJI.map((e) => `<button data-emoji="${e}">${e}</button>`).join("")}</div></div>
      <div class="pop mention-list" id="at-pop" style="left:14px;bottom:calc(100% + 6px)"></div>
    </div>`;
  }
  function syncSend() { const ta = $("#ta"); if (ta) $("#send").disabled = !ta.value.trim(); }
  function bindComposer(c) {
    const ta = $("#ta");
    const atPop = $("#at-pop"), emoPop = $("#emoji-pop");
    let atSel = 0, atItems = [];
    ta.addEventListener("input", () => {
      syncSend();
      c.draft = ta.value;
      const before = ta.value.slice(0, ta.selectionStart);
      const m = before.match(/(^|[\s，。])@([^\s@]*)$/);
      if ((c.kind === "group" || c.kind === "team") && m) showAt(m[2]); else hidePop(atPop);
    });
    ta.addEventListener("keydown", (e) => {
      if (atPop.classList.contains("on")) {
        if (e.key === "ArrowDown") { e.preventDefault(); atSel = (atSel + 1) % atItems.length; paintAt(); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); atSel = (atSel - 1 + atItems.length) % atItems.length; paintAt(); return; }
        if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); pickAt(atItems[atSel]); return; }
        if (e.key === "Escape") { hidePop(atPop); return; }
      }
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); doSend(); }
    });
    $("#send").addEventListener("click", doSend);
    function doSend() {
      const text = ta.value;
      if (!text.trim()) return;
      ta.value = "";
      c.draft = "";
      syncSend();
      hidePop(atPop);
      Sim.send(c, text);
    }
    function membersOf() {
      if (c.kind === "group") return c.agents.map((id) => ({ id, name: AGENTS[id].name, r: "智能体" }));
      const t = TEAMS[c.team];
      return [...t.agents.map((id) => ({ id, name: AGENTS[id].name, r: "智能体" })), ...t.humans.filter((h) => h !== "me").map((id) => ({ id, name: FRIENDS[id].name, r: "成员" }))];
    }
    function showAt(q) {
      atItems = membersOf().filter((m) => m.name.includes(q));
      if (!atItems.length) return hidePop(atPop);
      atSel = 0;
      paintAt();
      atPop.classList.add("on");
    }
    function paintAt() {
      atPop.innerHTML = atItems.map((m, i) => `<button data-pick="${m.id}" aria-selected="${i === atSel}">${avatar(m.id, 24)}<span>${esc(m.name)}</span><span class="r">${m.r}</span></button>`).join("");
      Face.hydrate(atPop);
      $$("[data-pick]", atPop).forEach((b, i) => b.addEventListener("mousedown", (e) => { e.preventDefault(); pickAt(atItems[i]); }));
    }
    function pickAt(m) {
      const pos = ta.selectionStart;
      const before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + m.name + " ");
      ta.value = before + ta.value.slice(pos);
      ta.setSelectionRange(before.length, before.length);
      hidePop(atPop);
      syncSend();
      ta.focus();
    }
    $$("[data-emoji]", emoPop).forEach((b) => b.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, pos) + b.dataset.emoji + ta.value.slice(ta.selectionEnd);
      ta.setSelectionRange(pos + b.dataset.emoji.length, pos + b.dataset.emoji.length);
      syncSend();
    }));
    paneEl.querySelector('[data-act="emoji"]').addEventListener("click", (e) => { e.stopPropagation(); hidePop(atPop); emoPop.classList.toggle("on"); });
    const atBtn = paneEl.querySelector('[data-act="at"]');
    if (atBtn) atBtn.addEventListener("click", () => {
      const pos = ta.selectionStart;
      const pre = ta.value.slice(0, pos);
      const ins = (pre && !/\s$/.test(pre) ? " " : "") + "@";
      ta.value = pre + ins + ta.value.slice(pos);
      ta.setSelectionRange(pos + ins.length, pos + ins.length);
      ta.focus();
      showAt("");
    });
    syncSend();
    setTimeout(() => ta.focus(), 0);
  }
  function hidePop(p) { p && p.classList.remove("on"); }
  document.addEventListener("click", (e) => {

    }

      body = `<div class="members">${[...t.humans, ...t.agents].map((id) => `<div class="member">${avatar(id, 46)}<span class="n">${esc(who(id).name)}</span></div>`).join("")}</div>
        <div class="inset"><div class="row"><span class="t">会话名称</span><span class="val">${esc(c.name)}</span></div><button class="row" data-act="team-page"><span class="t">团队</span><span class="val">${esc(t.name)}</span><span class="chev">${ic("chevron-right", 16)}</span></button><div class="row"><span class="t">沙箱里的操作</span><span class="val">要人批（主人设的）</span></div></div>
        <div class="inset"><button class="row danger" data-act="archive">归档这条会话</button></div>`;
    }
    if (c.kind === "friend") {
      const f = FRIENDS[c.friend];
      body = `<div class="members"><div class="member">${avatar(f.id, 46)}<span class="n">${esc(f.name)}</span></div><div class="member"><button class="add" data-act="to-team" title="拉进团队">${ic("plus", 18)}</button><span class="n">拉进团队</span></div></div>
        <div class="inset"><div class="row"><span class="t">备注</span><span class="val">${esc(f.note)}</span></div></div>`;
    }
    drawer.innerHTML = `<header class="drawer-head">聊天信息<span class="spacer"></span><button class="icon-btn" data-act="close" title="关闭">${ic("x", 18)}</button></header><div class="drawer-body scroll">${body}</div>`;
    Face.hydrate(drawer);
    drawer.classList.add("on");
    const on = (sel, fn) => { const el = drawer.querySelector(sel); if (el) el.addEventListener("click", fn); };
    on('[data-act="close"]', closeDrawer);
    if (c.kind === "dm") bindAgentRows(AGENTS[c.agent], drawer);
    on('[data-act="to-group"]', () => newGroupDialog([c.agent]));
    on('[data-act="del-agent"]', () => confirmDialog(`删掉「${AGENTS[c.agent].name}」？`, "它的私聊一起删掉；它待过的群还在，只是少了它。删了找不回来。", "删除", () => {
      const id = c.agent;
      delete CHATS[c.id];
      MY_AGENTS.splice(MY_AGENTS.indexOf(id), 1);
      for (const g of Object.values(CHATS)) if (g.kind === "group" && g.agents.includes(id)) { g.agents = g.agents.filter((x) => x !== id); Sim.push(g, "sys", "", "rosterchg", { ids: [id] }); g.msgs[g.msgs.length - 1].text = "你把这只移出了群聊："; }
      S.open = null; closeDrawer(); renderAll();
    }, true));
    on('[data-act="add-member"]', () => pickAgentsDialog("加进群里", MY_AGENTS.filter((id) => !c.agents.includes(id)), 6 - c.agents.length, (ids) => { c.agents.push(...ids); Sim.push(c, "sys", "你把这几只拉进了群聊：", "rosterchg", { ids }); openInfo(c); }));
    on('[data-act="rm-member"]', () => pickAgentsDialog("移出群聊", c.agents, c.agents.length, (ids) => { c.agents = c.agents.filter((x) => !ids.includes(x)); Sim.push(c, "sys", "你把这几只移出了群聊：", "rosterchg", { ids }); openInfo(c); }));
    on('[data-act="rename"]', () => editDialog("群聊名称", chatTitle(c), false, (v) => { c.name = v; renderAll(); openInfo(c); }));
    on('[data-act="disband"]', () => confirmDialog(`解散「${chatTitle(c)}」？`, "聊天记录一起删掉。里面的智能体都还在，通讯录里照样找得到。", "解散", () => { delete CHATS[c.id]; S.open = null; closeDrawer(); renderAll(); }, true));
    on('[data-act="team-page"]', () => { S.view = "contacts"; S.contact = { type: "teams" }; closeDrawer(); renderAll(); });
    on('[data-act="archive"]', () => confirmDialog(`归档「${c.name}」？`, "团队里的人都看不到它了，要找去团队设置的「会话」那一页。", "归档", () => { const t = TEAMS[c.team]; t.sessions = t.sessions.filter((s) => s !== c.id); delete CHATS[c.id]; S.open = null; closeDrawer(); renderAll(); }));
    on('[data-act="to-team"]', () => newTeamDialog([c.friend]));
  }
  function closeDrawer() { drawer.classList.remove("on"); }
  /* 点抽屉外面就收起（弹窗、菜单开着的时候除外：那是抽屉自己叫出来的） */
  document.addEventListener("mousedown", (e) => {
    if (!drawer.classList.contains("on")) return;
    if (drawer.contains(e.target) || dialog.contains(e.target) || menu.contains(e.target) || e.target.closest('[data-act="info"]')) return;
    if (dialog.classList.contains("on")) return;
    closeDrawer();
  });

  /* ── 菜单 / 弹窗 ─────────────────────────────────────────────────── */
  function openPlusMenu(btn) {
    const r = btn.getBoundingClientRect();
    const items = [
      ["new-agent", "sparkles", "新建智能体", S.sub !== "free"],
      ["new-group", "users-round", "发起群聊", S.sub !== "free"],
      ["new-team", "briefcase", "新建团队", true],
      ["add-friend", "user-round-plus", "添加朋友", true],
    ].filter((x) => x[3]);
    menu.innerHTML = items.map(([k, i, l]) => `<button data-m="${k}" role="menuitem">${ic(i, 16)}${l}</button>`).join("");
    menu.style.left = `${Math.min(r.left, innerWidth - 190)}px`;
    menu.style.top = `${r.bottom + 6}px`;
    menu.style.transformOrigin = "top left";
    menu.classList.add("on");
    $$("[data-m]", menu).forEach((b) => b.addEventListener("click", () => {
      menu.classList.remove("on");
      ({ "new-agent": newAgentDialog, "new-group": () => newGroupDialog(), "new-team": () => newTeamDialog([]), "add-friend": addFriendDialog })[b.dataset.m]();
    }));
  }
  document.addEventListener("mousedown", (e) => { if (!menu.contains(e.target) && !e.target.closest("#plus")) menu.classList.remove("on"); });

  function showDialog(html, bind) {
    dialog.innerHTML = html;
    Face.hydrate(dialog);
    dialog.classList.add("on");
    scrim.classList.add("on");
    bind && bind(dialog);
    const first = dialog.querySelector("input, textarea");
    if (first) setTimeout(() => first.focus(), 60);
  }
  function closeDialog() { dialog.classList.remove("on"); scrim.classList.remove("on"); }
  dialog.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeDialog(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (dialog.classList.contains("on")) closeDialog();
    else if (menu.classList.contains("on")) menu.classList.remove("on");
    else if (drawer.classList.contains("on")) closeDrawer();
    else if (demo.classList.contains("on")) demo.classList.remove("on");
  });

  function confirmDialog(title, desc, ok, fn, danger) {
    showDialog(`<h3>${esc(title)}</h3><p class="desc">${esc(desc)}</p><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn ${danger ? "danger-solid" : "primary"}" id="ok">${esc(ok)}</button></div>`, (d) => d.querySelector("#ok").addEventListener("click", () => { closeDialog(); fn(); }));
  }
  function editDialog(label, value, multi, fn) {
    const field = multi ? `<textarea class="field" id="ed" style="height:96px;padding:8px 12px;resize:none;line-height:1.55">${esc(value)}</textarea>` : `<input class="field" id="ed" value="${esc(value)}">`;
    showDialog(`<h3>${esc(label)}</h3><p class="desc">改完下一句话就生效。</p>${field}<div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">保存</button></div>`, (d) => {
      const ed = d.querySelector("#ed"), ok = d.querySelector("#ok");
      const sync = () => (ok.disabled = !ed.value.trim());
      ed.addEventListener("input", sync);
      sync();
      ok.addEventListener("click", () => { closeDialog(); fn(ed.value.trim()); });
    });
  }
  const WALL = [0, 1, 4, 5, 6, 7, 8, 9, 10, 11];
  function faceWall(sel) { return `<div class="face-wall">${WALL.map((s) => `<button class="face-pick" data-slot="${s}" aria-pressed="${s === sel}"><span class="av" style="--s:56px" data-face="${s}" data-size="56"></span></button>`).join("")}</div>`; }
  function faceDialog(a) {
    let sel = a.slot;
    showDialog(`<h3>换个形象</h3><p class="desc">脸是它在通讯录里的样子。</p>${faceWall(sel)}<div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">保存</button></div>`, (d) => {
      $$(".face-pick", d).forEach((b) => b.addEventListener("click", () => { sel = +b.dataset.slot; $$(".face-pick", d).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.slot === sel))); }));
      d.querySelector("#ok").addEventListener("click", () => { a.slot = sel; closeDialog(); renderAll(); if (drawer.classList.contains("on")) openInfo(CHATS[S.open]); });
    });
  }
  function voiceDialog(a) {
    const voices = ["清亮女声", "温柔女声", "沉稳男声", "干脆男声"];
    let sel = a.voice;
    showDialog(`<h3>说话的声音</h3><p class="desc">打电话时它用这个声音。</p><div class="inset" style="background:var(--ground)">${voices.map((v) => `<button class="row" data-v="${v}"><span class="t">${v}</span><span class="chk" style="color:var(--brand);opacity:${v === sel ? 1 : 0}">${ic("check", 16, 2.2)}</span></button>`).join("")}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">保存</button></div>`, (d) => {
      $$("[data-v]", d).forEach((b) => b.addEventListener("click", () => { sel = b.dataset.v; $$("[data-v] .chk", d).forEach((x) => (x.style.opacity = x.parentElement.dataset.v === sel ? 1 : 0)); }));
      d.querySelector("#ok").addEventListener("click", () => { a.voice = sel; closeDialog(); renderAll(); if (drawer.classList.contains("on")) openInfo(CHATS[S.open]); });
    });
  }

  function newAgentDialog() {
    let sel = 9;
    showDialog(`<h3>新建智能体</h3><p class="desc">起个名字、挑张脸。建好它会先跟你打招呼，你回的第一句话就是它的职责。</p>
      <div style="display:flex;justify-content:center;margin:2px 0 14px"><span class="av" id="prev" style="--s:88px;border-radius:16px" data-face="${sel}" data-state="alive" data-size="88"></span></div>
      <input class="field" id="nm" placeholder="名字，比如「客服」「小周」" maxlength="12" style="margin-bottom:14px">
      ${faceWall(sel)}
      <div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok" disabled>创建</button></div>`, (d) => {
      const nm = d.querySelector("#nm"), ok = d.querySelector("#ok");
      nm.addEventListener("input", () => (ok.disabled = !nm.value.trim()));
      nm.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && nm.value.trim()) ok.click(); });
      $$(".face-pick", d).forEach((b) => b.addEventListener("click", () => {
        sel = +b.dataset.slot;
        $$(".face-pick", d).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.slot === sel)));
        const prev = d.querySelector("#prev");
        prev.removeAttribute("data-hyd");
        prev.innerHTML = "";
        prev.dataset.face = sel;
        Face.hydrate(d);
      }));
      ok.addEventListener("click", () => {
        const name = nm.value.trim();
        const id = "a_" + Math.random().toString(36).slice(2, 8);
        AGENTS[id] = { id, name, slot: sel, role: "还没定", voice: "清亮女声", usage: 0 };
        MY_AGENTS.push(id);
        const cid = "c_" + id;
        CHATS[cid] = { id: cid, kind: "dm", agent: id, unread: 0, msgs: [] };
        closeDialog();
        openChat(cid);
        greet(CHATS[cid]);
      });
    });
  }
  async function greet(c) {
    const a = AGENTS[c.agent];
    c.pending = { agent: a.id, phase: "typing" };
    Sim.emit(c.id);
    await new Promise((r) => setTimeout(r, 1100));
    c.pending = null;
    Sim.push(c, a.id, `你好，我是${a.name}。你想让我帮你干点什么？`);
    await new Promise((r) => setTimeout(r, 650));
    c.onboarding = true;
    Sim.push(c, a.id, "说一句就行，这句话就是我以后的职责，写错了随时能改。");
  }

  function pickAgentsDialog(title, ids, max, fn, preset = []) {
    const sel = new Set(preset);
    const draw = (d) => {
      $$("[data-pk]", d).forEach((b) => {
        const on = sel.has(b.dataset.pk);
        b.querySelector(".chk").style.opacity = on ? 1 : 0;
        b.disabled = !on && sel.size >= max;
        b.style.opacity = b.disabled ? 0.45 : 1;
      });
      d.querySelector("#ok").disabled = sel.size === 0;
    };
    showDialog(`<h3>${esc(title)}</h3><div class="inset" style="background:var(--ground);margin-top:12px">${ids.map((id) => `<button class="row" data-pk="${id}" style="--inset:52px">${avatar(id, 30)}<span class="t">${esc(AGENTS[id].name)}<span class="sub">${esc(AGENTS[id].role)}</span></span><span class="chk" style="color:var(--brand)">${ic("check", 16, 2.2)}</span></button>`).join("")}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">确定</button></div>`, (d) => {
      $$("[data-pk]", d).forEach((b) => b.addEventListener("click", () => { sel.has(b.dataset.pk) ? sel.delete(b.dataset.pk) : sel.add(b.dataset.pk); draw(d); }));
      d.querySelector("#ok").addEventListener("click", () => { closeDialog(); fn([...sel]); });
      draw(d);
    });
  }

  function newGroupDialog(preset = []) {
    const sel = new Set(preset);
    const ids = MY_AGENTS.slice();
    const draw = (d) => {
      $$("[data-pk]", d).forEach((b) => {
        const on = sel.has(b.dataset.pk);
        b.querySelector(".chk").style.opacity = on ? 1 : 0;
        b.disabled = !on && sel.size >= 6;
        b.style.opacity = b.disabled ? 0.45 : 1;
      });
      const nm = d.querySelector("#gn");
      nm.placeholder = sel.size ? ids.filter((i) => sel.has(i)).map((i) => AGENTS[i].name).join("、") : "群名（不填就用成员名）";
      d.querySelector("#ok").disabled = sel.size < 2;
      d.querySelector("#cnt").textContent = `已选 ${sel.size} / 6`;
    };
    showDialog(`<h3>发起群聊</h3><p class="desc">挑 2 到 6 只。群里没 @ 谁的话，按职责自己接活。</p><input class="field" id="gn" maxlength="30"><div style="display:flex;justify-content:flex-end;font-size:11.5px;color:var(--fg-3);margin:10px 4px 6px" id="cnt"></div><div class="inset" style="background:var(--ground)">${ids.map((id) => `<button class="row" data-pk="${id}" style="--inset:52px">${avatar(id, 30)}<span class="t">${esc(AGENTS[id].name)}<span class="sub">${esc(AGENTS[id].role)}</span></span><span class="chk" style="color:var(--brand)">${ic("check", 16, 2.2)}</span></button>`).join("")}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok">建群</button></div>`, (d) => {
      $$("[data-pk]", d).forEach((b) => b.addEventListener("click", () => { sel.has(b.dataset.pk) ? sel.delete(b.dataset.pk) : sel.add(b.dataset.pk); draw(d); }));
      d.querySelector("#ok").addEventListener("click", () => {
        const agents = ids.filter((i) => sel.has(i));
        const name = d.querySelector("#gn").value.trim() || agents.map((i) => AGENTS[i].name).join("、").slice(0, 30);
        const id = "g_" + Math.random().toString(36).slice(2, 7);
        CHATS[id] = { id, kind: "group", name, agents, unread: 0, msgs: [] };
        Sim.push(CHATS[id], "sys", `你建了群聊「${name}」`, "roster", { added: agents });
        closeDialog();
        openChat(id);
      });
      draw(d);
    });
  }
  function newTeamDialog(preset) {
    const sel = new Set(preset);
    showDialog(`<h3>新建团队</h3><p class="desc">团队是一群人加一套智能体，大家在同一个地方干活，用你的额度。要 Max。</p><input class="field" id="tn" placeholder="团队名，比如「山茶小铺」" maxlength="20"><div class="group-label" style="padding:14px 4px 6px">拉谁进来</div><div class="inset" style="background:var(--ground)">${MY_FRIENDS.map((id) => `<button class="row" data-pk="${id}" style="--inset:52px">${avatar(id, 30)}<span class="t">${esc(FRIENDS[id].name)}</span><span class="chk" style="color:var(--brand);opacity:${sel.has(id) ? 1 : 0}">${ic("check", 16, 2.2)}</span></button>`).join("")}</div><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok" disabled>建团队</button></div>`, (d) => {
      const tn = d.querySelector("#tn"), ok = d.querySelector("#ok");
      tn.addEventListener("input", () => (ok.disabled = !tn.value.trim()));
      $$("[data-pk]", d).forEach((b) => b.addEventListener("click", () => { sel.has(b.dataset.pk) ? sel.delete(b.dataset.pk) : sel.add(b.dataset.pk); b.querySelector(".chk").style.opacity = sel.has(b.dataset.pk) ? 1 : 0; }));
      ok.addEventListener("click", () => {
        const tid = "tm_" + Math.random().toString(36).slice(2, 7), sid = "s_" + Math.random().toString(36).slice(2, 7);
        const aid = "ta_" + tid;
        AGENTS[aid] = { id: aid, name: "管理员", slot: 6, role: "帮团队建新同事、派活", admin: true, team: tid };
        TEAMS[tid] = { id: tid, name: tn.value.trim(), owner: "me", humans: ["me", ...sel], agents: [aid], sessions: [sid] };
        CHATS[sid] = { id: sid, kind: "team", team: tid, name: "大家好", unread: 0, msgs: [] };
        closeDialog();
        openChat(sid);
        Sim.push(CHATS[sid], "sys", `你建了团队「${tn.value.trim()}」`);
      });
    });
  }
  function addFriendDialog() {
    showDialog(`<h3>添加朋友</h3><p class="desc">填对方的邮箱或用户名。加了朋友，才能拉 TA 进团队、把你的应用借给 TA。</p><input class="field" id="fe" placeholder="邮箱或用户名"><div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="ok" disabled>发送申请</button></div>`, (d) => {
      const fe = d.querySelector("#fe"), ok = d.querySelector("#ok");
      fe.addEventListener("input", () => (ok.disabled = !fe.value.trim()));
      ok.addEventListener("click", () => { closeDialog(); toast(`申请已发给 ${fe.value.trim()}，对方同意了会出现在朋友里`); });
    });
  }
  function subscribeDialog() {
    showDialog(`<h3>订阅</h3><p class="desc">Pro：自己的智能体，私聊、群聊、语音通话。Max：额度更多，还能建团队。</p><div class="inset" style="background:var(--ground)"><div class="row"><span class="t">Pro</span><button class="btn primary" style="height:30px" id="pro">订 Pro</button></div><div class="row"><span class="t">Max</span><button class="btn soft" style="height:30px" id="max">订 Max</button></div></div><div class="actions"><button class="btn soft" data-close>以后再说</button></div>`, (d) => {
      const done = () => { closeDialog(); S.sub = "pro"; renderAll(); renderDemo(); toast("demo：当作已经订上了"); };
      d.querySelector("#pro").addEventListener("click", done);
      d.querySelector("#max").addEventListener("click", done);
    });
  }
  function transcriptDialog(c, mid) {
    const m = c.msgs.find((x) => x.id === mid);
    if (!m) return;
    showDialog(`<h3>语音通话 · ${esc(m.meta.dur)}</h3><p class="desc">${esc(sepTime(m.t))} · ${m.meta.lines.length} 句</p><div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6">${m.meta.lines.map(([w, s, at]) => `<div style="display:grid;grid-template-columns:44px 1fr;gap:10px"><span style="color:var(--fg-3);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px">${at}</span><span><b style="font-weight:600">${esc(who(w).name)}</b>　${esc(s)}</span></div>`).join("")}</div><div class="actions"><button class="btn soft" data-close>关闭</button></div>`);
  }

  /* ── 通话 ─────────────────────────────────────────────────────────── */
  function startCall(c) {
    if (S.call) return;
    const agentId = c.kind === "dm" ? c.agent : chatParticipants(c).find((x) => AGENTS[x]);
    const script = callScript(agentId);
    const started = Date.now();
    const lines = [];
    const call = (S.call = { c, agentId, started, lines, muted: false, subs: true, stop: false });
    const tiles = c.kind === "dm" ? "" : `<div class="tiles">${chatParticipants(c).filter((x) => AGENTS[x]).slice(0, 3).map((id) => `<div class="tile"><span class="call-face" data-tile="${id}" style="width:64px;height:64px"><span class="av" style="--s:64px" data-face="${AGENTS[id].slot}" data-state="listening" data-size="64"></span></span>${esc(AGENTS[id].name)}</div>`).join("")}</div>`;
    const main = c.kind === "dm" ? `<span class="call-face" id="cface" style="width:132px;height:132px"><span class="av" style="--s:132px;border-radius:28%" data-face="${AGENTS[agentId].slot}" data-state="listening" data-size="132"></span></span><div class="nm">${esc(AGENTS[agentId].name)}</div><div class="st" id="cst">在听</div>` : `${tiles}<div class="nm">${esc(chatTitle(c))}</div><div class="st" id="cst">在听</div>`;
    callEl.innerHTML = `<div class="top" id="drag"><span>语音通话</span><span class="timer" id="ctime">00:00</span></div>${main}<div class="call-sub" id="csub"></div>
      <div class="ctrls"><div><button class="call-btn on" id="c-sub" title="转文字">${ic("type", 22)}</button><span class="call-label">转文字</span></div><div><button class="call-btn" id="c-mute" title="静音">${ic("mic", 22)}</button><span class="call-label">静音</span></div><div><button class="call-btn hang" id="c-end" title="挂断">${ic("phone-off", 24)}</button><span class="call-label">挂断</span></div></div>`;
    Face.hydrate(callEl);
    callEl.classList.add("on");
    const timer = setInterval(() => { const s = Math.floor((Date.now() - started) / 1000); $("#ctime").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 500);
    $("#c-end").addEventListener("click", endCall);
    $("#c-mute").addEventListener("click", (e) => { call.muted = !call.muted; e.currentTarget.classList.toggle("on", call.muted); e.currentTarget.innerHTML = ic(call.muted ? "mic-off" : "mic", 22); });
    $("#c-sub").addEventListener("click", (e) => { call.subs = !call.subs; e.currentTarget.classList.toggle("on", call.subs); $("#csub").style.visibility = call.subs ? "visible" : "hidden"; });
    dragWindow(callEl, $("#drag"));
    const faceEl = () => callEl.querySelector("#cface .av") || callEl.querySelector(`[data-tile="${agentId}"] .av`);
    const faceWrap = () => callEl.querySelector("#cface") || callEl.querySelector(`[data-tile="${agentId}"]`);
    (async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      await wait(900);
      for (const [w, text] of script) {
        if (call.stop) return;
        const agent = w !== "me";
        Face.setState(faceEl(), agent ? "speaking" : "listening");
        faceWrap().classList.toggle("talking", agent);
        $("#cst").textContent = agent ? "正在说" : "在听";
        const sub = $("#csub");
        for (let i = 1; i <= text.length; i++) {
          if (call.stop) return;
          sub.innerHTML = `<span class="who">${agent ? esc(AGENTS[agentId].name) : "你"}：</span>${esc(text.slice(0, i))}`;
          await wait(agent ? 70 : 55);
        }
        const s = Math.floor((Date.now() - started) / 1000);
        lines.push([w, text, `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`]);
        await wait(900);
      }
      Face.setState(faceEl(), "listening");
      faceWrap().classList.remove("talking");
      $("#cst").textContent = "在听";
    })();
    call.timer = timer;
  }
  function endCall() {
    const call = S.call;
    if (!call) return;
    call.stop = true;
    clearInterval(call.timer);
    callEl.classList.remove("on");
    const s = Math.max(1, Math.floor((Date.now() - call.started) / 1000));
    const dur = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    Sim.push(call.c, "me", "", "call", { dur, lines: call.lines });
    S.call = null;
  }
  function dragWindow(el, handle) {
    let sx, sy, ox, oy;
    handle.addEventListener("pointerdown", (e) => {
      const r = el.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      handle.setPointerCapture(e.pointerId);
      handle.style.cursor = "grabbing";
    });
    handle.addEventListener("pointermove", (e) => {
      if (!handle.hasPointerCapture(e.pointerId)) return;
      el.style.left = `${Math.max(8, Math.min(innerWidth - el.offsetWidth - 8, ox + e.clientX - sx))}px`;
      el.style.top = `${Math.max(8, Math.min(innerHeight - 60, oy + e.clientY - sy))}px`;
      el.style.right = "auto";
    });
    handle.addEventListener("pointerup", () => (handle.style.cursor = ""));
  }

  /* ── 小提示 ─────────────────────────────────────────────────────────── */
  function toast(text) {
    const t = document.createElement("div");
    t.textContent = text;
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--menu);color:var(--menu-fg);padding:8px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-float);z-index:70;transition:opacity 200ms var(--ease);max-width:calc(100vw - 32px)";
    document.body.appendChild(t);
    setTimeout(() => (t.style.opacity = "0"), 2200);
    setTimeout(() => t.remove(), 2500);
  }

  /* ── demo 面板 ───────────────────────────────────────────────────── */
  const pref = (() => { try { return JSON.parse(localStorage.getItem("otto-wx-demo") || "{}"); } catch { return {}; } })();
  function savePref() { try { localStorage.setItem("otto-wx-demo", JSON.stringify(pref)); } catch {} }
  function applyPref() {
    const r = document.documentElement;
    if (pref.theme === "light" || pref.theme === "dark") r.dataset.theme = pref.theme; else delete r.dataset.theme;
    if (pref.skin === "green") r.dataset.skin = "green"; else delete r.dataset.skin;
  }
  function renderDemo() {
    const seg = (key, opts, cur) => `<span class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</span>`;
    demo.innerHTML = `<div class="h"><b>微信式布局 · 桌面 demo</b><button class="icon-btn" id="demo-x" title="关闭">${ic("x", 16)}</button></div>
      <div class="ctl"><span>主题</span>${seg("theme", [["auto", "跟随系统"], ["light", "浅色"], ["dark", "深色"]], pref.theme || "auto")}
      <span>配色</span>${seg("skin", [["otto", "Otto"], ["green", "绿色气泡"]], pref.skin || "otto")}
      <span>订阅</span>${seg("sub", [["pro", "Pro"], ["free", "没订阅"]], S.sub)}</div>
      <p style="margin:0;color:var(--fg-2)">能点的都点点：发消息（群里试试 @），右上角「···」、电话，左上 + 号新建一只，头像进「我」。数据全是编的。<a href="wechat-mobile.html">手机 demo →</a></p>
      <div><h4>demo 里有、今天还没有的</h4><ul>${NEW_THINGS.map(([a, b]) => `<li><b>${a}</b>：${b}</li>`).join("")}</ul></div>
      <div><h4>这一版撤掉的（本机写代码那一半）</h4><ul>${REMOVED_THINGS.map((a) => `<li>${a}</li>`).join("")}</ul></div>`;
    $("#demo-x").addEventListener("click", () => demo.classList.remove("on"));
    $$("[data-k]", demo).forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === "sub") { S.sub = v; if (v === "free" && S.open && !visibleChat(CHATS[S.open])) S.open = null; renderAll(); }
      else { pref[k] = v; savePref(); applyPref(); }
      renderDemo();
    }));
  }
  $("#demo-btn").addEventListener("click", () => { renderDemo(); demo.classList.toggle("on"); });

  /* ── 装配 ─────────────────────────────────────────────────────────── */
  function renderAll() { renderRail(); renderCol(); renderPane(); }
  Sim.on((id) => {
    renderRail();
    const ae = document.activeElement;
    const typingInSearch = ae && ae.id === "q";
    if (!typingInSearch) renderCol();
    if (S.view === "chats" && S.open && (id === S.open || !id)) {
      const c = CHATS[S.open];
      if (c) { renderHead(c); renderTimeline(c, false); }
    }
  });
  applyPref();
  /* 宽屏一打开就是一条聊天（照微信 Mac 版）；窄到一栏时先给列表 */
  if (!matchMedia("(max-width: 560px)").matches) {
    S.open = "c_wenan";
    Sim.setOpen("c_wenan");
  }
  renderAll();
  renderDemo();
  /* 不自动弹面板（它会盖住会话列表），只在第一次打开时指一下那颗钮 */
  if (!pref.seen) {
    const hint = $("#hint");
    setTimeout(() => hint.classList.add("on"), 600);
    const off = () => { hint.classList.remove("on"); document.removeEventListener("pointerdown", off); };
    setTimeout(off, 7000);
    document.addEventListener("pointerdown", off);
    pref.seen = 1;
    savePref();
  }
})();
</script>
