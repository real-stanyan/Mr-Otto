<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<title>智能体花名册 demo · #1280</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  #1280 的界面 demo（spike 产物，不是交付物）。三个侧栏方向并列 + 六种进门状态 + 全部主流程可点。一只一条永久线（没有话题 / 历史），主场全免审批。
  令牌逐值抄自 src/renderer/src/app.css（:root 与 .dark 两段）；头像是仓里那 13 张像素图里的 5 张
  （src/renderer/src/assets/agent-avatars/），内联成 data URI，所以这个文件单独就能开。
  demo 里的措辞不等于最终实现；与实现有偏差的地方交付时明说。
-->
<style>
  :root {
    color-scheme: light;
    --background: #efece3; --foreground: #000000; --card: #f7f5ef; --popover: #f7f5ef;
    --primary: #4a70a9; --primary-foreground: #ffffff; --muted: #e5e1d3;
    --muted-foreground: rgba(0,0,0,.55); --accent: #dce6f2; --brand: #4a70a9;
    --border: rgba(0,0,0,.12); --ok: #2b8a3e; --err: #d9480f; --warn: #e67700; --destructive: #c92a2a;
    --sidebar: #e9e5d8; --sidebar-foreground: #000000; --sidebar-accent: #dce6f2; --sidebar-border: rgba(0,0,0,.12);
    --hover: rgba(0,0,0,.06);
    --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
  }
  .dark {
    color-scheme: dark;
    --background: #000000; --foreground: #f5f5f7; --card: #1d1d1f; --popover: #1d1d1f;
    --primary: #0071e3; --primary-foreground: #ffffff; --muted: #2c2c2e;
    --muted-foreground: rgba(245,245,247,.56); --accent: #2c2c2e; --brand: #0a84ff;
    --border: rgba(245,245,247,.12); --ok: #30d158; --err: #ff453a; --warn: #ff9f0a; --destructive: #ff453a;
    --sidebar: #1d1d1f; --sidebar-foreground: #f5f5f7; --sidebar-accent: #2c2c2e; --sidebar-border: rgba(245,245,247,.1);
    --hover: rgba(245,245,247,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #0b0b0c; color: #e9e9ec; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── demo 外壳（不属于 app） ───────────────────────────── */
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #242428; background: #121214; position: sticky; top: 0; z-index: 50; }
  .bar h1 { font-size: 13px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .01em; }
  .bar .grp { display: flex; align-items: center; gap: 6px; }
  .bar .lbl { font-size: 11px; color: #8d8d93; }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: #232327; }
  .seg button { padding: 3px 9px; border-radius: 6px; font-size: 12px; color: #a9a9af; transition: background-color 150ms ease, color 150ms ease; }
  .seg button[aria-pressed="true"] { background: #3a3a40; color: #fff; }
  .stage { display: flex; gap: 16px; padding: 16px; align-items: flex-start; min-width: 1500px; }
  .notes { width: 330px; flex: none; font-size: 12px; line-height: 1.65; color: #b6b6bd; position: sticky; top: 64px; }
  .notes h2 { font-size: 12px; margin: 0 0 6px; color: #fff; font-weight: 600; }
  .notes h3 { font-size: 11px; margin: 14px 0 4px; color: #8d8d93; font-weight: 600; letter-spacing: .04em; }
  .notes ul { margin: 0; padding-left: 16px; }
  .notes li { margin: 3px 0; }
  .notes code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #9ecbff; }
  .notes .card { border: 1px solid #26262b; border-radius: 10px; padding: 12px 14px; background: #131316; margin-bottom: 12px; }
  .notes .try li { color: #d6d6dc; }

  /* ── app ─────────────────────────────────────────────── */
  .app { width: 1120px; height: 720px; flex: none; display: flex; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2e; background: var(--background); color: var(--foreground); position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .sb { width: 256px; flex: none; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; min-height: 0; }
  .sb-head { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .brandrow { display: flex; align-items: center; justify-content: space-between; padding: 26px 4px 0; }
  .brandrow b { font: italic 600 15px "Poppins", -apple-system, sans-serif; }
  .tabs { display: flex; padding: 3px; border-radius: 9px; background: var(--muted); }
  .tabs button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 6px; border-radius: 7px; font-size: 13px; color: var(--muted-foreground); }
  .tabs button[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .dark .tabs button[aria-selected="true"] { background: #3a3a3c; }
  .solo { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; transition: transform 120ms var(--ease-strong), background-color 150ms ease; }
  .solo:active { transform: scale(.97); }
  .sb-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .glabel { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .glabel .sp { flex: 1; }
  .gact { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 14px; transition: background-color 150ms ease, color 150ms ease; }
  .row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border-radius: 7px; padding: 5px 8px; transition: background-color 120ms ease; }
  .row[aria-current="true"] { background: var(--sidebar-accent); }
  .row .nm { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 11.5px; color: var(--muted-foreground); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tm { font-size: 10.5px; color: var(--muted-foreground); flex: none; font-variant-numeric: tabular-nums; }
  .row .col { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .row .l1 { display: flex; align-items: baseline; gap: 6px; }
  .row .l1 .nm { flex: 1; }
  .row.two { padding: 6px 8px; }
  .row.one { padding: 4px 8px; }
  .row.one .nm { flex: 1; }
  .stword { font-size: 10.5px; flex: none; }
  .stword.running { color: var(--brand); } .stword.waiting { color: var(--warn); }
  .spine { border-left: 1px solid var(--sidebar-border); margin-left: 11px; padding-left: 6px; }
  .spine .row { padding: 5px 8px; }
  .spine .row .nm { font-size: 12px; }
  .chev { transition: transform 150ms ease-out; font-size: 13px; }
  .chev.on { transform: rotate(90deg); }
  .sbnote { padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--muted-foreground); }
  .sbnote.err { color: var(--err); font-size: 11px; }
  .gatecard { margin: 4px 2px 8px; padding: 12px; border: 1px dashed var(--border); border-radius: 10px; font-size: 12px; line-height: 1.6; color: var(--muted-foreground); }
  .gatecard b { display: block; color: var(--foreground); font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
  .skel { height: 34px; border-radius: 7px; margin: 4px 0; background: linear-gradient(90deg, var(--hover) 25%, transparent 50%, var(--hover) 75%); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  .av { position: relative; flex: none; border-radius: 50%; background: var(--muted); display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground); }
  .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; image-rendering: pixelated; display: block; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ring-bg, var(--sidebar)); }
  .av .dot.running { background: var(--brand); } .av .dot.waiting { background: var(--warn); }
  .avs { display: inline-flex; flex: none; }
  .avs .av + .av { margin-left: -7px; }
  .avs .av { box-shadow: 0 0 0 1.5px var(--ring-bg, var(--sidebar)); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; --ring-bg: var(--background); }
  .hd { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); min-height: 49px; }
  .hd .who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.3; }
  .hd .who b { font-size: 13.5px; font-weight: 600; }
  .hd .who span { font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; white-space: nowrap; transition: transform 120ms var(--ease-strong), background-color 150ms ease, opacity 150ms ease; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.icon { width: 26px; padding: 0; justify-content: center; }
  .btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .btn.danger { color: var(--destructive); }
  .btn.ghost { border-color: transparent; }
  .tl { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 56px; display: flex; flex-direction: column; gap: 14px; }
  .sr { display: flex; gap: 8px; max-width: 85%; align-self: flex-start; }
  .sr.me { flex-direction: row-reverse; align-self: flex-end; }
  .sr .c { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
  .sr.me .c { align-items: flex-end; }
  .sr .lab { font-size: 11px; color: var(--muted-foreground); padding: 0 4px; }
  .bub { padding: 7px 12px; border-radius: 16px; background: var(--muted); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
  .sr.me .bub { background: var(--primary); color: var(--primary-foreground); }
  .cline { align-self: center; font-size: 11.5px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 5px; }
  .typing { display: inline-flex; gap: 4px; padding: 11px 13px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted-foreground); animation: ty 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes ty { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  .enter { animation: en 240ms var(--ease-strong) both; }
  @keyframes en { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } }

  .day { align-self: center; font-size: 11px; color: var(--muted-foreground); padding: 2px 10px; border-radius: 99px; background: var(--hover); }
  .older { align-self: center; font-size: 11.5px; color: var(--muted-foreground); padding: 3px 10px; border-radius: 99px; transition: background-color 150ms ease, color 150ms ease; }
  .stop { align-self: center; margin-left: 2px; font-size: 11px; color: var(--muted-foreground); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); transition: transform 120ms var(--ease-strong), background-color 150ms ease; }
  .stop:active { transform: scale(.97); }
  .badge { flex: none; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 99px; background: var(--brand); color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }

  .ft { flex: none; padding: 0 16px 14px; position: relative; }
  .ft::before { content: ""; position: absolute; left: 0; right: 0; top: -40px; height: 40px; background: linear-gradient(transparent, var(--background)); pointer-events: none; }
  .cmp { border: 1px solid var(--border); background: var(--card); border-radius: 16px; padding: 8px 10px 8px 14px; }
  .cmp textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--foreground); font: inherit; font-size: 13.5px; line-height: 1.5; padding: 4px 0; min-height: 28px; }
  .cmp textarea::placeholder { color: color-mix(in srgb, var(--foreground) 35%, transparent); }
  .cmp .r { display: flex; align-items: center; justify-content: space-between; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; border: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); }
  .send { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; transition: transform 120ms var(--ease-strong), opacity 150ms ease; }
  .send:active { transform: scale(.94); }

  .opening { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 80px 60px; text-align: center; }
  .opening h2 { margin: 6px 0 0; font-size: 17px; font-weight: 600; }
  .opening p { margin: 0; font-size: 12.5px; color: var(--muted-foreground); max-width: 440px; line-height: 1.65; }
  .opening .cmp { width: 100%; max-width: 560px; text-align: left; margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
  .chip { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); transition: transform 120ms var(--ease-strong), background-color 150ms ease, color 150ms ease; }
  .chip:active { transform: scale(.97); }
  .quiet { font-size: 11.5px; color: var(--muted-foreground); text-decoration: underline; text-underline-offset: 3px; }


  /* 弹层：从触发点长出来（origin-aware），出场比进场快 */
  .pop { position: absolute; z-index: 20; min-width: 230px; border: 1px solid var(--border); background: var(--popover); border-radius: 12px; padding: 5px; box-shadow: 0 12px 34px rgba(0,0,0,.35); transform-origin: var(--o, top right); animation: po 160ms var(--ease-strong) both; }
  @keyframes po { from { opacity: 0; transform: scale(.96); } }
  .pop .ph { padding: 5px 9px 3px; font-size: 11px; color: var(--muted-foreground); }
  .pop .it { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 9px; border-radius: 8px; font-size: 12.5px; }
  .pop .it .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop .it .w { font-size: 11px; color: var(--muted-foreground); flex: none; }
  .pop .it[aria-selected="true"] { background: var(--hover); }
  .pop .pf { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 5px 3px; }
  .ck { width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; flex: none; }
  .ck.on { background: var(--primary); border-color: transparent; color: #fff; }

  .scrim { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; animation: fd 180ms ease both; }
  @keyframes fd { from { opacity: 0; } }
  .dlg { width: 400px; border: 1px solid var(--border); background: var(--popover); border-radius: 14px; padding: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.5); animation: dg 200ms var(--ease-strong) both; }
  @keyframes dg { from { opacity: 0; transform: scale(.96); } }
  .dlg h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
  .dlg p { margin: 0 0 12px; font-size: 12px; color: var(--muted-foreground); line-height: 1.6; }
  .fld { width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--foreground); font: inherit; outline: 0; }
  .fld:focus { border-color: var(--primary); }
  .picklist { margin: 10px 0 4px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .picklist .it { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; text-align: left; font-size: 12.5px; }
  .picklist .it + .it { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  .picklist .it .d { color: var(--muted-foreground); font-size: 11.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .hint { font-size: 11.5px; color: var(--muted-foreground); }

  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; z-index: 25; background: var(--popover); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(0,0,0,.35); animation: dr 260ms cubic-bezier(.32,.72,0,1) both; }
  @keyframes dr { from { transform: translateX(100%); } }
  .drawer .dh { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13.5px; }
  .drawer .dh .sp { flex: 1; }
  .drawer .db { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .il { font-size: 11px; color: var(--muted-foreground); padding: 0 4px; margin-bottom: -6px; }
  .ig { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .ir { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 12.5px; width: 100%; text-align: left; }
  .ir + .ir { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  .ir .k { width: 58px; color: var(--muted-foreground); flex: none; }
  .ir .v { flex: 1; min-width: 0; } .ir .v.dim { color: var(--muted-foreground); }
  .ir .ic { width: 24px; height: 24px; border-radius: 7px; background: var(--hover); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted-foreground); flex: none; }
  .ifoot { font-size: 11px; color: var(--muted-foreground); padding: 0 4px; margin-top: -6px; line-height: 1.6; }

  @media (hover: hover) and (pointer: fine) {
    .row:hover, .gact:hover, .pop .it:hover, .picklist .it:hover, .ir[data-act]:hover { background: var(--hover); }
    .row[aria-current="true"]:hover { background: var(--sidebar-accent); }
    .solo:hover, .btn:hover:not(:disabled):not(.pri), .chip:hover, .older:hover, .stop:hover { background: var(--hover); }
    .chip:hover, .gact:hover { color: var(--foreground); }
    .seg button:hover { color: #fff; }
  }
  @media (prefers-reduced-motion: reduce) {
    .enter, .pop, .dlg, .drawer { animation: fd 150ms ease both; }
    .solo:active, .btn:active, .chip:active, .send:active { transform: none; }
    .typing i, .skel { animation: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>#1280 智能体花名册</h1>
  <div class="grp"><span class="lbl">侧栏方向</span><div class="seg" data-seg="dir">
    <button data-v="A">A 联系人</button><button data-v="B">B 紧凑单行</button><button data-v="C">C 最近混排</button></div></div>
  <div class="grp"><span class="lbl">进门状态</span><div class="seg" data-seg="gate">
    <button data-v="ready">有智能体</button><button data-v="first">首次</button><button data-v="lite">Lite</button><button data-v="free">Free</button><button data-v="unknown">还没查到</button><button data-v="olddb">库比客户端旧</button></div></div>
  <div class="grp"><span class="lbl">状态与未读（#1282 才接线）</span><div class="seg" data-seg="presence">
    <button data-v="off">不画</button><button data-v="on">预览</button></div></div>
  <div class="grp"><span class="lbl">主题</span><div class="seg" data-seg="theme">
    <button data-v="dark">深</button><button data-v="light">浅</button></div></div>
</div>
<div class="stage">
  <div class="app" id="app">
    <aside class="sb"><div class="sb-head" id="sbHead"></div><div class="sb-body" id="sbBody"></div></aside>
    <section class="main" id="main"></section>
    <div id="layer"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ── 图标（lucide 同款线条） ─────────────────────────────── */
const P = {
  plus: '<path d="M5 12h14M12 5v14"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  gear: '<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',

const roster = () => (firstMode() ? DB.roster.filter((id) => id === "admin" || id === S.fresh) : DB.roster);
const chatOf = (sel = S.sel) => (sel.k === "dm" ? DB.dm[sel.id] : sel.k === "group" ? DB.groups[sel.id] : null);
const membersOf = (sel = S.sel) => (sel.k === "dm" ? [sel.id] : sel.k === "group" ? DB.groups[sel.id].members : []);
const gateBlocks = () => ["lite", "free", "unknown", "olddb"].includes(S.gate);
const isRunning = (id) => !!DB.dm[id].running || S.typing === id;
const spoken = (msgs) => msgs.filter((x) => x.text && x.who !== "day");

/* ── 头像 ─────────────────────────────────────────────── */
function av(id, size, withDot) {
  const dot = withDot && S.presence === "on" && isRunning(id) ? `<span class="dot running"></span>` : "";
  return `<span class="av" style="width:${size}px;height:${size}px"><img src="${AV(AGENTS[id].av)}" alt="">${dot}</span>`;
}
const avStack = (ids, size) => `<span class="avs">${ids.slice(0, 3).map((id) => av(id, size)).join("")}</span>`;
const personAv = (name, size) => `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.46)}px">${[...name][0]}</span>`;
const unreadOf = (id) => (S.presence === "on" && !(S.sel.k === "dm" && S.sel.id === id) ? DB.dm[id].unread || 0 : 0);

/* ── 侧栏 ─────────────────────────────────────────────── */
function sbHead() {
  return `
    <div class="brandrow"><b>Mr Otto</b><span class="gact" title="搜索">${ic("search")}</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="false">${ic("tasks")}任务</button>
      <button role="tab" aria-selected="false">${ic("folder")}项目</button>
      <button role="tab" aria-selected="true">${ic("bot")}智能体</button>
    </div>
    ${gateBlocks() ? "" : `<button class="solo" data-act="newAgent">${ic("bot")}新智能体</button>`}`;
}
function lastLine(msgs, group) {
  const t = spoken(msgs).pop();
  if (!t) return null;
  const who = t.who === "me" ? "你：" : group ? AGENTS[t.who].name + "：" : "";
  return who + t.text.split("\n")[0];
}
function agentRow(id) {
  const a = AGENTS[id], cur = S.sel.k === "dm" && S.sel.id === id, cls = S.fresh === id ? " enter" : "";
  const n = unreadOf(id), right = n ? `<span class="badge">${n}</span>` : `<span class="tm">${NOW[id] || ""}</span>`;
  if (S.dir === "B")
    return `<button class="row one${cls}" data-act="openDm" data-id="${id}" aria-current="${cur}">${av(id, 18, true)}<span class="nm">${a.name}</span>${S.presence === "on" && isRunning(id) ? `<span class="stword running">在跑</span>` : right}</button>`;
  const sub = S.dir === "C" ? lastLine(DB.dm[id].msgs) || a.desc : a.desc;
  return `<button class="row two${cls}" data-act="openDm" data-id="${id}" aria-current="${cur}">${av(id, 30, true)}
    <span class="col"><span class="l1"><span class="nm">${a.name}</span>${right}</span><span class="sub">${sub}</span></span></button>`;
}
function groupRow(gid) {
  const g = DB.groups[gid], cur = S.sel.k === "group" && S.sel.id === gid, cls = S.fresh === gid ? " enter" : "";
  if (S.dir === "B")
    return `<button class="row one${cls}" data-act="openGroup" data-id="${gid}" aria-current="${cur}">${avStack(g.members, 18)}<span class="nm">${g.name}</span><span class="tm">${NOW[gid] || ""}</span></button>`;
  const sub = S.dir === "C" ? lastLine(g.msgs, true) || "还没人说话" : g.members.map((x) => AGENTS[x].name).join(" · ");
  return `<button class="row two${cls}" data-act="openGroup" data-id="${gid}" aria-current="${cur}">${avStack(g.members, 24)}
    <span class="col"><span class="l1"><span class="nm">${g.name}</span><span class="tm">${NOW[gid] || ""}</span></span><span class="sub">${sub}</span></span></button>`;
}
function teamBlock(tid) {
  const t = DB.teams[tid];
  const rows = t.sessions.map((s) => `<button class="row" data-act="openTeam" data-id="${tid}" data-sid="${s.id}" aria-current="${S.sel.k === "team" && S.sel.sid === s.id}"><span class="nm">${s.title}</span></button>`).join("");
  return `<div class="glabel" style="color:var(--sidebar-foreground);font-weight:400;font-size:13px">
      <button class="gact" data-act="toggleTeam" title="展开 / 收起">${ic("chev", "chev" + (S.teamOpen ? " on" : ""))}</button>
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</span>
      <span class="tm" style="font-size:10.5px">团队 · ${t.people} 人</span><span class="sp"></span>
      <span class="gact" title="在这个团队里开一条会话（同今天）">${ic("plus")}</span><span class="gact" title="团队设置（同今天）">${ic("gear")}</span>
    </div>${S.teamOpen ? `<div class="spine">${rows}</div>` : ""}`;
}
function sbBody() {
  const g = S.gate, teams = firstMode() ? "" : teamBlock("t1");
  const groupsLabel = (canNew) => `<div class="glabel"><span>群聊</span><span class="sp"></span>${canNew ? `<button class="gact" data-act="newGroup" title="新群聊">${ic("plus")}</button>` : ""}</div>`;
  if (g === "unknown") return `<div class="glabel"><span>智能体</span></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  if (g === "lite" || g === "free") {
    const card = g === "lite"
      ? `<div class="gatecard"><b>智能体要 Pro 或 Max</b>你现在是 Lite。智能体跑在云端、有自己的电脑，这一档不带。<div style="margin-top:8px"><button class="btn" data-act="noop">去换档</button></div></div>`
      : `<div class="gatecard"><b>订阅之后才有智能体</b>智能体跑在云端，走订阅额度，不能用自己的 API key。<div style="margin-top:8px"><button class="btn" data-act="noop">看看订阅</button></div></div>`;
    return `<div class="glabel"><span>智能体</span></div>${card}${groupsLabel(false)}${teams}<p class="sbnote" style="padding-top:2px">别人拉你进的团队照常能用：团队花的是所有者的额度。</p>`;
  }
  if (g === "olddb")
    return `<div class="glabel"><span>智能体</span></div><p class="sbnote err">暂时读不到智能体：数据库比这个版本旧。团队不受影响。</p>${groupsLabel(false)}${teams}`;
  const ids = roster(), gids = firstMode() ? [] : DB.groupOrder;
  const gearBtn = `<button class="gact" data-act="homeSettings" title="设置：文件 / 连接器 / 用量 / 记忆">${ic("gear")}</button>`;
  if (S.dir === "C") {
    const order = ["ops", "dev", "g1", "ads", "cs", "admin"], rank = (id) => (order.indexOf(id) < 0 ? -1 : order.indexOf(id));
    const mixed = [...ids.map((id) => ["a", id]), ...gids.map((id) => ["g", id])].sort((x, y) => rank(x[1]) - rank(y[1]));
    return `<div class="glabel"><span>最近</span><span class="sp"></span><button class="gact" data-act="newGroup" title="新群聊">${ic("users")}</button>${gearBtn}</div>

  }
  return `<div class="glabel"><span>智能体</span><span class="sp"></span>${gearBtn}</div>
    ${ids.map(agentRow).join("")}${groupsLabel(true)}${gids.map(groupRow).join("")}
    ${gids.length === 0 && !teams ? `<p class="sbnote">还没有群聊。有两只以上智能体时，可以拉它们进一个群里接力干活。</p>` : ""}${teams}`;
}

/* ── 主区 ─────────────────────────────────────────────── */
function bubble(msg, i, arr) {
  if (msg.who === "day") return `<div class="day">${msg.text}</div>`;
  if (msg.who === "sys") return `<div class="cline${msg.fresh ? " enter" : ""}">${msg.html}</div>`;
  const me = msg.who === "me";
  let name = "你", avatar = personAv("你", 24);
  if (!me) {
    if (msg.who.startsWith("p:")) { name = msg.who.slice(2); avatar = personAv(name, 24); }
    else if (msg.who.startsWith("t:")) { name = msg.who.slice(2); avatar = av("admin", 24); }
    else { name = AGENTS[msg.who].name; avatar = av(msg.who, 24); }
  }
  const showLab = i === 0 || arr[i - 1].who !== msg.who;
  return `<div class="sr${me ? " me" : ""}${msg.fresh ? " enter" : ""}">${avatar}<div class="c">${showLab ? `<span class="lab">${name}</span>` : ""}<div class="bub">${msg.text}</div></div></div>`;
}
const typingRow = (id, stop) => `<div class="sr enter">${av(id, 24)}<div class="c"><div class="bub typing"><i></i><i></i><i></i></div></div>${stop ? `<button class="stop" data-act="stop">停止</button>` : ""}</div>`;
function composer(ph, pill) {
  return `<div class="cmp"><textarea id="box" rows="1" placeholder="${ph}"></textarea>
    <div class="r">${pill ? `<span class="pill" title="团队里照旧：容器里的 bash / write_file 要不要逐次问（ADR-0243，只有所有者能翻）">${ic("shield")}免审批 · 关</span>` : "<span></span>"}<button class="send" data-act="send" title="发送">${ic("up")}</button></div></div>`;
}
function header() {
  const sel = S.sel;
  if (sel.k === "team") {
    const t = DB.teams[sel.id];
    return `<div class="hd"><span class="av" style="width:30px;height:30px;font-size:14px">${ic("users")}</span><div class="who"><b>${t.sessions.find((s) => s.id === sel.sid).title}</b><span>${t.name} · 团队 · ${t.people} 人 · 整个团队的智能体都在</span></div>
      <button class="btn" data-act="noop">${ic("gear")}设置</button></div>`;
  }
  const c = chatOf();
  const left = sel.k === "dm"
    ? `${av(sel.id, 30, true)}<div class="who"><b>${AGENTS[sel.id].name}</b><span>${AGENTS[sel.id].desc}</span></div>`
    : `${avStack(c.members, 26)}<div class="who"><b>${c.name}</b><span>${c.members.map((x) => AGENTS[x].name).join(" · ")}</span></div>`;
  return `<div class="hd">${left}
    <button class="btn icon" data-act="noop" title="${sel.k === "dm" ? "语音通话：和它一对一，不弹选人" : "语音通话：拉群里几只进通话"}">${ic("phone")}</button>
    ${sel.k === "dm" ? `<button class="btn icon" data-act="pullFromDm" title="拉别的智能体，和它一起另建一个群">${ic("uplus")}</button>` : `<button class="btn" data-act="addAgent">${ic("uplus")}添加智能体</button>`}
    <button class="btn icon" data-act="${sel.k === "dm" ? "agentSettings" : "noop"}" title="${sel.k === "dm" ? "这只智能体的设置" : "群聊设置：改名、成员、解散"}">${ic("gear")}</button></div>`;
}
function mainHTML() {
  if (S.gate === "unknown") return `<div class="opening"><p>正在查你的订阅……</p></div>`;
  if (gateBlocks() && S.sel.k !== "team")
    return `<div class="opening">${ic("bot")}<h2>${S.gate === "olddb" ? "智能体暂时读不到" : S.gate === "lite" ? "智能体要 Pro 或 Max" : "订阅之后才有智能体"}</h2>
      <p>${S.gate === "olddb" ? "数据库比这个版本旧，缺智能体要用的那几列。这是我们这边的事，不是你的订阅有问题。团队照常能用。" : "每只智能体是一个长期的同事：有名字、有职责、记得你们聊过什么，跑在云端自己的电脑上，电脑关了也接着干。"}</p></div>`;
  const sel = S.sel;
  if (sel.k === "team") {
    const s = DB.teams[sel.id].sessions.find((x) => x.id === sel.sid);
    return `${header()}<div class="tl">${s.msgs.map(bubble).join("")}</div><div class="ft">${composer("输入 @ 点名智能体或成员；不 @ 的话，谁的活谁接", true)}</div>`;
  }
  const c = chatOf(), isDm = sel.k === "dm";
  if (c.msgs.length === 0) return `${header()}${openingCard()}`;
  const ph = isDm ? `跟${AGENTS[sel.id].name}说点什么` : "输入 @ 点名；不 @ 的话，谁的活谁接";
  const older = c.older ? `<button class="older" data-act="loadOlder">更早的消息</button>` : "";
  const busy = S.typing ? typingRow(S.typing, false) : isDm && c.running ? typingRow(sel.id, true) : "";
  return `${header()}<div class="tl" id="tl">${older}${c.msgs.map(bubble).join("")}${busy}</div><div class="ft">${composer(ph, false)}</div>`;
}
function openingCard() {
  const sel = S.sel, c = chatOf();
  if (sel.k === "dm" && sel.id === "admin")
    return `<div class="opening">${av("admin", 56)}<h2>${firstMode() && !S.fresh ? "先建你的第一只智能体" : "跟管理员说一句，建一只新的"}</h2>
      <p>说清它管哪一块就行。管理员会问一句要用哪些连接器，然后直接建好，名字、职责、提示词都替你写了。不满意，点它头像旁的齿轮随时改。</p>

      <div class="chips"><button class="chip" data-act="hint" data-t="帮我建一只管运营的，盯店铺数据、每周出周报">管运营的</button><button class="chip" data-act="hint" data-t="帮我建一只客服，回评价、整理常见问题">客服</button><button class="chip" data-act="hint" data-t="帮我建一只写代码的，改 bug、提 PR">写代码的</button></div>
      <button class="quiet" data-act="manualForm">不想聊，直接填表</button></div>`;
  const who = sel.k === "dm" ? AGENTS[sel.id].name : c.name;
  return `<div class="opening">${sel.k === "dm" ? av(sel.id, 56) : avStack(c.members, 44)}<h2>${who}</h2>
    <p>${sel.k === "dm" ? AGENTS[sel.id].desc + "。" : c.members.map((x) => AGENTS[x].name).join("、") + "都在。"}还没聊过，说第一句话就开始了。以后一直是这一条，回来接着聊。</p>
    ${composer(sel.k === "dm" ? `跟${who}说点什么` : "输入 @ 点名；不 @ 的话，谁的活谁接", false)}</div>`;
}

/* ── 弹层 / 弹窗 / 抽屉 ──────────────────────────────── */

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><button class="quiet" data-act="noop">要和别人一起用？建一个团队</button></div></div></div>`;
  }
  if (S.drawer === "agent") {

      ${isAdmin ? `<div class="ifoot">管理员删不掉：它是替你建智能体的那一只，也是群里没人对口时接活的那一只。</div>` : `<div class="ig"><button class="ir" data-act="noop" style="color:var(--destructive)">删除这只智能体</button></div><div class="ifoot">你和它的整段聊天、它自己的记忆页会一起删掉，不可恢复。它所在的群聊还在，只是少了它。</div>`}
    </div></div>`;

  if (S.drawer === "home") {
    const rowsH = [["file", "文件", "智能体共用的那台电脑上的工作文件夹"], ["plug", "连接器", "接一次，每只智能体都能用"], ["chart", "用量", "本周每只各烧了多少"], ["book", "记忆", "大家共用的那一页 + 每只自己的一页"]];

      <div class="ifoot">和团队设置是同一扇抽屉（ADR-0264 的推入式导航），少了「会话」「成员」和「解散」：这里只有你一个人，聊天就在花名册上，也没有可解散的东西。</div></div></div>`;

      <div class="il">它是谁</div><div class="ig"><div class="ir"><span class="k">名字</span><span class="v dim">@ 它时打的那个词</span></div><div class="ir"><span class="k">职责</span><span class="v dim">一句话，派活按它挑人</span></div><div class="ir"><span class="k">提示词</span><span class="v dim">可以留空</span>${ic("chev")}</div></div>
      <div class="il">它能用什么</div><div class="ig"><div class="ir"><span class="k">型号</span><span class="v">Auto</span>${ic("chev")}</div><div class="ir"><span class="k">连接器</span><span class="v">全部</span>${ic("chev")}</div></div>
      <div class="ifoot">就是今天「团队设置 → 智能体」里那张编辑页，原样搬过来。</div></div></div>`;
  }
  return out;
}

/* ── 判据注释 ─────────────────────────────────────────── */
function notesHTML() {
  const dirNote = {
    A: ["<b>A 联系人</b>：两节（智能体 / 群聊），两行一格，第二行写职责。顺序固定（建的先后），像通讯录——Grok Bot 的花名册就是这个形状。", "与任务 / 项目栏的单行 26px <b>故意不同</b>：那边一行是一条会话，这边一行是一个长期存在的对象。代价：一屏少装一半。", "「一栏一颗开局钮」（#923 / #1087）没破：通栏钮 = 新智能体；新群聊挂在「群聊」节头的 ＋ 上，同团队组头那颗。"],
    B: ["<b>B 紧凑单行</b>：与任务 / 项目栏逐像素同款，18px 头像 + 名字 + 时间。", "密度最高、三栏视觉最统一；代价：读起来像会话列表，最不像「一个个同事」。"],
    C: ["<b>C 最近混排</b>：不分节，智能体和群聊按最近活动排成一列，第二行是最后一句话。<b>最像微信</b>。", "代价两条：① 花名册不再稳定，常用的那只会被刚说话的顶下去；② 第二行要每条聊天的最后一句，而桌面拿不到没开着的会话的内容——得让 runtime 往 <code>workspace_sessions</code> 再写一列预览（同标题 / 参与者那两列的写法，ADR-0283），每句话多一次写库。", "新群聊与设置挤在同一个节头，没有「群聊」这个词可挂。"],
  }[S.dir];
  const gateNote = {
    ready: [], first: ["首次：主场刚建好，名册里只有触发器种的「管理员」。主区直接落在它的开局卡上，第一件事就是建一只。"],
    lite: ["<code>plan_too_low</code> 独立一态：已订阅的人走 Portal 换档，不给 checkout（ADR-0242，再开一张 = 第二条订阅）。", "闸卡在<b>建主场</b>这一侧：别人的团队照常参与（ADR-0217）。"],
    free: ["没订阅走 checkout。文案不写「填自己的 key」——云端只走订阅额度（ADR-0233）。"],
    unknown: ["<code>billing === null</code> 画骨架，不画空态也不劝订阅：还没查到 ≠ 没有（ADR-0217 / 0240）。"],
    olddb: ["0037 没跑：新列单独一条容错查询，读不到只挂花名册这一块，团队照常（#1213 的教训）。原因说人话，原文进 title（ADR-0189）。"],
  }[S.gate];
  let scr = [], tryIt = [];
  const sel = S.sel, c = chatOf();
  if (S.drawer === "agent") scr = ["头部齿轮 → 抽屉里推入这只的编辑页，就是今天 <code>WorkspaceAgentsTab</code> 那张（ADR-0264）。", "删除 = 桌面先让 runtime 删掉它那条私聊（现成的 <code>delete</code> 帧，ADR-0245），再删那一行；半路失败就停，说清。", "用量报占比不报钱（ADR-0264 / 0241）。"];
  else if (S.drawer === "home") scr = ["个人主场就是一个 <code>kind='home'</code> 的 workspace，所以设置直接复用团队那扇抽屉，摘掉三格。", "连接器「接一次，全员可用」= <code>workspace_agents.tools</code> 的 <code>[]</code> 本来就是整池放行（ADR-0221），对上 Grok Bot「工具挂账号」。"];
  else if (S.dialog === "newGroup") scr = ["表单与确认走居中弹窗（ADR-0265）。2～6 只由库里的 check 约束兜底。", "多人协作不在这儿：那是团队，容器 / 计费 / 成员都是另一套，所以只给一条去处，不混进同一张表单。"];
  else if (sel.k === "team") scr = ["<b>团队一个字没变</b>：可折叠组 + 多条会话 + 组头 ＋ / ⚙，整份名单都在群里，审批开关也照旧（输入框左下那枚还在）。", "v1 不跨租户：我的智能体不进多人团队。"];
  else if (c && c.msgs.length === 0) scr = sel.k === "dm" && sel.id === "admin"
      ? ["「新智能体」默认落在管理员这里：<code>create_agent</code> 早就有（ADR-0224），这里只是把入口摆到最顺手的地方。", "<b>不弹卡</b>：主场全免审批（你定的）。管理员问清楚就直接建，建完告诉你；名册刷新靠现成的 <code>createAgentLanded</code>。", "表单那条路留着当第二入口，不藏。"]
      : ["还没聊过的那一屏。<b>什么都不建</b>（ADR-0218）：第一句话发出去，runtime 才建这条聊天对应的那一条云会话，之后永远是它。"];
  else if (sel.k === "dm") scr = ["<b>一只一条永久线</b>（Grok Bot 原样）：没有新话题、没有历史、没有会话这个词。日期分隔条是这条线上唯一的「分段」。", "<b>上下文系统自己管，界面一个字不提</b>：没有上下文环，压缩发生时时间线上不画东西。runtime 三条规则：① 预算闸——超过一个固定 token 预算就压，不等撑到窗口的 75%（永久线每句话都背着全部上下文，等窗口满太贵）；② 闲置压缩——隔了几个小时再开口，先压再答（厂商的前缀缓存早过期了，旧上下文是原价重读）；③ 跨压缩的长期记忆仍是它自己那页 wiki。", "「更早的消息」= backlog 从尾巴倒着分页。今天进房是全量拉，永久线上这条必须改。", "没有 @ 弹层：名单里只有它，不 @ 直接给它，也不问派活分类器（ADR-0275 的单成员规则）。没有型号选择器：型号配在智能体上。", "<b>没有免审批开关</b>：主场恒全免（你定的），runtime 按 <code>kind='home'</code> 判，放行照样落 <code>approval_decision</code> 留账。", "在跑的那一轮只有一枚输入指示器 + 停止（ADR-0250）。"];
  else scr = ["群也是一条永久线。头部写的是<b>这个群里有谁</b>，@ 弹层也只列这几只——名单在 runtime 的那一个口收窄，派活 / 接力 / brief 一起对。", "拉人 = 控制房一条帧，runtime 改库 + 落一条 <code>chat_roster_changed</code>，时间线居中画一行（同通话那一行的画法，ADR-0286）。<b>不自动起一轮</b>：文字群里打招呼是白烧额度。", "语音通话是现成的（ADR-0271），通话名单 ⊆ 群名单。"];
  if (S.gate === "ready" || S.gate === "first") {
    if (sel.k === "dm" && sel.id === "admin") tryIt = ["点一个提示 chip 再发送 → 回它一句 → 名册里多一行（不弹卡）", "「不想聊，直接填表」"];
    else if (sel.k === "dm") tryIt = ["发一句话", "「运营」顶上的「更早的消息」", "切到「开发」：它这一轮还在跑，有停止", "头部「拉人」图标：带着它另建一个群", "齿轮：这只的设置与删除说明"];
    else if (sel.k === "group") tryIt = ["「添加智能体」→ 勾「投放」→ 拉进来", "输入框里打一个 @：只列群里的", "侧栏「群聊」节头的 ＋：新群聊"];
    else tryIt = ["团队会话：样子与今天一致"];
    tryIt.push("侧栏「智能体」节头的齿轮：主场设置", "顶上「新智能体」", "顶栏「状态与未读」切到预览：在跑的点 + 未读数");
  }
  const li = (a) => a.map((x) => `<li>${x}</li>`).join("");
  return `<div class="card"><h2>判据注释</h2><h3>侧栏方向</h3><ul>${li(dirNote)}</ul>
    ${gateNote.length ? `<h3>进门状态</h3><ul>${li(gateNote)}</ul>` : ""}<h3>这一屏</h3><ul>${li(scr)}</ul>
    ${S.presence === "on" ? `<h3>状态与未读</h3><ul><li>在跑的点用现成的 <code>AvatarBadge</code> 那一格，未读数同 <code>MentionBadge</code> 的画法。<b>A 里都不画</b>：桌面今天只知道自己开着的那条会话，画出来就是 #722 那个撒谎的勾。数据源归 #1282。</li><li>全免审批之后没有「等你审批」这一态了。</li><li>挂一整天的记号，不做入场动效、不脉动（同 ADR-0255 那枚点）。</li></ul>` : ""}</div>
    ${tryIt.length ? `<div class="card try"><h2>这一屏可以点</h2><ul>${li(tryIt)}</ul></div>` : ""}
    <div class="card"><h2>动效</h2><ul><li>切栏 / 切行：不动。一天点几十次的东西不配动效。</li><li>弹层从触发钮长出来（160ms，强 ease-out）；弹窗居中 .96→1；抽屉 260ms iOS 曲线。</li><li>按钮按下 .97，行只给高亮不缩（一列里某行忽然变小会打断基线）。</li><li>新智能体那一行入场：淡入 + 4px + 轻虚化，一次。这是稀有事件，值得一点反馈。</li><li>reduced-motion：位移全撤，只留淡入。</li></ul></div>`;
}

/* ── 渲染与动作 ───────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function render(parts = "smln") {
  if (parts.includes("s")) { $("sbHead").innerHTML = sbHead(); $("sbBody").innerHTML = sbBody(); }
  if (parts.includes("m")) { $("main").innerHTML = mainHTML(); const tl = $("tl"); if (tl && !S.keepScroll) tl.scrollTop = tl.scrollHeight; S.keepScroll = false; }
  if (parts.includes("l")) $("layer").innerHTML = layerHTML();
  if (parts.includes("n")) $("notes").innerHTML = notesHTML();
  document.querySelectorAll(".seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(S[seg.dataset.seg] === b.dataset.v))));
  document.documentElement.className = S.theme === "dark" ? "dark" : "";
}
const closeAll = () => { S.pop = null; S.dialog = null; S.drawer = null; };
const allChats = () => Object.values(DB.dm).concat(Object.values(DB.groups));
const clearFresh = () => allChats().forEach((c) => c.msgs.forEach((x) => delete x.fresh));
const later = (ms, fn) => setTimeout(fn, ms);

function say(text) {
  const sel = S.sel, c = chatOf();
  if (!text.trim() || !c) return;
  clearFresh();
  if (spoken(c.msgs).length === 0 || c.msgs.filter((x) => x.who === "day").pop()?.text !== "今天") c.msgs.push(day("今天"));
  c.msgs.push({ who: "me", text, fresh: true });
  NOW[sel.id] = "刚刚";
  const replier = sel.k === "dm" ? sel.id : membersOf().find((id) => text.includes("@" + AGENTS[id].name)) || membersOf()[0];
  S.typing = replier; render("smn");
  later(900, () => {
    S.typing = null; clearFresh();
    if (sel.k === "dm" && sel.id === "admin") adminFlow(c, text);
    else c.msgs.push({ who: replier, text: "收到。我先看一眼现状，十分钟内给你个结论。", fresh: true });
    render("smn");
  });
}
function adminFlow(c, text) {
  if (S.flow === 0) {
    S.flow = 1; S.want = /客服/.test(text) ? "cs" : "ops";
    c.msgs.push({ who: "admin", text: "可以。问一句：它要碰哪些连接器？我看你接着 Shopify 和 Google Ads，两台都给它，还是只给 Shopify？", fresh: true });
    return;
  }
  const id = firstMode() ? "ops" : "cs", a = AGENTS[id];
  if (firstMode()) { DB.dm.ops = { msgs: [] }; }
  if (!DB.roster.includes(id)) DB.roster.push(id);
  S.fresh = id; S.flow = 0;
  c.msgs.push({ who: "admin", text: `建好了：「${a.name}」，${a.desc}。提示词我替它写了，两台连接器都给了。它已经在左边的名册里。`, fresh: true },
    { who: "sys", fresh: true, html: `<button class="btn" data-act="openDm" data-id="${id}">${av(id, 16)}去和「${a.name}」聊</button>` });
}

document.addEventListener("click", (e) => {
  const segBtn = e.target.closest(".seg button");
  if (segBtn) {
    const k = segBtn.parentElement.dataset.seg; S[k] = segBtn.dataset.v; closeAll();
    if (k === "gate") {
      S.flow = 0; S.fresh = null; DB.dm.admin.msgs = [];
      S.sel = S.gate === "first" ? { k: "dm", id: "admin" } : { k: "dm", id: "ops" };
    }
    return render();
  }
  const el = e.target.closest("[data-act]");
  if (!el) { if (S.pop && !e.target.closest(".pop")) { S.pop = null; render("l"); } return; }
  if (el.classList.contains("scrim") && e.target.closest("[data-stop]")) return;
  const act = el.dataset.act, id = el.dataset.id;
  const A = {
    noop() {},
    openDm() { closeAll(); clearFresh(); S.sel = { k: "dm", id }; if (S.fresh !== id) S.fresh = null; render(); },
    openGroup() { closeAll(); clearFresh(); S.sel = { k: "group", id }; render(); },
    openTeam() { closeAll(); S.sel = { k: "team", id, sid: el.dataset.sid }; render(); },
    toggleTeam() { S.teamOpen = !S.teamOpen; render("s"); },
    newAgent() { closeAll(); clearFresh(); DB.dm.admin.msgs = []; S.sel = { k: "dm", id: "admin" }; S.flow = 0; render(); later(0, () => $("box") && $("box").focus()); },
    hint() { const b = $("box"); b.value = el.dataset.t; b.focus(); },
    manualForm() { S.drawer = "form"; render("ln"); },
    loadOlder() { const c = chatOf(); c.msgs.unshift(...(OLDER[S.sel.id] || [])); c.older = false; S.keepScroll = true; render("m"); },
    stop() { const c = chatOf(); c.running = false; clearFresh(); c.msgs.push({ who: "sys", fresh: true, html: "你停掉了这一轮" }); render("smn"); },
    addAgent() { S.pop = S.pop === "addAgent" ? null : "addAgent"; S.addPick = new Set(); render("l"); },
    togAdd() { S.addPick.has(id) ? S.addPick.delete(id) : S.addPick.add(id); render("l"); },
    closePop() { S.pop = null; render("l"); },
    confirmAdd() {
      const g = DB.groups[S.sel.id]; clearFresh();
      [...S.addPick].forEach((x) => { g.members.push(x); g.msgs.push({ who: "sys", fresh: true, html: `你把 ${av(x, 14)}「${AGENTS[x].name}」拉进了群聊` }); });
      S.pop = null; render();
    },
    pickMention() { const b = $("box"); b.value = b.value.replace(/@$/, "") + "@" + AGENTS[id].name + " "; S.pop = null; render("l"); b.focus(); },
    newGroup() { closeAll(); S.dialog = "newGroup"; S.pick = new Set(); S.gname = ""; render("ln"); later(0, () => $("gname") && $("gname").focus()); },
    pullFromDm() { closeAll(); S.dialog = "newGroup"; S.pick = new Set([S.sel.id]); S.gname = ""; render("ln"); },
    togPick() { S.gname = $("gname").value; S.pick.has(id) ? S.pick.delete(id) : S.pick.add(id); render("l"); },
    closeDialog() { S.dialog = null; render("ln"); },
    createGroup() {
      const gid = "g" + Date.now(), name = $("gname").value.trim() || [...S.pick].map((x) => AGENTS[x].name).join("、");
      DB.groups[gid] = { id: gid, name, members: [...S.pick], msgs: [] }; DB.groupOrder.unshift(gid); NOW[gid] = "";
      S.dialog = null; S.fresh = gid; S.sel = { k: "group", id: gid }; render();
    },
    agentSettings() { S.pop = null; S.drawer = "agent"; render("ln"); },
    homeSettings() { closeAll(); S.drawer = "home"; render("ln"); },
    closeDrawer() { S.drawer = null; render("ln"); },
    send() { const b = $("box"); if (b) { const t = b.value; b.value = ""; S.pop = null; render("l"); say(t); } },
  };
  if (A[act]) A[act]();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (S.pop || S.dialog || S.drawer)) { closeAll(); return render("ln"); }
  if (e.target.id === "box" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); const t = e.target.value; e.target.value = ""; S.pop = null; render("l"); say(t); }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "box" || S.sel.k !== "group") return;
  const want = /@$/.test(e.target.value) ? "mention" : null;
  if (want !== (S.pop === "mention" ? "mention" : null)) { S.pop = want; render("ln"); }
});
render();
</script>
</body>
</html>
