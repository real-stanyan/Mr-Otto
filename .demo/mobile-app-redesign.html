     <div style="display:flex;gap:8px;padding-bottom:6px">
       <button class="btn sec" data-close style="flex:1">拒绝</button>
       <button class="btn" data-close style="flex:1.3">批准这一次</button></div>
     <button class="btn ghost" data-close style="height:38px">这个团队里以后都别问我</button>
     <div style="height:6px"></div></div>`),
};

const ACTS={
 voice:(b)=>{ const v=b.dataset.v||'task'; closeSheet();
   if(v==='team') goUp('callTeam',{}); else goUp('call',{from:stack[stack.length-1]?.el.querySelector('.navrow .mid')?.textContent}); },
 newTask:()=>go('taskNew',{}),
 send:(b)=>{ const box=b.closest('.composer').querySelector('.cmpBox');
   if(!box.classList.contains('filled')) return;      // 空的就是空的，不假装发出去了
   box.textContent=''; box.classList.remove('filled'); },
 signin:()=>resetTo('tasks','tasks'),
 /* 登录 ↔ 注册：同一张卡原地换态。清掉的只有注册才有的两格（同桌面切换那三行） */
 gateMode:(b)=>{ const card=b.closest('.glasscard'), up=!card.classList.contains('up');
   card.classList.toggle('up',up);
   card.querySelectorAll('.fold').forEach(x=>x.inert=!up);
   card.querySelector('.gatelink.fg').inert=up;
   card.querySelector('[data-f="pw"]').placeholder=up?'密码（至少 6 位）':'密码';
   if(!up) card.querySelectorAll('[data-f="name"],[data-f="pw2"]').forEach(i=>i.value='');
   card._check(); gateMark(up?'signup':'signin'); },
 /* 主按钮：登录态照旧直接进；注册态交出去之后是「等确认邮件」那张 */
 gateSubmit:(b)=>{ const card=b.closest('.glasscard');
   if(!card.classList.contains('up')) return ACTS.signin();
   if(b.disabled||b.dataset.busy) return;
   const lbl=b.querySelector('.swap .b'); b.dataset.busy='1'; lbl.textContent='…';   // 同桌面忙时那个「…」
   setTimeout(()=>{ if(!b.isConnected) return; delete b.dataset.busy; lbl.textContent='注册';
     openConfirm(b.closest('.scr'),card.querySelector('[data-f="email"]').value.trim()); },650); },
 forgot:(b)=>openForgot(b.closest('.scr'),{email:b.closest('.glasscard').querySelector('[data-f="email"]').value.trim()}),
 mute:(b)=>{ b.classList.toggle('on'); },
 approve:(b)=>{ const card=b.closest('.card'); card.className='card';
   card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;color:var(--ok)">${I('check',17,2.4)}
     <b style="font-size:14.5px">你批准了 · 正在跑</b></div>
   <div class="codeblk" style="margin-top:9px">npm test</div>`; },
 deny:(b)=>{ const card=b.closest('.card'); card.className='card';
   card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;color:var(--mutedFg)">${I('x',16,2.2)}
     <b style="font-size:14.5px">你拒绝了 —— 它会换个说法再问，或者就此打住</b></div>`; },
 disband:()=>sheet(`<div class="grab"></div><div class="sh" style="color:var(--destructive)">解散「Otto 核心组」？</div>
   <div class="sbody" style="padding:0 20px">
     <div class="t-call dim" style="margin-bottom:16px">这个团队的 2 段云会话会一起删掉，不可恢复。成员会收到一条通知。</div>
     <div style="display:flex;gap:8px;padding-bottom:8px">
       <button class="btn sec" data-close style="flex:1">算了</button>
       <button class="btn bad" data-close style="flex:1">解散</button></div></div>`),
 /* 切格。列表整块换，不重建抽屉 —— 重建会把它的高度与拖拽状态一起弹一下 */
 modelTab:(b)=>{ const on=b.parentElement.querySelector('button.on')===b?b:b;
   const sheetEl=b.closest('.sheet'), idx=[...b.parentElement.querySelectorAll('button')].indexOf(b);
   sheetEl.querySelector('[data-pane="text"]').hidden=idx!==0;
   sheetEl.querySelector('[data-pane="image"]').hidden=idx!==1; },
 /* 选中即关（同桌面）。文字那格顺手把触发器上那行字换掉；图像那格**不换** ——
    那颗按钮报的是文字模型 */
 pickModel:(b)=>{ const pane=b.closest('[data-pane]').dataset.pane;
   PICK[pane]=b.dataset.id;
   if(pane==='text') document.querySelectorAll('.cmpBar .mini[data-sheet="model"]').forEach(el=>{
     el.innerHTML=`${I('spark',13,2)}${textPillLabel()}`; });
   closeSheet(); },
 pickVoice:(b)=>{ const list=b.closest('.list');
   list.querySelectorAll('.ck').forEach(c=>c.style.opacity='0');
   b.querySelector('.ck').style.opacity='1'; },
 approvalSheet:()=>SHEETS.approval(),
 /* 订阅：点一档就走。升档 / 同能力降档直接去 Stripe（它的确认页会写清差价）；
    少了能力的降档、取消，先在 App 里把「会少什么」说清楚 —— 那是 Stripe 不知道的事 */
 subPlan:(b)=>{ const cur=planOf(SUB.plan), to=planOf(b.dataset.id);
   if(!to||to===cur) return;
   if(!cur) return openWeb(JOB.checkout(to.id));
   const loses=to.usd<cur.usd?cur.caps.filter(c=>!to.caps.includes(c)):[];
   if(loses.length) subDowngradeDlg(to,loses); else openWeb(JOB.change(to.id)); },
 subAddon:()=>openWeb(JOB.addon()),
 subWeb:(b)=>openWeb(JOB[b.dataset.k]()),
 subCancel:()=>subCancelDlg(),
 subWebGo:(b)=>{ const j=b.dataset.j, id=b.dataset.id; closeSheet();
   setTimeout(()=>openWeb(j==='change'?JOB.change(id):JOB.cancel()),170); },
 webDone:()=>webDone(),
};

/* 输入框：有没有字只看 .filled 这一格（发送钮亮不亮挂在它上面）。
   回车发、Shift+回车换行；输入法还在拼字时的回车是「选词」，不能当成发送。
   点发送不抢焦点 —— 发完手指接着打字，键盘不该收起来 */
document.addEventListener('input',e=>{ const box=e.target.closest?.('.cmpBox'); if(!box) return;
  if(!box.textContent) box.textContent='';          // 删空之后 Chrome 会剩一个 <br>
  box.classList.toggle('filled',box.textContent.trim()!==''); });
document.addEventListener('keydown',e=>{ const box=e.target.closest?.('.cmpBox');
  if(!box||e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229) return;
  e.preventDefault(); ACTS.send(box.closest('.composer').querySelector('.sendsm')); });
document.addEventListener('mousedown',e=>{ if(e.target.closest?.('.sendsm')) e.preventDefault(); });

const TAB_ROOT={tasks:'tasks',projects:'projects',teams:'teams'};
function switchTab(t){ if(t===currentTab && stack.length===1 && stack[0].id===TAB_ROOT[t]) return; resetTo(TAB_ROOT[t],t); }

/* 屏被移走时收掉它的 rAF/interval */
new MutationObserver(ms=>ms.forEach(m=>m.removedNodes.forEach(n=>n._stop&&n._stop())))
  .observe(stackEl,{childList:true});

/* ── 左侧索引栏 ───────────────────────────────────────────────────── */
const railEl=document.getElementById('rail');
function buildRail(){
  const grps={};
  Object.entries(SCREENS).forEach(([id,d])=>{ if(d.rail===false) return; (grps[d.grp||'其它']=grps[d.grp||'其它']||[]).push([id,d.label||id]) });
  railEl.innerHTML=`
   <h1 style="display:flex;align-items:center;gap:8px">
     <img src="${IMG.otto}" alt="" style="width:22px;height:22px;border-radius:6px">
     <span style="font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-style:italic">Mr Otto</span>
     <span style="opacity:.55;font-weight:500">· App 重设计</span></h1>
   <div class="sub">任务 / 项目 / 团队三栏，语音是会话页里的一个模式。<br>
     点任意一屏直接跳；机身内可左缘右划返回、抽屉可下拽。</div>
   <div class="railbtns"><button data-r="theme">浅色 / 深色</button><button data-r="approval">弹一张审批</button><button data-r="mention">弹 @ 名册</button></div>
   ${Object.entries(grps).map(([g,items])=>`<div class="grp">${g}</div>
     ${items.map(([id,lb])=>`<a data-jump="${id}"><i>▸</i>${lb}</a>`).join('')}`).join('')}
   <div class="grp">说明</div>
   <div style="font-size:11.5px;opacity:.45;line-height:1.65;padding:0 9px">
     颜色 / 圆角 / 字距 / 弹簧参数全部取自 <b>mobile/src/theme.ts</b>，一个数都没另起。<br><br>
     动效一律临界阻尼（ζ=1），只有松手带动量的那一下给回弹（抽屉 ζ=0.82）。<br><br>
     换栏不做过场 —— 每天点几十次的动作不该有等待。
   </div>`;
}
function syncRail(){
  const cur=stack[stack.length-1]?.id;
  railEl.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.jump===cur));
  const d=SCREENS[cur]; const lb=d?(d.label||cur):'';
  document.getElementById('caption').textContent=d?(lb.includes(' · ')?lb:`${d.grp||''} · ${lb}`):'';
}
railEl.addEventListener('click',e=>{
  const a=e.target.closest('[data-jump]');
  if(a){ closeSheet(true); const id=a.dataset.jump, d=SCREENS[id];
    SUB_TOK++; SUB_STAT=null; WEB_JOB=null; if(d.preset) Object.assign(SUB,SUB_PRESET[d.preset]);
    if(d.tab){ currentTab=d.tab;
      const root=TAB_ROOT[d.tab];
      if(id===root) resetTo(root,d.tab);
      else { resetTo(root,d.tab); go(id,id==='taskChat'?{id:'t1'}:id==='projectChat'?{pj:'p1',id:'p1s1'}:id==='teamChat'?{w:'w1',id:'w1s1'}:{}); }
    } else if(id==='call'||id==='callTeam'){
      resetTo(id==='call'?'tasks':'teams',id==='call'?'tasks':'teams');
      if(id==='call') go('taskChat',{id:'t1'}); else go('teamChat',{w:'w1',id:'w1s1'});
      goUp(id,{});
    } else if(d.via){ resetTo(d.via); go(id,{}); } else { resetTo(id); }
    return; }
  const b=e.target.closest('[data-r]');
  if(b){ if(b.dataset.r==='theme'){
      const cur=document.documentElement.dataset.theme==='light'?'dark':'light';
      document.documentElement.dataset.theme=cur;
    } else if(b.dataset.r==='mention'){          // 真机上是在群聊输入框里打 @ 弹出来的
      if(stack[stack.length-1]?.id!=='teamChat'){ closeSheet(true); resetTo('teams','teams'); go('teamChat',{w:'w1',id:'w1s1'}); }
      SHEETS.mention();
    } else SHEETS.approval(); }
});

buildRail();
resetTo('splash');
