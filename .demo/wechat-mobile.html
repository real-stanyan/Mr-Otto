    }, 500);
    $("#c-end").addEventListener("click", endCall);
    /* 收起 = 通话照旧，屏幕回到聊天，右上角留一颗「通话中」（点它回来） */
    $("#c-min").addEventListener("click", () => { mcall.classList.remove("on"); $("#sbar").classList.remove("light"); $("#cpill").classList.add("on"); });
    $("#c-mute").addEventListener("click", (e) => { call.muted = !call.muted; e.currentTarget.classList.toggle("on", call.muted); e.currentTarget.innerHTML = ic(call.muted ? "mic-off" : "mic", 28); });
    $("#c-sub").addEventListener("click", (e) => { e.currentTarget.classList.toggle("on"); const s = $("#csub"); s.style.visibility = s.style.visibility === "hidden" ? "visible" : "hidden"; });
    (async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const fe = () => mcall.querySelector("#cface .av"), fw = () => mcall.querySelector("#cface");
      await wait(1100);
      for (const [w, text] of script) {
        if (call.stop) return;
        const agent = w !== "me";
        Face.setState(fe(), agent ? "speaking" : "listening");
        fw().classList.toggle("talking", agent);
        $("#cst").textContent = agent ? "正在说" : "在听";
        for (let i = 1; i <= text.length; i++) {
          if (call.stop) return;
          $("#csub").innerHTML = `<span class="who">${agent ? esc(AGENTS[agentId].name) : "你"}：</span>${esc(text.slice(0, i))}`;
          await wait(agent ? 70 : 55);
        }
        const s = Math.floor((Date.now() - started) / 1000);
        lines.push([w, text, `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`]);
        await wait(900);
      }
      if (call.stop) return;
      Face.setState(fe(), "listening");
      fw().classList.remove("talking");
      $("#cst").textContent = "在听";
    })();
  }
  function endCall() {
    const call = M.call;
    if (!call) return;
    call.stop = true;
    clearInterval(call.timer);
    mcall.classList.remove("on");
    $("#cpill").classList.remove("on");
    $("#sbar").classList.remove("light");
    const s = Math.max(1, Math.floor((Date.now() - call.started) / 1000));
    Sim.push(call.c, "me", "", "call", { dur: `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`, lines: call.lines });
    M.call = null;
  }

  /* ── 说明面板 + 跳转 ─────────────────────────────────────────────── */
  const pref = (() => { try { return JSON.parse(localStorage.getItem("otto-wx-demo") || "{}"); } catch { return {}; } })();
  const savePref = () => { try { localStorage.setItem("otto-wx-demo", JSON.stringify(pref)); } catch {} };
  function applyPref() {
    const r = document.documentElement;
    if (pref.theme === "light" || pref.theme === "dark") r.dataset.theme = pref.theme; else delete r.dataset.theme;
    if (pref.skin === "green") r.dataset.skin = "green"; else delete r.dataset.skin;
  }
  function rerootAll() { switchTabForce(M.tab); }
  function switchTabForce(tab) { M.tab = tab; setRoot(tab === "chats" ? chatsRoot() : tab === "contacts" ? contactsRoot() : meRoot()); }
  const JUMPS = [
    ["聊天列表", () => switchTabForce("chats")],
    ["私聊 · 文案", () => { switchTabForce("chats"); openChat("c_wenan"); }],
    ["群聊 · 上新小队", () => { switchTabForce("chats"); openChat("c_shangxin"); }],
    ["团队 · 山茶小铺", () => { switchTabForce("chats"); push(teamPage("tm_shancha")); }],
    ["朋友 · 小红", () => { switchTabForce("chats"); openChat("c_xh"); }],
    ["聊天信息", () => { switchTabForce("chats"); openChat("c_shangxin"); setTimeout(() => push(infoPage(CHATS.c_shangxin)), 450); }],
    ["通讯录", () => switchTabForce("contacts")],
    ["智能体资料", () => { switchTabForce("contacts"); push(agentPage("a_kefu")); }],
    ["我", () => switchTabForce("me")],
    ["额度", () => { switchTabForce("me"); push(mePage("quota")); }],
    ["新建智能体", () => { switchTabForce("chats"); newAgentDialog(); }],
    ["语音通话", () => { switchTabForce("chats"); openChat("c_wenan"); setTimeout(() => startCall(CHATS.c_wenan), 450); }],
  ];
  function panelHTML() {
    const seg = (key, opts, cur) => `<span class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</span>`;
    return `<div class="h"><b>微信式布局 · 手机 demo</b></div>
      <div class="ctl"><span>主题</span>${seg("theme", [["auto", "跟随"], ["light", "浅色"], ["dark", "深色"]], pref.theme || "auto")}
      <span>配色</span>${seg("skin", [["otto", "Otto"], ["green", "绿色气泡"]], pref.skin || "otto")}
      <span>订阅</span>${seg("sub", [["pro", "Pro"], ["free", "没订阅"]], M.sub)}</div>
      <div><h4>跳到</h4><div class="jump">${JUMPS.map(([l], i) => `<button data-j="${i}">${l}</button>`).join("")}</div></div>
      <p style="margin:0;color:var(--fg-2)">左缘往右划能返回；输入框左边那颗切「按住说话」（按住、上划取消）；右边 + 里是通话和拉群。数据全是编的。<a href="wechat-desktop.html">桌面 demo →</a></p>
      <div><h4>demo 里有、今天还没有的</h4><ul>${NEW_THINGS.map(([a, b]) => `<li><b>${a}</b>：${b}</li>`).join("")}</ul></div>
      <div><h4>和现在的手机端比，换掉的</h4><ul><li>名册单栏（Grok 式）→ 底部三格：聊天 / 通讯录 / 我</li><li>页头三颗圆钮 → 标题栏 + 右上角 ⊕</li><li>聊天页的药丸头 → 标准导航栏，返回键带未读数</li><li>「开电话」那颗大钮 → 左边按住说话，右边 + 里打电话</li><li>判据（谁排前面、藏哪些事件、派活线）照旧，换的是外壳</li></ul></div>`;
  }
  function bindPanel(root) {
    $$("[data-k]", root).forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === "sub") { M.sub = v; rerootAll(); }
      else { pref[k] = v; savePref(); applyPref(); }
      renderSide();
    }));
    $$("[data-j]", root).forEach((b) => b.addEventListener("click", () => { closeDialog(); closeSheet(); if (M.call) endCall(); JUMPS[+b.dataset.j][1](); $("#demo-sheet").classList.remove("on"); }));
  }
  function renderSide() {
    const side = $("#side");
    side.innerHTML = panelHTML();
    bindPanel(side);
    const ds = $("#demo-sheet");
    ds.innerHTML = panelHTML() + `<button class="btn soft" id="ds-x">关闭</button>`;
    bindPanel(ds);
    $("#ds-x").addEventListener("click", () => ds.classList.remove("on"));
  }
  $("#fab").innerHTML = ic("info", 20);
  $("#cpill").addEventListener("click", () => { $("#cpill").classList.remove("on"); mcall.classList.add("on"); $("#sbar").classList.add("light"); });
  $("#fab").addEventListener("click", () => $("#demo-sheet").classList.toggle("on"));

  /* ── 装配 ─────────────────────────────────────────────────────────── */
  Sim.on((id) => {
    renderTabbar();
    for (const p of stack) p.onSim && p.onSim(id);
    // 通话收尾落下的那条记录：开着那条聊天就刷一下
  });
  applyPref();
  renderSide();
  switchTabForce("chats");
  const tick = () => ($("#clock").textContent = hhmm(Date.now()));
  tick();
  setInterval(tick, 15000);
})();
</script>
