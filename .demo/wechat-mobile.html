<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otto 微信式手机</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   微信式布局 demo 共用的一层（#1386）。
   令牌照 DESIGN.md：浅色暖纸 / 深色 Apple 四色底盘；「绿色气泡」那一套只是
   给维护者对照看的皮，不是提案的默认值。
   ───────────────────────────────────────────────────────────────────────── */

:root {
  /* 地面 / 浮起的表面 / 侧栏（竖条 + 会话列表） */
  --ground: #efece3;
  --surface: #f7f5ef;
  --side: #e9e5d8;
  --rail: #e9e5d8;
  --raised: #e5e1d3;
  --hover: rgba(0, 0, 0, 0.045);
  --press: rgba(0, 0, 0, 0.08);
  --select: #dce6f2;
  --select-fg: #000000;
  --select-fg-2: rgba(0, 0, 0, 0.55);
  --fg: #000000;
  --fg-2: rgba(0, 0, 0, 0.55);
  --fg-3: rgba(0, 0, 0, 0.4);
  --line: rgba(0, 0, 0, 0.12);
  --line-2: rgba(0, 0, 0, 0.07);
  --input: rgba(0, 0, 0, 0.12);
  --field: rgba(0, 0, 0, 0.055);
  --input-bg: #f7f5ef;
  --brand: #4a70a9;
  --primary: #4a70a9;
  --on-primary: #ffffff;
  --tab-active: #4a70a9;
  --bubble-them: #e5e1d3;
  --bubble-them-fg: #000000;
  --bubble-me: color-mix(in srgb, #4a70a9 18%, #f7f5ef);
  --bubble-me-fg: #000000;
  --bubble-radius: 12px;
  --badge: #4a70a9;
  --badge-fg: #ffffff;
  --danger: #c92a2a;
  --ok: #2b8a3e;
  --warn: #e67700;
  --face-disc: #f2f2f3;
  --voice: #2f94a6;
  --scrim: rgba(0, 0, 0, 0.28);
  --menu: #f7f5ef;
  --menu-fg: #000000;
  --menu-line: rgba(0, 0, 0, 0.08);
  --shadow-float: 0 12px 32px rgba(40, 32, 12, 0.16), 0 2px 6px rgba(40, 32, 12, 0.08);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000;
    --surface: #1d1d1f;
    --side: #1d1d1f;
    --rail: #1d1d1f;
    --raised: #2c2c2e;
    --hover: rgba(245, 245, 247, 0.05);
    --press: rgba(245, 245, 247, 0.09);
    --select: #2c2c2e;
    --select-fg: #f5f5f7;
    --select-fg-2: rgba(245, 245, 247, 0.56);
    --fg: #f5f5f7;
    --fg-2: rgba(245, 245, 247, 0.56);
    --fg-3: rgba(245, 245, 247, 0.38);
    --line: rgba(245, 245, 247, 0.12);
    --line-2: rgba(245, 245, 247, 0.07);
    --input: rgba(245, 245, 247, 0.14);
    --field: rgba(245, 245, 247, 0.08);
    --input-bg: #2c2c2e;
    --brand: #0a84ff;
    --primary: #0071e3;
    --tab-active: #0a84ff;
    --bubble-them: #2c2c2e;
    --bubble-them-fg: #f5f5f7;
    --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
    --bubble-me-fg: #f5f5f7;
    --badge: #0a84ff;
    --danger: #ff453a;
    --ok: #30d158;
    --warn: #ff9f0a;
    --scrim: rgba(0, 0, 0, 0.5);
    --menu: #2c2c2e;
    --menu-fg: #f5f5f7;
    --menu-line: rgba(245, 245, 247, 0.08);
    --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000;
  --surface: #1d1d1f;
  --side: #1d1d1f;
  --rail: #1d1d1f;
  --raised: #2c2c2e;
  --hover: rgba(245, 245, 247, 0.05);
  --press: rgba(245, 245, 247, 0.09);
  --select: #2c2c2e;
  --select-fg: #f5f5f7;
  --select-fg-2: rgba(245, 245, 247, 0.56);
  --fg: #f5f5f7;
  --fg-2: rgba(245, 245, 247, 0.56);
  --fg-3: rgba(245, 245, 247, 0.38);
  --line: rgba(245, 245, 247, 0.12);
  --line-2: rgba(245, 245, 247, 0.07);
  --input: rgba(245, 245, 247, 0.14);
  --field: rgba(245, 245, 247, 0.08);
  --input-bg: #2c2c2e;
  --brand: #0a84ff;
  --primary: #0071e3;
  --tab-active: #0a84ff;
  --bubble-them: #2c2c2e;
  --bubble-them-fg: #f5f5f7;
  --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
  --bubble-me-fg: #f5f5f7;
  --badge: #0a84ff;
  --danger: #ff453a;
  --ok: #30d158;
  --warn: #ff9f0a;
  --scrim: rgba(0, 0, 0, 0.5);
  --menu: #2c2c2e;
  --menu-fg: #f5f5f7;
  --menu-line: rgba(245, 245, 247, 0.08);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* 对照皮：绿色气泡（只为对照，不是提案） */
:root[data-skin="green"] {
  --ground: #ededed;
  --surface: #ffffff;
  --side: #f7f7f7;
  --rail: #ececec;
  --raised: #ffffff;
  --input-bg: #ffffff;
  --select: #dedede;
  --select-fg: #191919;
  --select-fg-2: rgba(0, 0, 0, 0.5);
  --fg: #191919;
  --brand: #07c160;
  --primary: #07c160;
  --tab-active: #07c160;
  --bubble-them: #ffffff;
  --bubble-them-fg: #191919;
  --bubble-me: #95ec69;
  --bubble-me-fg: #191919;
  --bubble-radius: 4px;
  --badge: #fa5151;
  --menu: #4c4c4c;
  --menu-fg: #ffffff;
  --menu-line: rgba(255, 255, 255, 0.1);
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="green"]:not([data-theme="light"]) {
    --ground: #111111;
    --surface: #1f1f1f;
    --side: #191919;
    --rail: #1f1f1f;
    --raised: #2c2c2c;
    --input-bg: #2c2c2c;
    --select: #07c160;
    --select-fg: #ffffff;
    --select-fg-2: rgba(255, 255, 255, 0.78);
    --fg: #d5d5d5;
    --bubble-them: #2c2c2c;
    --bubble-them-fg: #d5d5d5;
    --bubble-me: #3eb575;
    --bubble-me-fg: #0d0d0d;
    --menu: #2c2c2c;
  }
}
:root[data-skin="green"][data-theme="dark"] {
  --ground: #111111;
  --surface: #1f1f1f;
  --side: #191919;
  --rail: #1f1f1f;
  --raised: #2c2c2c;
  --input-bg: #2c2c2c;
  --select: #07c160;
  --select-fg: #ffffff;
  --select-fg-2: rgba(255, 255, 255, 0.78);
  --fg: #d5d5d5;
  --bubble-them: #2c2c2c;
  --bubble-them-fg: #d5d5d5;
  --bubble-me: #3eb575;
  --bubble-me-fg: #0d0d0d;
  --menu: #2c2c2c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--fg);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  caret-color: var(--brand);
}
::selection { background: color-mix(in srgb, var(--brand) 26%, transparent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); border-radius: 6px; }
.ic { display: block; flex: none; }

/* 滚动条跟着调色板走，不留浏览器默认的那一格 */
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ── 头像 ────────────────────────────────────────────────────────────────
   智能体 = 像素脸（纸白盘底，两个主题同值）；人 = 首字母；群 = 九宫格拼图。
   形状照微信：圆角方块，不是圆。 */
.av {
  --s: 40px;
  position: relative;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: calc(var(--s) * 0.16);
  overflow: hidden;
  background: var(--face-disc);
  display: inline-grid;
  place-items: center;
}
.av canvas { width: 100%; height: 100%; display: block; }
.av.human {
  background: var(--raised);
  color: var(--fg-2);
  font-weight: 600;
  font-size: calc(var(--s) * 0.42);
  line-height: 1;
}
.av.me-av { background: var(--fg); color: var(--ground); }
.av.grp {
  background: var(--raised);
  padding: calc(var(--s) * 0.06);
  gap: calc(var(--s) * 0.035);
  display: grid;
  align-content: center;
  justify-content: center;
}
.av.grp .mini {
  border-radius: 2px;
  overflow: hidden;
  background: var(--face-disc);
  display: grid;
  place-items: center;
  font-weight: 600;
  color: var(--fg-2);
  line-height: 1;
}
.av.grp .mini.human { background: color-mix(in srgb, var(--fg) 12%, var(--raised)); }
.av.grp .mini canvas { width: 100%; height: 100%; display: block; }
.av .dot-unread {
  position: absolute;
  top: -1px;
  right: -1px;
}
.av-wrap { position: relative; flex: none; display: inline-grid; }
.badge {
  position: absolute;
  top: -6px;
  right: -7px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--badge);
  color: var(--badge-fg);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--side);
  z-index: 1;
}
.badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }

/* ── 消息 ──────────────────────────────────────────────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 14px; }
.tl-time {
  align-self: center;
  font-size: 11.5px;
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  padding: 2px 0;
}
.tl-sys {
  align-self: center;
  max-width: 78%;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  color: var(--fg-2);
  padding: 3px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--fg) 5%, transparent);
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0 4px;
}
.tl-sys .who { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--fg); }
.tl-sys .who .av { --s: 14px; border-radius: 3px; }
.tl-sys.link { cursor: pointer; }
.tl-sys.link:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.msg { display: flex; align-items: flex-start; gap: 10px; }
.msg.me { flex-direction: row-reverse; }
.msg .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: min(72%, 560px); }
.msg.me .body { align-items: flex-end; }
.msg .name { font-size: 11.5px; color: var(--fg-2); padding: 0 2px; }
.bubble {
  position: relative;
  padding: 8px 12px;
  border-radius: var(--bubble-radius);
  background: var(--bubble-them);
  color: var(--bubble-them-fg);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.msg.them .bubble { border-top-left-radius: 4px; }
.msg.me .bubble { background: var(--bubble-me); color: var(--bubble-me-fg); border-top-right-radius: 4px; }
/* 绿色那套：小三角尾巴，照原样 */
:root[data-skin="green"] .msg .bubble { border-radius: 4px; }
:root[data-skin="green"] .msg .bubble::before {
  content: "";
  position: absolute;
  top: 12px;
  width: 8px;
  height: 8px;
  background: inherit;
  transform: rotate(45deg);
  border-radius: 1px;
}
:root[data-skin="green"] .msg.them .bubble::before { left: -4px; }
:root[data-skin="green"] .msg.me .bubble::before { right: -4px; }
.bubble .mention { color: var(--brand); }
:root[data-skin="green"] .msg.me .bubble .mention { color: inherit; font-weight: 600; }
.bubble.voice-note .vmark { display: inline-flex; vertical-align: -2px; margin-right: 6px; opacity: 0.55; }
.bubble.typing { display: inline-flex; gap: 4px; align-items: center; height: 38px; padding: 0 14px; }
.bubble.typing i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.35;
  animation: dot 1.2s infinite var(--ease);
}
.bubble.typing i:nth-child(2) { animation-delay: 0.15s; }
.bubble.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30% { opacity: 0.8; transform: translateY(-3px); }
}
.bubble.call { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.bubble.call:hover { filter: brightness(0.97); }
.msg.fresh { animation: msg-in 220ms var(--ease) both; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.role-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 46px; }
.chip {
  font-size: 12.5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  transition: background-color 150ms var(--ease), transform 120ms var(--ease);
}
.chip:hover { background: var(--hover); }
.chip:active { transform: scale(0.97); }

/* ── 通用控件 ──────────────────────────────────────────────────────────── */
.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  transition: background-color 150ms var(--ease), transform 120ms var(--ease), opacity 150ms var(--ease);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 90%, #000); }
.btn.soft { background: var(--field); color: var(--fg); }
.btn.soft:hover:not(:disabled) { background: var(--press); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: inline-grid;
  place-items: center;
  color: var(--fg-2);
  transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn:active { transform: scale(0.94); }
.field {
  height: 34px;
  width: 100%;
  border-radius: 6px;
  border: 1px solid var(--input);
  background: transparent;
  padding: 0 12px;
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.field::placeholder, textarea::placeholder { color: var(--fg-3); }
.plan {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 16%, transparent);
}
.plan.free { color: var(--fg-2); background: color-mix(in srgb, var(--fg-2) 14%, transparent); }

/* 正在发生的那一句：光带扫过（DESIGN.md 的 Shimmer） */
.shimmer {
  background: linear-gradient(90deg, var(--fg-2) 0%, var(--fg-2) 40%, var(--fg) 50%, var(--fg-2) 60%, var(--fg-2) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .shimmer { animation: none; color: var(--fg-2); background: none; } }

/* 分组卡（设置式） */
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--fg-2); padding: 0 16px 6px; }
.inset { background: var(--surface); border-radius: 12px; overflow: hidden; }
.inset + .group-foot { font-size: 11.5px; color: var(--fg-2); padding: 6px 16px 0; line-height: 1.5; }
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 8px 14px;
  width: 100%;
  text-align: left;
  transition: background-color 120ms var(--ease);
}
button.row:hover, a.row:hover { background: var(--hover); }
button.row:active { background: var(--press); }
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: var(--inset, 14px);
  height: 1px;
  background: var(--line-2);
}
.row .lead { width: 28px; height: 28px; border-radius: 7px; background: var(--field); display: grid; place-items: center; color: var(--fg-2); flex: none; }
.row .t { flex: 1; min-width: 0; }
.row .t .sub { display: block; font-size: 12px; color: var(--fg-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { color: var(--fg-2); font-size: 13px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { color: var(--fg-3); }
.row.danger { color: var(--danger); justify-content: center; }

/* 额度表：填「剩余」、色档按「已用」，充足时中性灰（ADR-0209 / 0239） */
.meter { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--fg-3); }
.meter.warn > i { background: var(--warn); }

/* 弹层 */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--ease);
  z-index: 40;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(420px, calc(100vw - 32px));
  max-height: calc(100dvh - 32px);
  overflow: auto;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 22px;
  transform: translate(-50%, -50%) scale(0.96);
  opacity: 0;
  pointer-events: none;
  transition: transform 200ms var(--ease), opacity 160ms var(--ease);
  z-index: 50;
}
.dialog.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.dialog h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.dialog .desc { margin: 0 0 16px; color: var(--fg-2); font-size: 13px; line-height: 1.55; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.menu {
  position: fixed;
  min-width: 168px;
  padding: 5px;
  background: var(--menu);
  color: var(--menu-fg);
  border-radius: 10px;
  box-shadow: var(--shadow-float);
  transform: scale(0.96);
  opacity: 0;
  pointer-events: none;
  transition: transform 160ms var(--ease), opacity 120ms var(--ease);
  z-index: 60;
}
.menu.on { transform: scale(1); opacity: 1; pointer-events: auto; }
.menu button {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border-radius: 6px;
  text-align: left;
  white-space: nowrap;
}
.menu button:hover { background: color-mix(in srgb, var(--menu-fg) 8%, transparent); }
.menu hr { border: 0; height: 1px; background: var(--menu-line); margin: 4px 6px; }

/* 选脸那面墙 */
.face-wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.face-pick {
  border-radius: 10px;
  padding: 3px;
  border: 2px solid transparent;
  transition: border-color 150ms var(--ease), transform 120ms var(--ease);
}
.face-pick .av { width: 100%; height: auto; aspect-ratio: 1; --s: 56px; }
.face-pick[aria-pressed="true"] { border-color: var(--brand); }
.face-pick:active { transform: scale(0.95); }

/* 通话 */
.call-shell {
  --call-bg: #0e0e0f;
  --call-fg: #f5f5f7;
  --call-fg-2: rgba(245, 245, 247, 0.6);
  background: radial-gradient(120% 80% at 50% 30%, #1d1d20 0%, var(--call-bg) 70%);
  color: var(--call-fg);
}
.call-face {
  border-radius: 28%;
  overflow: hidden;
  background: var(--face-disc);
  box-shadow: 0 0 0 0 rgba(90, 200, 250, 0);
  transition: box-shadow 300ms var(--ease);
}
.call-face.talking { box-shadow: 0 0 0 6px rgba(90, 200, 250, 0.16), 0 0 0 14px rgba(90, 200, 250, 0.07); }
.call-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  transition: background-color 150ms var(--ease), transform 120ms var(--ease);
}
.call-btn:hover { background: rgba(255, 255, 255, 0.18); }
.call-btn:active { transform: scale(0.94); }
.call-btn.on { background: #f5f5f7; color: #0e0e0f; }
.call-btn.hang { background: #ff453a; }
.call-btn.hang:hover { background: #ff5a50; }
.call-label { font-size: 12px; color: var(--call-fg-2); text-align: center; margin-top: 8px; }
.call-sub { min-height: 3.2em; text-align: center; font-size: 15px; line-height: 1.6; color: var(--call-fg); text-wrap: balance; }
.call-sub .who { color: var(--call-fg-2); }

/* 表情面板 */
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.emoji-grid button { height: 34px; border-radius: 6px; font-size: 20px; line-height: 34px; }
.emoji-grid button:hover { background: var(--hover); }

/* demo 控制面板 */
.demo-panel {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--fg);
}
.demo-panel h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.06em; color: var(--fg-2); font-weight: 600; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--field); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--fg-2); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.demo-panel ul { margin: 0; padding-left: 16px; }
.demo-panel li { margin: 2px 0; color: var(--fg-2); }
.demo-panel li b { color: var(--fg); font-weight: 600; }
.tag-new {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0 5px;
  border-radius: 4px;
  line-height: 16px;
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 14%, transparent);
  vertical-align: 1px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  .msg.fresh { animation: none; }
  .dialog, .menu { transition: opacity 160ms linear; transform: translate(-50%, -50%); }
  .menu { transform: none; }
}


/* ── 舞台：宽屏上画一台手机 + 左边的说明；手机上直接全屏 ─────────────── */
body { background: var(--side); overflow: hidden; }
.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px; }
.side-panel {
  width: 300px;
  max-height: calc(100dvh - 32px);
  overflow: auto;
  background: var(--surface);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: none;
}
.side-panel .h b { font-size: 14px; }
.side-panel .ctl { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px 10px; color: var(--fg-2); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--field); transition: background-color 150ms var(--ease), transform 120ms var(--ease); }
.jump button:hover { background: var(--press); }
.jump button:active { transform: scale(0.96); }
.side-panel a { color: var(--brand); }
.device-wrap { flex: none; width: 390px; height: 844px; transform-origin: center; }
.device {
  width: 390px;
  height: 844px;
  border-radius: 56px;
  padding: 11px;
  background: #0b0b0c;
  box-shadow: 0 0 0 1.5px #2a2a2c, 0 30px 80px rgba(0, 0, 0, 0.28);
  position: relative;
}
.screen {
  --sb: 47px;
  --home: 34px;
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 45px;
  overflow: hidden;
  background: var(--ground);
  font-size: 16px;
  isolation: isolate;
}
.island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 90; pointer-events: none; }
.statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: var(--sb);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 30px 0 34px;
  font-size: 16px;
  font-weight: 600;
  z-index: 80;
  pointer-events: none;
  color: var(--fg);
}
.statusbar.light { color: #fff; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: var(--fg); opacity: 0.85; z-index: 85; pointer-events: none; }

@media (max-width: 759px) {
  .side-panel { display: none; }
  .demo-fab { display: grid !important; }
}
/* 真是手机：不画机身，app 占满 */
@media (max-width: 439px) {
  body { background: var(--ground); }
  .stage { padding: 0; }
  .side-panel { display: none; }
  .device-wrap, .device { width: 100%; height: 100%; }
  .device { border-radius: 0; padding: 0; box-shadow: none; background: none; }
  .screen { border-radius: 0; --sb: 0px; --home: 0px; }
  .island, .statusbar, .home-ind { display: none; }
  .demo-fab { display: grid !important; }
}

/* ── 页面栈 ──────────────────────────────────────────────────────────── */
.stack { position: absolute; inset: 0; }
.page {
  position: absolute;
  inset: 0;
  background: var(--ground);
  display: flex;
  flex-direction: column;
  will-change: transform;
  touch-action: pan-y;
}
.screen .scroll { scrollbar-width: none; }
.screen .scroll::-webkit-scrollbar { display: none; }
.page.dimmed::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.1); pointer-events: none; }
.page.anim { transition: transform 420ms var(--ease-ios); }
.nav {
  flex: none;
  padding-top: var(--sb);
  height: calc(var(--sb) + 44px);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-left: 8px;
  padding-right: 8px;
  background: var(--ground);
  position: relative;
  z-index: 2;
}
.nav .l { justify-self: start; display: flex; align-items: center; }
.nav .r { justify-self: end; display: flex; align-items: center; gap: 2px; }
.nav .c { text-align: center; min-width: 0; max-width: 220px; }
.nav .c .t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.nav .c .s { font-size: 11.5px; color: var(--fg-2); margin-top: -1px; white-space: nowrap; }
.nav.hair { box-shadow: 0 0.5px 0 var(--line); }
.nbtn {
  height: 40px;
  min-width: 40px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 10px;
  color: var(--fg);
  transition: opacity 120ms linear;
}
.nbtn:active { opacity: 0.45; }
.nbtn .cnt {
  font-size: 13px;
  font-weight: 600;
  background: var(--field);
  border-radius: 10px;
  padding: 1px 8px;
  margin-left: -2px;
  font-variant-numeric: tabular-nums;
}
.nbtn.text { font-size: 16px; color: var(--brand); font-weight: 500; }
.nbtn.text:disabled { color: var(--fg-3); }
.content { flex: 1; min-height: 0; position: relative; }
.content.pad-tab { padding-bottom: calc(49px + var(--home)); }

/* 搜索条 */
.msearch { padding: 2px 12px 10px; background: var(--ground); }
.msearch label { height: 36px; border-radius: 9px; background: var(--input-bg); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg-3); font-size: 16px; padding: 0 10px; }
.msearch label:focus-within { justify-content: flex-start; }
.msearch input { border: 0; background: transparent; font-size: 16px; color: var(--fg); width: 3.2em; padding: 0; transition: width 200ms var(--ease); }
.msearch label:focus-within input, .msearch input:not(:placeholder-shown) { width: 100%; }

/* 列表（照微信：整行铺满、分隔线从头像右边开始） */
.list { background: var(--surface); }
.mrow {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 72px;
  padding: 0 16px;
  text-align: left;
  background: var(--surface);
  transition: background-color 80ms linear;
}
.mrow:active { background: var(--press); }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; right: 0; left: var(--sep, 76px); height: 0.5px; background: var(--line); }
.mrow .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 0; }
.mrow .top { display: flex; align-items: baseline; gap: 8px; }
.mrow .nm { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mrow .pv { font-size: 14px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .pv b { font-weight: 500; color: var(--fg); }
.mrow .pv .at { color: var(--brand); }
:root[data-skin="green"] .mrow .pv .at { color: #fa5151; }
.mrow .av-wrap .badge { box-shadow: 0 0 0 2px var(--surface); }
.mrow.small { min-height: 56px; --sep: 68px; }
.mrow .tile { width: 40px; height: 40px; border-radius: 7px; background: var(--raised); color: var(--fg-2); display: grid; place-items: center; flex: none; }
.mrow .role { font-size: 13px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .chev { color: var(--fg-3); }
.mrow .val { color: var(--fg-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.mrow .icon-lead { color: var(--fg-2); width: 24px; display: grid; place-items: center; flex: none; }
.mrow.plain { min-height: 54px; --sep: 16px; }
.mrow.plain.iconed { --sep: 52px; }
.mrow.center { justify-content: center; color: var(--brand); font-size: 17px; font-weight: 500; }
.mrow.danger { justify-content: center; color: var(--danger); font-size: 17px; }
.sect { font-size: 13px; color: var(--fg-2); padding: 18px 16px 8px; }
.gap { height: 8px; }
.foot-note { font-size: 13px; color: var(--fg-2); padding: 8px 16px 0; line-height: 1.5; }
.mgate { margin: 8px 12px 12px; padding: 16px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.mgate .h { font-size: 16px; font-weight: 600; }
.mgate p { margin: 0; font-size: 14px; color: var(--fg-2); line-height: 1.55; }
.mgate .btn { align-self: flex-start; height: 36px; }

/* 底部三格 */
.tabbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(49px + var(--home));
  padding-bottom: var(--home);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--side) 86%, transparent);
  backdrop-filter: blur(20px) saturate(170%);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  box-shadow: 0 -0.5px 0 var(--line);
  z-index: 40;
  transition: transform 420ms var(--ease-ios);
}
.tabbar.hidden { transform: translateX(-30%); pointer-events: none; }
.tabbar.gone { transform: translateY(110%); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--fg-2); font-size: 10.5px; font-weight: 500; position: relative; }
.tabbar button[aria-current="page"] { color: var(--tab-active); }
.tabbar .ti { position: relative; }
.tabbar .badge { top: -3px; right: -10px; box-shadow: 0 0 0 2px var(--side); }

/* ── 聊天页 ──────────────────────────────────────────────────────────── */
.chat-tl { flex: 1; min-height: 0; padding: 14px 12px 16px; }
.chat-tl .timeline { gap: 16px; }
.chat-tl .bubble { font-size: 16px; line-height: 1.5; padding: 9px 12px; }
.chat-tl .msg .body { max-width: 76%; }
.chat-tl .msg .name { font-size: 12px; }
.chat-tl .role-chips { padding-left: 50px; }
.chat-tl .chip { font-size: 14px; padding: 6px 12px; }
.cbar {
  flex: none;
  background: var(--side);
  box-shadow: 0 -0.5px 0 var(--line);
  padding: 8px 8px calc(8px + var(--home));
  display: flex;
  align-items: flex-end;
  gap: 6px;
  position: relative;
  z-index: 3;
}
.cbar.open { padding-bottom: 8px; }
.cbar .cb { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); flex: none; transition: transform 120ms var(--ease), opacity 120ms linear; }
.cbar .cb:active { transform: scale(0.92); opacity: 0.6; }
.cbar .input {
  flex: 1;
  min-height: 38px;
  max-height: 110px;
  border-radius: 8px;
  background: var(--input-bg);
  border: 0;
  padding: 8px 10px;
  font-size: 16px;
  line-height: 22px;
  resize: none;
  color: var(--fg);
  overflow-y: auto;
}
.cbar .hold {
  flex: 1;
  height: 38px;
  border-radius: 8px;
  background: var(--input-bg);
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: background-color 100ms linear;
}
.cbar .hold.down { background: var(--press); }
.cbar .send-btn { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 600; margin-bottom: 2px; flex: none; transition: transform 120ms var(--ease); }
.cbar .send-btn:active { transform: scale(0.95); }
.panel {
  flex: none;
  height: 0;
  overflow: hidden;
  background: var(--side);
  transition: height 300ms var(--ease-ios);
}
.panel.on { height: calc(236px + var(--home)); }
.panel .inner { padding: 18px 20px calc(10px + var(--home)); }
.plus-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 12px; }
.plus-item { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-2); }
.plus-item .sq { width: 60px; height: 60px; border-radius: 14px; background: var(--surface); color: var(--fg); display: grid; place-items: center; transition: transform 120ms var(--ease); }
.plus-item:active .sq { transform: scale(0.94); }
.panel .emoji-grid button { height: 40px; font-size: 26px; line-height: 40px; }

/* 按住说话的浮层 */
.talk {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 168px;
  height: 168px;
  margin: -84px 0 0 -84px;
  border-radius: 20px;
  background: rgba(20, 20, 22, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 70;
  opacity: 0;
  transform: scale(0.94);
  pointer-events: none;
  transition: opacity 140ms var(--ease), transform 180ms var(--ease);
}
.talk.on { opacity: 1; transform: none; }
.talk .wave { display: flex; gap: 4px; align-items: center; height: 44px; }
.talk .wave i { width: 4px; border-radius: 2px; background: #5ac8fa; height: 10px; animation: wave 900ms ease-in-out infinite; }
.talk .wave i:nth-child(2) { animation-delay: 120ms; }
.talk .wave i:nth-child(3) { animation-delay: 240ms; }
.talk .wave i:nth-child(4) { animation-delay: 360ms; }
.talk .wave i:nth-child(5) { animation-delay: 480ms; }
.talk .wave i:nth-child(6) { animation-delay: 600ms; }
.talk .wave i:nth-child(7) { animation-delay: 720ms; }
@keyframes wave { 0%, 100% { height: 8px; } 50% { height: 38px; } }
.talk .tip { font-size: 13px; padding: 3px 8px; border-radius: 6px; }
.talk.cancel .tip { background: #ff453a; }
.talk.cancel .wave i { background: rgba(255, 255, 255, 0.4); animation-play-state: paused; }

/* 资料页 */
.card-head { background: var(--surface); padding: 22px 20px 24px; display: flex; gap: 16px; align-items: flex-start; }
.card-head .who { flex: 1; min-width: 0; padding-top: 2px; }
.card-head h2 { margin: 0; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.card-head .role { margin-top: 6px; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.card-head .sub { margin-top: 4px; font-size: 14px; color: var(--fg-2); }
.kind-tag { font-size: 11px; font-weight: 500; color: var(--fg-2); background: var(--field); border-radius: 5px; padding: 1px 6px; }
.mmembers { background: var(--surface); padding: 16px 14px 6px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 4px; }
.mmember { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.mmember .n { font-size: 12px; color: var(--fg-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mmember .add { width: 52px; height: 52px; border-radius: 9px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--fg-2); }
.mq { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
.mq.one { grid-template-columns: 1fr; }
.mq .cell { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.mq .k { font-size: 13px; color: var(--fg-2); }
.mq .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.mq .v small { font-size: 13px; color: var(--fg-2); font-weight: 400; margin-left: 4px; }
.mq .r { font-size: 12px; color: var(--fg-3); }
.me-head { background: var(--surface); padding: 22px 20px 26px; display: flex; align-items: center; gap: 16px; }
.me-head .n { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.me-head .e { font-size: 14px; color: var(--fg-2); margin-top: 4px; }
.usage-m { display: grid; grid-template-columns: 30px 52px 1fr 40px; align-items: center; gap: 10px; padding: 11px 16px; background: var(--surface); position: relative; }
.usage-m + .usage-m::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 0.5px; background: var(--line); }
.usage-m .p { font-size: 13px; color: var(--fg-2); text-align: right; font-variant-numeric: tabular-nums; }
.app-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.app-dot.off { background: var(--fg-3); }

/* 弹层都关在屏幕里面 */
.screen .scrim, .screen .dialog, .screen .menu { position: absolute; }
.screen .dialog { width: calc(100% - 48px); max-height: calc(100% - 140px); padding: 20px; border-radius: 14px; }
.screen .dialog h3 { font-size: 17px; text-align: center; }
.screen .dialog .desc { text-align: center; font-size: 14px; }
.screen .dialog .actions { justify-content: stretch; }
.screen .dialog .actions .btn { flex: 1; height: 42px; font-size: 16px; }
.screen .dialog .field { height: 42px; font-size: 16px; }
.screen .menu { min-width: 150px; }
.screen .menu button { height: 44px; font-size: 16px; gap: 12px; }
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-radius: 14px 14px 0 0;
  padding: 8px 0 calc(8px + var(--home));
  z-index: 55;
  transform: translateY(105%);
  transition: transform 380ms var(--ease-ios);
  max-height: 70%;
  display: flex;
  flex-direction: column;
}
.sheet.on { transform: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; flex: none; }
.sheet .sh-t { text-align: center; font-weight: 600; font-size: 16px; padding: 4px 0 10px; }
.sheet .scroll { flex: 1; min-height: 0; }
.sheet .mrow { min-height: 58px; }

/* 通话：整屏，从下往上 */
.mcall {
  position: absolute;
  inset: 0;
  z-index: 75;
  display: flex;

<script>/* 微信式布局 demo 共用的一层（#1386）：图标、像素脸、数据、聊天引擎、时间线。
   桌面和手机两份 demo 读同一份，免得同一句话两处说法不一样。

   数据全是编的（一家卖香薰蜡烛的小店），不是任何人的真实数字。 */

/* ── 图标：lucide，和 app 同一套 ─────────────────────────────────────── */
function ic(name, size = 20, sw = 1.75, cls = "") {
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;
}

/* ── 像素脸 ──────────────────────────────────────────────────────────────
   画料就是 src/shared/ottoFace（esbuild 内联进来的 OttoFace）。app 里脸画在圆盘上，
   这里照微信改成圆角方块：盘底色不变，脸按「64 格宽」缩进去，四角多露一点底。 */
const Face = (() => {
  const F = window.OttoFace;
  const CELLS = 63;
  const scratch = document.createElement("canvas");
  scratch.width = F.GRID_W;
  scratch.height = F.GRID_H;
  const sg = scratch.getContext("2d");
  const live = new Set();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");

  function draw(cv, t) {
    const g = cv.getContext("2d");
    if (!g) return;
    const px = cv.width;
    const slot = +cv.dataset.slot;
    const state = cv.dataset.state || "plain";
    const frame = F.composeFrame(slot, state, reduce.matches ? 0 : t);
    sg.clearRect(0, 0, F.GRID_W, F.GRID_H);
    for (const c of frame.cells) {
      const hex = frame.palette[c.key];
      if (!hex) continue;
      sg.fillStyle = hex;
      sg.fillRect(c.x, c.y, 1, 1);
    }
    g.clearRect(0, 0, px, px);
    g.fillStyle = F.DISC_COLOR;
    g.fillRect(0, 0, px, px);
    const cell = px / CELLS;
    g.imageSmoothingEnabled = cell < 1;
    g.imageSmoothingQuality = "high";
    if (frame.dim) g.globalAlpha = 0.45;
    g.drawImage(scratch, px / 2 - F.FACE_ORIGIN_X * cell, px / 2 - F.FACE_ORIGIN_Y * cell + 2 * cell, F.GRID_W * cell, F.GRID_H * cell);
    g.globalAlpha = 1;
  }

  function canvas(slot, state, size) {
    const cv = document.createElement("canvas");
    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
    cv.width = cv.height = Math.max(8, Math.round(size * dpr));
    cv.dataset.slot = slot;
    cv.dataset.state = state;
    draw(cv, 0);
    if (F.faceAnimates(state)) live.add(cv);
    return cv;
  }

  /* 把 [data-face] 占位换成画布。占位里写好尺寸（data-size），不量 DOM：
     藏着的节点量出来是 0。 */
  function hydrate(root = document) {
    root.querySelectorAll("[data-face]:not([data-hyd])").forEach((el) => {
      el.dataset.hyd = "1";
      const size = +(el.dataset.size || 40);
      el.appendChild(canvas(+el.dataset.face, el.dataset.state || "plain", size));
    });
  }

  function setState(el, state) {
    const cv = el && el.querySelector("canvas");
    if (!cv || cv.dataset.state === state) return;
    cv.dataset.state = state;
    el.dataset.state = state;
    if (F.faceAnimates(state)) live.add(cv);
    else live.delete(cv);
    draw(cv, performance.now());
  }

  let last = 0;
  (function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 33) return; // 30fps 够了：像素脸本来就是一格一格跳的
    last = now;
    for (const cv of live) {
      if (!cv.isConnected) { live.delete(cv); continue; }
      draw(cv, now);
    }
  })(0);

  return { hydrate, setState, canvas, animates: F.faceAnimates };
})();

/* ── 时间 ─────────────────────────────────────────────────────────────── */
const NOW = (() => {
  const d = new Date();
  d.setSeconds(0, 0);
  return d.getTime();
})();
const MIN = 60 * 1000;
const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function hhmm(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
/* 列表里那一格：今天报钟点，昨天写「昨天」，一周内写星期几，再早写月/日（照微信） */
function listTime(ts) {
  const today = dayStart(Date.now());
  const d = dayStart(ts);
  const days = Math.round((today - d) / 86400000);
  if (days <= 0) return hhmm(ts);
  if (days === 1) return "昨天";
  if (days < 7) return WEEK[new Date(ts).getDay()];
  const x = new Date(ts);
  return `${x.getMonth() + 1}/${x.getDate()}`;
}
/* 时间线里的分隔：同一天只写钟点，其余加上日子 */
function sepTime(ts) {
  const lt = listTime(ts);
  return lt.includes(":") ? lt : `${lt} ${hhmm(ts)}`;
}

/* 会话列表里的一行 = 一条聊天，或者一个团队（点进去是它的几条会话，照微信的「服务号」那种折叠行） */
function chatTitle(c) {
  if (c.kind === "dm") return AGENTS[c.agent].name;
  if (c.kind === "friend") return FRIENDS[c.friend].name;
  if (c.kind === "group") return c.name || c.agents.map((a) => AGENTS[a].name).join("、");
  if (c.kind === "team") return c.name;
  return "";
}
function chatHeadcount(c) {
  if (c.kind === "group") return c.agents.length + 1;
  if (c.kind === "team") { const t = TEAMS[c.team]; return t.humans.length + t.agents.length; }
  return 0;
}
function chatParticipants(c) {
  if (c.kind === "dm") return [c.agent];
  if (c.kind === "friend") return [c.friend];
  if (c.kind === "group") return c.agents;
  if (c.kind === "team") { const t = TEAMS[c.team]; return [...t.humans.filter((h) => h !== "me"), ...t.agents]; }
  return [];
}
function lastMsg(c) {
  for (let i = c.msgs.length - 1; i >= 0; i--) if (c.msgs[i].kind !== "relay") return c.msgs[i];
  return null;
}
function chatUpdated(c) { const m = c.msgs[c.msgs.length - 1]; return m ? m.t : 0; }

function previewOf(c) {
  if (c.draft) return { draft: true, text: c.draft };
  const m = lastMsg(c);
  if (!m) return { text: "" };
  if (m.kind === "call") return { text: "[语音通话]" };
  if (m.kind === "sys") return { text: m.text };
  if (m.kind === "roster") return { text: m.text };
  if (m.kind === "dispatch") return { text: `没 @ 谁，${AGENTS[m.meta.to].name}接了` };
  const multi = c.kind === "group" || c.kind === "team";
  const name = m.from === "me" ? "" : multi ? who(m.from).name + ": " : "";
  return { text: name + m.text.replace(/\n+/g, " ") };
}

/* 列表：聊天与团队混排，按最近一条排 */
function listRows() {
  const rows = [];
  for (const c of Object.values(CHATS)) {
    if (c.kind === "team") continue;
    rows.push({ type: "chat", id: c.id, ts: chatUpdated(c), chat: c });
  }
  for (const t of Object.values(TEAMS)) {
    const ss = t.sessions.map((s) => CHATS[s]);
    const newest = ss.slice().sort((a, b) => chatUpdated(b) - chatUpdated(a))[0];
    rows.push({ type: "team", id: t.id, ts: chatUpdated(newest), team: t, newest });
  }
  return rows.sort((a, b) => b.ts - a.ts);
}
function teamUnread(t) { return t.sessions.reduce((n, s) => n + CHATS[s].unread, 0); }
function teamMention(t) { return t.sessions.some((s) => CHATS[s].mention && CHATS[s].unread > 0); }
function totalUnread() {
  let n = 0;
  for (const c of Object.values(CHATS)) n += c.unread;
  return n;
}

/* ── 头像 HTML ────────────────────────────────────────────────────────── */
function avatar(id, size = 40, state = "plain") {
  if (id === "me") return `<span class="av human me-av" style="--s:${size}px">${ME.initial}</span>`;
  const a = AGENTS[id];
  if (a) return `<span class="av" style="--s:${size}px" data-face="${a.slot}" data-state="${state}" data-size="${size}" data-agent="${id}"></span>`;
  const f = FRIENDS[id] || { initial: id.slice(0, 1) };
  return `<span class="av human" style="--s:${size}px">${f.initial}</span>`;
}
/* 群头像：微信那种九宫格，不满一行的那一行放在最上面、居中 */
function groupAvatar(ids, size = 40) {
  const n = Math.min(ids.length, 9);
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  const pad = size * 0.06;
  const gap = Math.max(1, size * 0.035);
  const cell = (size - pad * 2 - gap * (cols - 1)) / cols;
  const rows = [];
  let rest = n;
  const first = n % cols || cols;
  rows.push(first);
  rest -= first;
  while (rest > 0) { rows.push(cols); rest -= cols; }
  let k = 0;
  const html = rows.map((cnt) => {
    const cells = [];
    for (let i = 0; i < cnt; i++, k++) {
      const id = ids[k];
      const a = AGENTS[id];
      if (a) cells.push(`<span class="mini" style="width:${cell}px;height:${cell}px" data-face="${a.slot}" data-size="${cell}"></span>`);
      else {
        const w = who(id);
        cells.push(`<span class="mini human" style="width:${cell}px;height:${cell}px;font-size:${cell * 0.5}px">${w.initial}</span>`);
      }
    }
    return `<span style="display:flex;justify-content:center;gap:${gap}px">${cells.join("")}</span>`;
  }).join("");
  return `<span class="av grp" style="--s:${size}px;gap:${gap}px;padding:${pad}px;display:flex;flex-direction:column;justify-content:center">${html}</span>`;
}
function chatAvatar(c, size = 40) {
  if (c.kind === "dm") return avatar(c.agent, size);
  if (c.kind === "friend") return avatar(c.friend, size);
  if (c.kind === "group") return groupAvatar(c.agents, size);
  if (c.kind === "team") return groupAvatar(chatParticipants(c), size);
  return "";
}
function teamAvatar(t, size = 40) { return groupAvatar([...t.humans.filter((h) => h !== "me"), ...t.agents], size); }

function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }
function richText(s) {
  return esc(s).replace(/@([一-龥A-Za-z0-9_]+)/g, '<span class="mention">@$1</span>');
}

/* ── 时间线 ───────────────────────────────────────────────────────────── */
function namesLine(ids) {
  return ids.map((id) => `<span class="who">${AGENTS[id] ? avatar(id, 14) : ""}${esc(who(id).name)}</span>`).join("<span>、</span>");
}
function timelineHTML(c, opts = {}) {
  const multi = c.kind === "group" || c.kind === "team";
  const av = opts.avatar || 36;
  let out = "";
  let prevT = 0;
  for (const m of c.msgs) {
    if (!prevT || m.t - prevT > 5 * MIN) out += `<div class="tl-time">${sepTime(m.t)}</div>`;
    prevT = m.t;
    const fresh = opts.fresh && opts.fresh.has(m.id) ? " fresh" : "";
    if (m.kind === "sys") { out += `<div class="tl-sys${fresh}">${esc(m.text)}</div>`; continue; }
    if (m.kind === "roster") { out += `<div class="tl-sys${fresh}"><span>${esc(m.text)}，拉进了</span>${namesLine(m.meta.added)}</div>`; continue; }
    if (m.kind === "rosterchg") { out += `<div class="tl-sys${fresh}"><span>${esc(m.text)}</span>${namesLine(m.meta.ids)}</div>`; continue; }
    if (m.kind === "relay") { out += `<div class="tl-sys${fresh}">${namesLine([m.meta.from])}<span>把话递给了</span>${namesLine([m.meta.to])}</div>`; continue; }
    if (m.kind === "dispatch") { out += `<div class="tl-sys${fresh}"><span>没 @ 谁，</span>${namesLine([m.meta.to])}<span>接了</span></div>`; continue; }
    if (m.kind === "call" && multi) {
      out += `<div class="tl-sys link${fresh}" data-call="${m.id}">${ic("phone", 13, 2)}<span>语音通话 ${esc(m.meta.dur)} · ${m.meta.lines.length} 句</span></div>`;
      continue;
    }
    const mine = m.from === "me";
    const w = who(m.from);
    const nameRow = multi && !mine ? `<div class="name">${esc(w.name)}</div>` : "";
    let bubble;
    if (m.kind === "call") bubble = `<div class="bubble call" data-call="${m.id}">${ic("phone", 15, 2)}<span>通话时长 ${esc(m.meta.dur)}</span></div>`;
    else if (m.meta && m.meta.voice) bubble = `<div class="bubble voice-note"><span class="vmark">${ic("mic", 14, 2)}</span>${richText(m.text)}</div>`;
    else bubble = `<div class="bubble">${richText(m.text)}</div>`;
    out += `<div class="msg ${mine ? "me" : "them"}${fresh}" data-from="${m.from}">${avatar(m.from, av)}<div class="body">${nameRow}${bubble}</div></div>`;
  }
  if (c.pending) {
    const p = c.pending;
    const nameRow = multi ? `<div class="name">${esc(who(p.agent).name)}</div>` : "";
    out += `<div class="msg them pending">${avatar(p.agent, av, p.phase === "typing" ? "composing" : "working")}<div class="body">${nameRow}<div class="bubble typing" aria-label="${esc(who(p.agent).name)}正在回复"><i></i><i></i><i></i></div></div></div>`;
  }
  if (c.onboarding) {
    out += `<div class="role-chips">${ROLE_CHIPS.map((r) => `<button class="chip" data-chip="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
  }
  return out;
}

const ROLE_CHIPS = ["回客人的私信", "写小红书笔记", "每天盯订单", "整理报销单", "做每周的周报", "查同行的价格"];

/* ── 聊天引擎 ─────────────────────────────────────────────────────────── */
const Sim = (() => {
  const subs = new Set();
  const fresh = new Set();
  let open = null; // 此刻开着的那条（开着的不记未读）
  const emit = (id) => subs.forEach((f) => f(id));
  const later = (ms) => new Promise((r) => setTimeout(r, ms));

  function push(c, from, text, kind = "text", meta) {
    const m = { id: "m" + Math.random().toString(36).slice(2, 10), t: Date.now(), from, text, kind, meta };
    c.msgs.push(m);
    fresh.add(m.id);
    if (from !== "me" && c.id !== open && kind !== "relay") c.unread++;
    emit(c.id);
    return m;
  }

  /* 一条回复按空行拆成几张气泡（ADR-0266），一张一张落 */
  async function reply(c, agentId, parts, voice) {
    c.pending = { agent: agentId, phase: "working" };
    emit(c.id);
    await later(900 + Math.random() * 700);
    c.pending = { agent: agentId, phase: "typing" };
    emit(c.id);
    await later(700 + Math.random() * 400);
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) c.pending = null;
      push(c, agentId, parts[i]);
      if (i < parts.length - 1) await later(650);
    }
    c.pending = null;
    emit(c.id);
  }

  function mentioned(c, text) {
    const ids = c.kind === "group" ? c.agents : c.kind === "team" ? TEAMS[c.team].agents : [];
    return ids.filter((id) => text.includes("@" + AGENTS[id].name));
  }

  function pickByRole(ids, text) {
    const hit = ids.find((id) => (KEYWORDS[id] || []).some((k) => text.includes(k)));
    return hit || ids[0];
  }

  async function send(c, text, meta) {
    text = text.trim();
    if (!text) return;
    c.draft = "";
    push(c, "me", text, "text", meta);
    if (c.onboarding) {
      const a = AGENTS[c.agent];
      a.role = text.split("\n")[0].slice(0, 40);
      c.onboarding = false;
      await reply(c, c.agent, [`好，记下了：「${a.role}」。`, "以后这类活直接丢给我。想改职责的话，点右上角随时能改。"]);
      return;
    }
    if (c.kind === "dm") return reply(c, c.agent, replyFor(c.agent, text));
    if (c.kind === "friend") {
      await later(2600);
      push(c, c.friend, FRIEND_REPLIES[c.friend] || "好");
      return;
    }
    const ids = c.kind === "group" ? c.agents : TEAMS[c.team].agents;
    let targets = mentioned(c, text);
    if (targets.length === 0) {
      const t = pickByRole(ids, text);
      push(c, "sys", "", "dispatch", { to: t });
      targets = [t];
    }
    for (const t of targets) await reply(c, t, replyFor(t, text));
  }

  return {
    on: (f) => (subs.add(f), () => subs.delete(f)),
    send,
    push,
    setOpen(id) {
      open = id;
      if (id && CHATS[id]) { CHATS[id].unread = 0; CHATS[id].mention = false; }
      emit(id);
    },
    get open() { return open; },
    fresh,
    emit,
  };
})();

  ["团队折成一行", "点进去是它的几条会话，照微信「服务号」那种折叠行"],
  ["手机端的团队与朋友", "今天手机上一个都没有"],
  ["按住说话", "手机端：说完转成文字发出去（通话那套识别已经在，缺一个按住的模式）"],
  ["表情", "只是往输入框里插 emoji，不是贴图"],
  ["额度只按周算", "去掉「5 小时」那扇窗（维护者 2026-09-27）；这次只改设计，真规矩不动，落地时网关、价目表、接力刹车都要跟着改"],
];

const REMOVED_THINGS = [
  "侧栏的「任务」「项目」两栏，以及本机会话的一切",
  "右侧面板：文件 / 终端 / 浏览器 / iOS 模拟器 / 后台任务 / Git Graph",
  "⌘K 会话搜索、SideChat（/btw）、残留清单、发布到团队",
  "设置里 9 个本机分页：工作区 / 模型配置 / Skill 库 / 子智能体 / 连接器(mcp.json) / 权限 / 记忆(本机) / 上下文 / 手机配对",
];
</script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const screen = $("#screen"), stackEl = $("#stack"), scrim = $("#scrim"), dialog = $("#dialog"), menu = $("#menu"), sheet = $("#sheet"), mcall = $("#mcall"), talk = $("#talk");

  const M = { tab: "chats", sub: "pro", q: "", call: null };
  const stack = []; // [{key, el, onSim?}]

  /* ── 缩放：宽屏上手机按窗口高度缩 ─────────────────────────────────── */
  function fit() {
    const wrap = $("#wrap");
    if (innerWidth < 440) { wrap.style.transform = ""; wrap.style.margin = ""; return; }
    const side = innerWidth >= 760 ? 380 : 32; // 窄了就不放说明栏，说明挪进右下角那颗钮
    const s = Math.min(1, (innerHeight - 32) / 844, (innerWidth - side) / 390);
    wrap.style.transform = `scale(${Math.max(0.55, s)})`;
    wrap.style.margin = `${(844 * (s - 1)) / 2}px ${(390 * (s - 1)) / 2}px`;
  }
  addEventListener("resize", fit);
  fit();
  const scaleOf = () => screen.getBoundingClientRect().width / screen.offsetWidth || 1;

  /* ── 页面栈与转场 ─────────────────────────────────────────────────── */
  function mount(page) {
    const el = document.createElement("section");
    el.className = "page";
    el.dataset.key = page.key;
    page.el = el;
    stackEl.appendChild(el);
    page.render();
    Face.hydrate(el);
    return page;
  }
  /* 栈底那一页每次重画都会把三格冲掉，画完补回来 */
  function afterRootRender(page) { if (stack[0] === page || stack.length === 0) renderTabbar(); }
  function setRoot(page) {
    while (stack.length) stack.pop().el.remove();
    stack.push(mount(page));
    syncTabbar(false);
  }
  function push(page) {
    const prev = stack[stack.length - 1];
    mount(page);
    stack.push(page);
    const el = page.el;
    el.style.transform = "translateX(100%)";
    el.getBoundingClientRect();
    el.classList.add("anim");
    prev.el.classList.add("anim");
    requestAnimationFrame(() => {
      el.style.transform = "translateX(0)";
      prev.el.style.transform = "translateX(-30%)";
      prev.el.classList.add("dimmed");
    });
    syncTabbar(true);
    return page;
  }
  function pop(instant) {
    if (stack.length < 2) return;
    const top = stack.pop();
    const prev = stack[stack.length - 1];
    top.leave && top.leave();
    [top.el, prev.el].forEach((e) => e.classList.toggle("anim", !instant));
    top.el.style.transform = "translateX(100%)";
    prev.el.style.transform = "translateX(0)";
    prev.el.classList.remove("dimmed");
    prev.onBack && prev.onBack();
    setTimeout(() => top.el.remove(), instant ? 0 : 430);
    syncTabbar(true);
  }
  function popToRoot() { while (stack.length > 1) { const p = stack.pop(); p.leave && p.leave(); p.el.remove(); } stack[0].el.style.transform = ""; stack[0].el.classList.remove("dimmed"); stack[0].onBack && stack[0].onBack(); syncTabbar(false); }
  function syncTabbar() { renderTabbar(); }

  /* 左缘右划返回：跟手，松手看位移和速度 */
  (() => {
    let drag = null;
    stackEl.addEventListener("pointerdown", (e) => {
      if (stack.length < 2) return;
      const r = screen.getBoundingClientRect();
      const x = (e.clientX - r.left) / scaleOf();
      if (x > 24) return;
      const top = stack[stack.length - 1], prev = stack[stack.length - 2];
      drag = { id: e.pointerId, x0: e.clientX, top, prev, w: screen.offsetWidth, hist: [[e.clientX, performance.now()]], moved: false };
    });
    stackEl.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = Math.max(0, (e.clientX - drag.x0) / scaleOf());
      if (!drag.moved) {
        if (dx < 8) return; // 先过迟滞再拿指针，否则点返回会被吞（#1137 同一个坑）
        drag.moved = true;
        stackEl.setPointerCapture(e.pointerId);
        drag.top.el.classList.remove("anim");
        drag.prev.el.classList.remove("anim");
      }
      drag.hist.push([e.clientX, performance.now()]);
      if (drag.hist.length > 5) drag.hist.shift();
      drag.top.el.style.transform = `translateX(${dx}px)`;
      drag.prev.el.style.transform = `translateX(${-30 + (30 * dx) / drag.w}%)`;
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      if (!d.moved) return;
      const dx = Math.max(0, (e.clientX - d.x0) / scaleOf());
      const [a, b] = [d.hist[0], d.hist[d.hist.length - 1]];
      const v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]) / scaleOf();
      if (dx > d.w * 0.4 || v > 0.45) pop();
      else {
        d.top.el.classList.add("anim");
        d.prev.el.classList.add("anim");
        d.top.el.style.transform = "translateX(0)";
        d.prev.el.style.transform = "translateX(-30%)";
      }
    };
    stackEl.addEventListener("pointerup", end);
    stackEl.addEventListener("pointercancel", end);
  })();

  /* ── 底部三格 ─────────────────────────────────────────────────────── */
  /* 底部三格长在栈底那一页里：推进来的页盖住它，返回时它跟着那一页一起滑回来（照 iOS） */
  function renderTabbar() {
    const root = stack[0];
    if (!root) return;
    let tabbar = root.el.querySelector(".tabbar");
    if (!tabbar) { tabbar = document.createElement("nav"); tabbar.className = "tabbar"; tabbar.setAttribute("aria-label", "主导航"); root.el.appendChild(tabbar); }
    const unread = visibleUnread();
    const t = (key, icon, label, badge) => `<button data-tab="${key}" aria-current="${M.tab === key ? "page" : "false"}"><span class="ti">${ic(icon, 25, M.tab === key ? 2 : 1.6)}${badge || ""}</span><span>${label}</span></button>`;
    tabbar.innerHTML = t("chats", "message-circle", "聊天", unread ? `<span class="badge">${unread > 99 ? "99+" : unread}</span>` : "") + t("contacts", "contact-round", "通讯录", FRIEND_REQUESTS.length ? `<span class="badge">${FRIEND_REQUESTS.length}</span>` : "") + t("me", "user-round", "我");
    $$("[data-tab]", tabbar).forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  }
  function switchTab(tab) {
    if (M.tab === tab && stack.length === 1) { const sc = stack[0].el.querySelector(".scroll"); if (sc) sc.scrollTo({ top: 0, behavior: "smooth" }); return; }
    M.tab = tab;
    M.q = "";
    setRoot(tab === "chats" ? chatsRoot() : tab === "contacts" ? contactsRoot() : meRoot());
  }
  function visibleChat(c) { return !(M.sub === "free" && (c.kind === "dm" || c.kind === "group")); }
  function visibleUnread() { return Object.values(CHATS).filter(visibleChat).reduce((n, c) => n + c.unread, 0); }

  const navHTML = ({ left = "", title = "", sub = "", right = "", hair = false }) => `<header class="nav${hair ? " hair" : ""}"><div class="l">${left}</div><div class="c"><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div><div class="r">${right}</div></header>`;
  const backBtn = (count) => `<button class="nbtn" data-back title="返回">${ic("chevron-left", 26, 2)}${count ? `<span class="cnt">${count}</span>` : ""}</button>`;
  function bindBack(el) { $$("[data-back]", el).forEach((b) => b.addEventListener("click", () => pop())); }
  function badgeHTML(n) { return n ? `<span class="badge">${n > 99 ? "99+" : n}</span>` : ""; }

  /* ── 聊天 tab ─────────────────────────────────────────────────────── */
  function chatsRoot() {
    const page = {
      key: "chats",
      render() {
        const n = visibleUnread();
        const scrollTop = page.el.querySelector(".scroll") ? page.el.querySelector(".scroll").scrollTop : 0;
        let rows = "";
        if (M.sub === "free") rows += `<div class="mgate"><div class="h">订阅 Pro，就能有自己的智能体</div><p>它们有名字、有职责，能私聊、拉群、打电话。团队里别人的智能体照样能用，走团队主人的额度。</p><button class="btn primary" data-act="subscribe">看看订阅</button></div>`;
        let list = "";
        for (const r of listRows()) {
          if (r.type === "chat") {
            const c = r.chat;
            if (!visibleChat(c)) continue;
            if (M.q && !(chatTitle(c) + previewOf(c).text).includes(M.q)) continue;
            const pv = previewOf(c);
            list += `<button class="mrow" data-chat="${c.id}"><span class="av-wrap">${chatAvatar(c, 48)}${badgeHTML(c.unread)}</span><span class="meta"><span class="top"><span class="nm">${esc(chatTitle(c))}</span><span class="tm">${listTime(chatUpdated(c))}</span></span><span class="pv">${pv.draft ? `<b>[草稿]</b> ` : ""}${esc(pv.text)}</span></span></button>`;
          } else {
            const t = r.team;
            if (M.q && !t.name.includes(M.q)) continue;
            const pv = previewOf(r.newest);
            list += `<button class="mrow" data-team="${t.id}"><span class="av-wrap">${teamAvatar(t, 48)}${badgeHTML(teamUnread(t))}</span><span class="meta"><span class="top"><span class="nm">${esc(t.name)}</span><span class="tm">${listTime(r.ts)}</span></span><span class="pv">${teamMention(t) ? `<span class="at">[有人@我]</span> ` : ""}${esc(r.newest.name)} · ${esc(pv.text)}</span></span></button>`;
          }
        }
        page.el.innerHTML = navHTML({ title: `聊天${n ? `(${n})` : ""}`, right: `<button class="nbtn" id="plus" title="新建">${ic("circle-plus", 25, 1.6)}</button>` }) + `<div class="content scroll pad-tab"><div class="msearch"><label>${ic("search", 17)}<input id="q" placeholder="搜索" value="${esc(M.q)}" autocomplete="off"></label></div>${rows}<div class="list">${list}</div></div>`;
        page.el.querySelector(".scroll").scrollTop = scrollTop;
        Face.hydrate(page.el);
        $$("[data-chat]", page.el).forEach((b) => b.addEventListener("click", () => openChat(b.dataset.chat)));
        $$("[data-team]", page.el).forEach((b) => b.addEventListener("click", () => push(teamPage(b.dataset.team))));
        $("#plus", page.el).addEventListener("click", (e) => plusMenu(e.currentTarget));
        const q = $("#q", page.el);
        q.addEventListener("input", () => { M.q = q.value; const p = q.selectionStart; page.render(); const nq = $("#q", page.el); nq.focus(); nq.setSelectionRange(p, p); });
        $$('[data-act="subscribe"]', page.el).forEach((b) => b.addEventListener("click", subscribeDialog));
        afterRootRender(page);
      },
      onSim() { if (document.activeElement && document.activeElement.id === "q") return; page.render(); },
      onBack() { page.render(); },
    };
    return page;
  }

  function teamPage(tid) {
    const t = TEAMS[tid];
    const page = {
      key: "team",
      render() {
        const rows = t.sessions.map((s) => CHATS[s]).sort((a, b) => chatUpdated(b) - chatUpdated(a));
        page.el.innerHTML = navHTML({ left: backBtn(), title: esc(t.name), sub: `${t.humans.length} 人 · ${t.agents.length} 只智能体`, right: `<button class="nbtn" data-act="new" title="新会话">${ic("square-pen", 22, 1.7)}</button>` }) + `<div class="content scroll"><div class="list">${rows.map((c) => `<button class="mrow" data-chat="${c.id}"><span class="av-wrap">${teamAvatar(t, 48)}${badgeHTML(c.unread)}</span><span class="meta"><span class="top"><span class="nm">${esc(c.name)}</span><span class="tm">${listTime(chatUpdated(c))}</span></span><span class="pv">${c.mention && c.unread ? `<span class="at">[有人@我]</span> ` : ""}${esc(previewOf(c).text)}</span></span></button>`).join("")}</div><div class="foot-note">团队的智能体走主人（${esc(who(t.owner).name)}）的额度。</div></div>`;
        Face.hydrate(page.el);
        bindBack(page.el);
        $$("[data-chat]", page.el).forEach((b) => b.addEventListener("click", () => openChat(b.dataset.chat)));
        $('[data-act="new"]', page.el).addEventListener("click", () => {
          const id = "s_" + Math.random().toString(36).slice(2, 7);
          CHATS[id] = { id, kind: "team", team: t.id, name: "新会话", unread: 0, msgs: [] };
          t.sessions.push(id);
          openChat(id);
          Sim.push(CHATS[id], "sys", "你开了一条新会话");
        });
      },
      onSim() { page.render(); },
      onBack() { page.render(); },
    };
    return page;
  }

  /* ── 聊天页 ─────────────────────────────────────────────────────────── */
  function openChat(id) {
    Sim.setOpen(id);
    push(chatPage(id));
  }
  function chatPage(id) {
    const c = CHATS[id];
    const multi = c.kind === "group" || c.kind === "team";
    let mode = "text"; // text | voice
    let panel = null; // null | plus | emoji
    const page = {
      key: "chat",
      render() {
        page.el.innerHTML = `<div id="nav"></div><div class="chat-tl scroll" id="tl"></div>
          <div class="cbar" id="cbar"></div>
          <div class="panel" id="panel"><div class="inner" id="panel-inner"></div></div>`;
        page.head();
        page.bar();
        page.tl(true);
      },
      head() {
        const others = visibleUnread() - 0;
        let sub = "";
        if (c.pending) sub = `<span class="shimmer">${c.pending.phase === "typing" ? "正在输入…" : "正在干活…"}</span>`;
        else if (c.kind === "team") sub = esc(TEAMS[c.team].name);
        const cnt = chatHeadcount(c);
        $("#nav", page.el).innerHTML = navHTML({ left: backBtn(others || ""), title: `${esc(chatTitle(c))}${cnt ? `(${cnt})` : ""}`, sub, right: `<button class="nbtn" data-act="info" title="聊天信息">${ic("ellipsis", 24, 2)}</button>`, hair: true });
        bindBack(page.el);
        $('[data-act="info"]', page.el).addEventListener("click", () => push(infoPage(c)));
      },
      tl(toBottom) {
        const tl = $("#tl", page.el);
        const near = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 140;
        tl.innerHTML = `<div class="timeline">${timelineHTML(c, { fresh: Sim.fresh, avatar: 40 })}</div>`;
        Face.hydrate(tl);
        $$("[data-call]", tl).forEach((b) => b.addEventListener("click", () => transcriptDialog(c, b.dataset.call)));
        $$("[data-chip]", tl).forEach((b) => b.addEventListener("click", () => { mode = "text"; page.bar(); const ta = $("#ta", page.el); ta.value = b.dataset.chip; autosize(ta); page.bar(true); ta.focus(); }));
        $$(".msg.them .av[data-agent]", tl).forEach((av) => av.addEventListener("click", () => push(agentPage(av.dataset.agent))));
        if (toBottom || near) tl.scrollTop = tl.scrollHeight;
      },
      bar(keep) {
        const cbar = $("#cbar", page.el);
        const prev = $("#ta", page.el);
        const text = prev ? prev.value : c.draft || "";
        const hasText = !!text.trim();
        const left = `<button class="cb" data-act="mode" title="${mode === "text" ? "按住说话" : "打字"}">${ic(mode === "text" ? "audio-lines" : "keyboard", 24, 1.7)}</button>`;
        const mid = mode === "text" ? `<textarea class="input" id="ta" rows="1" placeholder="${multi ? "说点什么，输入 @ 点名" : ""}" enterkeyhint="send">${esc(text)}</textarea>` : `<button class="hold" id="hold">按住 说话</button>`;
        const right = `<button class="cb" data-act="emoji" title="表情">${ic("smile", 24, 1.7)}</button>` + (hasText && mode === "text" ? `<button class="send-btn" data-act="send">发送</button>` : `<button class="cb" data-act="plus" title="更多">${ic("circle-plus", 25, 1.6)}</button>`);
        cbar.innerHTML = left + mid + right;
        cbar.classList.toggle("open", !!panel);
        const ta = $("#ta", page.el);
        if (ta) {
          autosize(ta);
          ta.addEventListener("input", () => {
            c.draft = ta.value;
            autosize(ta);
            const has = !!ta.value.trim();
            if (has !== !!cbar.querySelector('[data-act="send"]')) { const pos = ta.selectionStart; page.bar(); const t2 = $("#ta", page.el); t2.focus(); t2.setSelectionRange(pos, pos); }
            const before = ta.value.slice(0, ta.selectionStart);
            if (multi && /(^|\s)@$/.test(before)) mentionSheet(c, (name) => { ta.value = before + name + " " + ta.value.slice(ta.selectionStart); c.draft = ta.value; page.bar(); $("#ta", page.el).focus(); });
          });
          ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); } });
          ta.addEventListener("focus", () => { if (panel) { panel = null; page.panel(); } });
          if (keep) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }
        $$('[data-act]', cbar).forEach((b) => b.addEventListener("click", () => {
          const a = b.dataset.act;
          if (a === "mode") { mode = mode === "text" ? "voice" : "text"; panel = null; page.panel(); page.bar(mode === "text"); }
          if (a === "send") send();
          if (a === "plus" || a === "emoji") { panel = panel === a ? null : a; page.panel(); cbar.classList.toggle("open", !!panel); if (panel && document.activeElement) document.activeElement.blur(); }
        }));
        const hold = $("#hold", page.el);
        if (hold) bindHold(hold, c);
      },
      panel() {
        const p = $("#panel", page.el), inner = $("#panel-inner", page.el);
        if (panel === "plus") {
          const items = [];
          if (M.sub !== "free" || c.kind === "team") if (c.kind !== "friend") items.push(["call", "phone", "语音通话"]);
          if (c.kind === "dm") items.push(["group", "users-round", "拉人建群"]);
          if (c.kind === "group") items.push(["add", "user-round-plus", "加一只"]);
          if (multi) items.push(["at", "at-sign", "@ 谁"]);
          if (c.kind === "friend") items.push(["team", "briefcase", "拉进团队"]);
          inner.innerHTML = `<div class="plus-grid">${items.map(([k, i, l]) => `<button class="plus-item" data-pl="${k}"><span class="sq">${ic(i, 26, 1.6)}</span>${l}</button>`).join("")}</div>`;
          $$("[data-pl]", inner).forEach((b) => b.addEventListener("click", () => {
            const k = b.dataset.pl;
            panel = null; page.panel(); $("#cbar", page.el).classList.remove("open");
            if (k === "call") startCall(c);
            if (k === "group") newGroupDialog([c.agent]);
            if (k === "add") pickAgents("加进群里", MY_AGENTS.filter((x) => !c.agents.includes(x)), 6 - c.agents.length, (ids) => { c.agents.push(...ids); Sim.push(c, "sys", "你把这几只拉进了群聊：", "rosterchg", { ids }); });
            if (k === "at") mentionSheet(c, (name) => { mode = "text"; const ta0 = $("#ta", page.el); const v = (ta0 ? ta0.value : "") + "@" + name + " "; c.draft = v; page.bar(); const ta = $("#ta", page.el); ta.value = v; ta.focus(); page.bar(true); });
            if (k === "team") newTeamDialog([c.friend]);
          }));
        } else if (panel === "emoji") {
          inner.innerHTML = `<div class="emoji-grid">${EMOJI.map((e) => `<button data-emoji="${e}">${e}</button>`).join("")}</div>`;
          $$("[data-emoji]", inner).forEach((b) => b.addEventListener("click", () => { mode = "text"; const ta0 = $("#ta", page.el); c.draft = (ta0 ? ta0.value : c.draft || "") + b.dataset.emoji; page.bar(); $("#ta", page.el).value = c.draft; page.bar(); }));
        }
        p.classList.toggle("on", !!panel);
        const tl = $("#tl", page.el);
        setTimeout(() => (tl.scrollTop = tl.scrollHeight), 320);
      },
      onSim(cid) { if (cid && cid !== c.id) { page.head(); return; } page.head(); page.tl(false); },
      leave() { const ta = $("#ta", page.el); if (ta) c.draft = ta.value; Sim.setOpen(null); },
      onBack() { Sim.setOpen(c.id); page.head(); page.tl(false); },
    };
    function send() {
      const ta = $("#ta", page.el);
      if (!ta || !ta.value.trim()) return;
      const v = ta.value;
      ta.value = "";
      c.draft = "";
      page.bar(true);
      Sim.send(c, v);
    }
    return page;
  }
  function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.min(110, ta.scrollHeight) + "px"; }

  /* 按住说话：说完转成文字发出去（demo 里是写好的一句） */
  const SPOKEN = {
    c_wenan: "短的那版再改改，别用感叹号",
    c_shangxin: "周三晚上八点开卖，大家按这个准备",
  };
  function bindHold(hold, c) {
    let y0 = 0, cancel = false, down = false;
    const tip = $("#talk-tip");
    hold.addEventListener("pointerdown", (e) => {
      down = true; cancel = false; y0 = e.clientY;
      hold.setPointerCapture(e.pointerId);
      hold.classList.add("down");
      hold.textContent = "松开 发送";
      talk.classList.add("on");
      talk.classList.remove("cancel");
      tip.textContent = "松开 发送 · 上划 取消";
    });
    hold.addEventListener("pointermove", (e) => {
      if (!down) return;
      const up = (y0 - e.clientY) / scaleOf();
      const c2 = up > 60;
      if (c2 !== cancel) {
        cancel = c2;
        talk.classList.toggle("cancel", cancel);
        tip.textContent = cancel ? "松开手指，取消发送" : "松开 发送 · 上划 取消";
        hold.textContent = cancel ? "松开 取消" : "松开 发送";
      }
    });
    const up = () => {
      if (!down) return;
      down = false;
      hold.classList.remove("down");
      hold.textContent = "按住 说话";
      talk.classList.remove("on");
      if (!cancel) Sim.send(c, SPOKEN[c.id] || "帮我看一下今天有什么要处理的", { voice: true });
    };
    hold.addEventListener("pointerup", up);
    hold.addEventListener("pointercancel", () => { cancel = true; up(); });
  }
