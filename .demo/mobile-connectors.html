<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手机上接应用</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   微信式布局 demo 共用的一层（#1386）。
   令牌照 DESIGN.md：浅色暖纸 / 深色 Apple 四色底盘；「绿色气泡」那一套只是
   给维护者对照看的皮，不是提案的默认值。
   ───────────────────────────────────────────────────────────────────────── */

:root {
  /* 地面 / 浮起的表面 / 侧栏（竖条 + 会话列表） */
  --ground: #efece3;
  --surface: #f7f5ef;
  --side: #e9e5d8;
  --rail: #e9e5d8;
  --raised: #e5e1d3;
  --hover: rgba(0, 0, 0, 0.045);
  --press: rgba(0, 0, 0, 0.08);
  --select: #dce6f2;
  --select-fg: #000000;
  --select-fg-2: rgba(0, 0, 0, 0.55);
  --fg: #000000;
  --fg-2: rgba(0, 0, 0, 0.55);
  --fg-3: rgba(0, 0, 0, 0.4);
  --line: rgba(0, 0, 0, 0.12);
  --line-2: rgba(0, 0, 0, 0.07);
  --input: rgba(0, 0, 0, 0.12);
  --field: rgba(0, 0, 0, 0.055);
  --input-bg: #f7f5ef;
  --brand: #4a70a9;
  --primary: #4a70a9;
  --on-primary: #ffffff;
  --tab-active: #4a70a9;
  --bubble-them: #e5e1d3;
  --bubble-them-fg: #000000;
  --bubble-me: color-mix(in srgb, #4a70a9 18%, #f7f5ef);
  --bubble-me-fg: #000000;
  --bubble-radius: 12px;
  --badge: #4a70a9;
  --badge-fg: #ffffff;
  --danger: #c92a2a;
  --ok: #2b8a3e;
  --warn: #e67700;
  --face-disc: #f2f2f3;
  --voice: #2f94a6;
  --scrim: rgba(0, 0, 0, 0.28);
  --menu: #f7f5ef;
  --menu-fg: #000000;
  --menu-line: rgba(0, 0, 0, 0.08);
  --shadow-float: 0 12px 32px rgba(40, 32, 12, 0.16), 0 2px 6px rgba(40, 32, 12, 0.08);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000;
    --surface: #1d1d1f;
    --side: #1d1d1f;
    --rail: #1d1d1f;
    --raised: #2c2c2e;
    --hover: rgba(245, 245, 247, 0.05);
    --press: rgba(245, 245, 247, 0.09);
    --select: #2c2c2e;
    --select-fg: #f5f5f7;
    --select-fg-2: rgba(245, 245, 247, 0.56);
    --fg: #f5f5f7;
    --fg-2: rgba(245, 245, 247, 0.56);
    --fg-3: rgba(245, 245, 247, 0.38);
    --line: rgba(245, 245, 247, 0.12);
    --line-2: rgba(245, 245, 247, 0.07);
    --input: rgba(245, 245, 247, 0.14);
    --field: rgba(245, 245, 247, 0.08);
    --input-bg: #2c2c2e;
    --brand: #0a84ff;
    --primary: #0071e3;
    --tab-active: #0a84ff;
    --bubble-them: #2c2c2e;
    --bubble-them-fg: #f5f5f7;
    --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
    --bubble-me-fg: #f5f5f7;
    --badge: #0a84ff;
    --danger: #ff453a;
    --ok: #30d158;
    --warn: #ff9f0a;
    --scrim: rgba(0, 0, 0, 0.5);
    --menu: #2c2c2e;
    --menu-fg: #f5f5f7;
    --menu-line: rgba(245, 245, 247, 0.08);
    --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000;
  --surface: #1d1d1f;
  --side: #1d1d1f;
  --rail: #1d1d1f;
  --raised: #2c2c2e;
  --hover: rgba(245, 245, 247, 0.05);
  --press: rgba(245, 245, 247, 0.09);
  --select: #2c2c2e;
  --select-fg: #f5f5f7;
  --select-fg-2: rgba(245, 245, 247, 0.56);
  --fg: #f5f5f7;
  --fg-2: rgba(245, 245, 247, 0.56);
  --fg-3: rgba(245, 245, 247, 0.38);
  --line: rgba(245, 245, 247, 0.12);
  --line-2: rgba(245, 245, 247, 0.07);
  --input: rgba(245, 245, 247, 0.14);
  --field: rgba(245, 245, 247, 0.08);
  --input-bg: #2c2c2e;
  --brand: #0a84ff;
  --primary: #0071e3;
  --tab-active: #0a84ff;
  --bubble-them: #2c2c2e;
  --bubble-them-fg: #f5f5f7;
  --bubble-me: color-mix(in srgb, #0a84ff 18%, #1d1d1f);
  --bubble-me-fg: #f5f5f7;
  --badge: #0a84ff;
  --danger: #ff453a;
  --ok: #30d158;
  --warn: #ff9f0a;
  --scrim: rgba(0, 0, 0, 0.5);
  --menu: #2c2c2e;
  --menu-fg: #f5f5f7;
  --menu-line: rgba(245, 245, 247, 0.08);
  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

/* 对照皮：绿色气泡（只为对照，不是提案） */
:root[data-skin="green"] {
  --ground: #ededed;
  --surface: #ffffff;
  --side: #f7f7f7;
  --rail: #ececec;
  --raised: #ffffff;
  --input-bg: #ffffff;
  --select: #dedede;
  --select-fg: #191919;
  --select-fg-2: rgba(0, 0, 0, 0.5);
  --fg: #191919;
  --brand: #07c160;
  --primary: #07c160;
  --tab-active: #07c160;
  --bubble-them: #ffffff;
  --bubble-them-fg: #191919;
  --bubble-me: #95ec69;
  --bubble-me-fg: #191919;
  --bubble-radius: 4px;
  --badge: #fa5151;
  --menu: #4c4c4c;
  --menu-fg: #ffffff;
  --menu-line: rgba(255, 255, 255, 0.1);
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="green"]:not([data-theme="light"]) {
    --ground: #111111;
    --surface: #1f1f1f;
    --side: #191919;
    --rail: #1f1f1f;
    --raised: #2c2c2c;
    --input-bg: #2c2c2c;
    --select: #07c160;
    --select-fg: #ffffff;
    --select-fg-2: rgba(255, 255, 255, 0.78);
    --fg: #d5d5d5;
    --bubble-them: #2c2c2c;
    --bubble-them-fg: #d5d5d5;
    --bubble-me: #3eb575;
    --bubble-me-fg: #0d0d0d;
    --menu: #2c2c2c;
  }
}
:root[data-skin="green"][data-theme="dark"] {
  --ground: #111111;
  --surface: #1f1f1f;
  --side: #191919;
  --rail: #1f1f1f;
  --raised: #2c2c2c;
  --input-bg: #2c2c2c;
  --select: #07c160;
  --select-fg: #ffffff;
  --select-fg-2: rgba(255, 255, 255, 0.78);
  --fg: #d5d5d5;
  --bubble-them: #2c2c2c;
  --bubble-them-fg: #d5d5d5;
  --bubble-me: #3eb575;
  --bubble-me-fg: #0d0d0d;
  --menu: #2c2c2c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--fg);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  caret-color: var(--brand);
}
::selection { background: color-mix(in srgb, var(--brand) 26%, transparent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); border-radius: 6px; }
.ic { display: block; flex: none; }

/* 滚动条跟着调色板走，不留浏览器默认的那一格 */
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ── 头像 ────────────────────────────────────────────────────────────────
   智能体 = 像素脸（纸白盘底，两个主题同值）；人 = 首字母；群 = 九宫格拼图。
   形状照微信：圆角方块，不是圆。 */
.av {
  --s: 40px;
  position: relative;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: calc(var(--s) * 0.16);
  overflow: hidden;
  background: var(--face-disc);
  display: inline-grid;
  place-items: center;
}
.av canvas { width: 100%; height: 100%; display: block; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.human {
  background: var(--raised);
  color: var(--fg-2);
  font-weight: 600;
  font-size: calc(var(--s) * 0.42);
  line-height: 1;
}
.av.me-av { background: var(--fg); color: var(--ground); }
.av.grp {
  background: var(--raised);
  padding: calc(var(--s) * 0.06);
  gap: calc(var(--s) * 0.035);
  display: grid;
  align-content: center;
  justify-content: center;
}
.av.grp .mini {
  border-radius: 2px;
  overflow: hidden;
  background: var(--face-disc);
  display: grid;
  place-items: center;
  font-weight: 600;
  color: var(--fg-2);
  line-height: 1;
}
.av.grp .mini.human { background: color-mix(in srgb, var(--fg) 12%, var(--raised)); }
.av.grp .mini canvas { width: 100%; height: 100%; display: block; }
.av .dot-unread {
  position: absolute;
  top: -1px;
  right: -1px;
}
.av-wrap { position: relative; flex: none; display: inline-grid; }
.badge {
  position: absolute;
  top: -6px;
  right: -7px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--badge);
  color: var(--badge-fg);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--side);
  z-index: 1;
}
.badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }

/* ── 消息 ──────────────────────────────────────────────────────────────── */
.timeline { display: flex; flex-direction: column; gap: 14px; }
.tl-time {
  align-self: center;
  font-size: 11.5px;
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  padding: 2px 0;
}
.tl-sys {
  align-self: center;
  max-width: 78%;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  color: var(--fg-2);
  padding: 3px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--fg) 5%, transparent);
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0 4px;
}
.tl-sys .who { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--fg); }
.tl-sys .who .av { --s: 14px; border-radius: 3px; }
.tl-sys.link { cursor: pointer; }
.tl-sys.link:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.msg { display: flex; align-items: flex-start; gap: 10px; }
.msg.me { flex-direction: row-reverse; }
.msg .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: min(72%, 560px); }
.msg.me .body { align-items: flex-end; }
.msg .name { font-size: 11.5px; color: var(--fg-2); padding: 0 2px; }
.bubble {
  position: relative;
  padding: 8px 12px;
  border-radius: var(--bubble-radius);
  background: var(--bubble-them);
  color: var(--bubble-them-fg);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.msg.them .bubble { border-top-left-radius: 4px; }
.msg.me .bubble { background: var(--bubble-me); color: var(--bubble-me-fg); border-top-right-radius: 4px; }
/* 绿色那套：小三角尾巴，照原样 */
:root[data-skin="green"] .msg .bubble { border-radius: 4px; }
:root[data-skin="green"] .msg .bubble::before {
  content: "";
  position: absolute;
  top: 12px;
  width: 8px;
  height: 8px;
  background: inherit;
  transform: rotate(45deg);
  border-radius: 1px;
}
:root[data-skin="green"] .msg.them .bubble::before { left: -4px; }
:root[data-skin="green"] .msg.me .bubble::before { right: -4px; }
.bubble .mention { color: var(--brand); }
:root[data-skin="green"] .msg.me .bubble .mention { color: inherit; font-weight: 600; }
.bubble.voice-note .vmark { display: inline-flex; vertical-align: -2px; margin-right: 6px; opacity: 0.55; }
.bubble.typing { display: inline-flex; gap: 4px; align-items: center; height: 38px; padding: 0 14px; }
.bubble.typing i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.35;
  animation: dot 1.2s infinite var(--ease);
}
.bubble.typing i:nth-child(2) { animation-delay: 0.15s; }
.bubble.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30% { opacity: 0.8; transform: translateY(-3px); }
}
.bubble.call { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.bubble.call:hover { filter: brightness(0.97); }
.msg.fresh { animation: msg-in 220ms var(--ease) both; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.role-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 46px; }
.chip {
  font-size: 12.5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  transition: background-color 150ms var(--ease), transform 120ms var(--ease);
}
.chip:hover { background: var(--hover); }
.chip:active { transform: scale(0.97); }

/* ── 通用控件 ──────────────────────────────────────────────────────────── */
.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: 6px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  transition: background-color 150ms var(--ease), transform 120ms var(--ease), opacity 150ms var(--ease);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 90%, #000); }
.btn.soft { background: var(--field); color: var(--fg); }
.btn.soft:hover:not(:disabled) { background: var(--press); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.btn.danger-solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: default; }
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: inline-grid;
  place-items: center;
  color: var(--fg-2);
  transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn:active { transform: scale(0.94); }
.field {
  height: 34px;
  width: 100%;
  border-radius: 6px;
  border: 1px solid var(--input);
  background: transparent;
  padding: 0 12px;
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.field::placeholder, textarea::placeholder { color: var(--fg-3); }
.plan {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 16%, transparent);
}
.plan.free { color: var(--fg-2); background: color-mix(in srgb, var(--fg-2) 14%, transparent); }

/* 正在发生的那一句：光带扫过（DESIGN.md 的 Shimmer） */
.shimmer {
  background: linear-gradient(90deg, var(--fg-2) 0%, var(--fg-2) 40%, var(--fg) 50%, var(--fg-2) 60%, var(--fg-2) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { .shimmer { animation: none; color: var(--fg-2); background: none; } }

/* 能折叠的一段（通讯录的「智能体」「朋友」）：高度走 grid 0fr↔1fr，箭头转 90° */
.fold-row { display: flex; align-items: center; gap: 4px; padding: 10px 8px 4px; }
.fold-head {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--fg-2);
  text-align: left;
  transition: background-color 120ms var(--ease), color 120ms var(--ease);
}
.fold-head:hover { background: var(--hover); color: var(--fg); }
.fold-head .ic { color: var(--fg-3); transition: transform 200ms var(--ease); }
.fold-head[aria-expanded="false"] .ic { transform: rotate(-90deg); }
.fold-n { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.fold-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 220ms var(--ease); }
.fold-body.closed { grid-template-rows: 0fr; }
.fold-inner { min-height: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .fold-body, .fold-head .ic { transition: none; } }

/* 分组卡（设置式） */
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--fg-2); padding: 0 16px 6px; }
.inset { background: var(--surface); border-radius: 12px; overflow: hidden; }
.inset + .group-foot { font-size: 11.5px; color: var(--fg-2); padding: 6px 16px 0; line-height: 1.5; }
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 8px 14px;
  width: 100%;
  text-align: left;
  transition: background-color 120ms var(--ease);
}
button.row:hover, a.row:hover { background: var(--hover); }
button.row:active { background: var(--press); }
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: var(--inset, 14px);
  height: 1px;
  background: var(--line-2);
}
.row .lead { width: 28px; height: 28px; border-radius: 7px; background: var(--field); display: grid; place-items: center; color: var(--fg-2); flex: none; }
.row .t { flex: 1; min-width: 0; }
.row .t .sub { display: block; font-size: 12px; color: var(--fg-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { color: var(--fg-2); font-size: 13px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { color: var(--fg-3); }
.row.danger { color: var(--danger); justify-content: center; }

/* 额度表：填「剩余」、色档按「已用」，充足时中性灰（ADR-0209 / 0239） */
.meter { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--fg-3); }
.meter.warn > i { background: var(--warn); }

/* 弹层 */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--ease);
  z-index: 40;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(420px, calc(100vw - 32px));
  max-height: calc(100dvh - 32px);
  overflow: auto;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 22px;
  transform: translate(-50%, -50%) scale(0.96);
  opacity: 0;
  pointer-events: none;

const stack = [];
function makePage(key, title, render, opts = {}) {
  const el = document.createElement("div");
  el.className = "page";
  const p = { key, title, render, el, opts };
  p.draw = () => {
    const prev = stack[stack.indexOf(p) - 1];
    const right = typeof opts.right === "function" ? opts.right() : "";
    el.innerHTML = `<div class="nav"><div class="l">${prev ? `<button class="nbtn" data-back>${ic("chevron-left", 24, 2)}${esc(prev.title)}</button>` : `<button class="nbtn" data-me>${ic("chevron-left", 24, 2)}我</button>`}</div><div class="c">${esc(p.title)}</div><div class="r">${right}</div></div><div class="content scroll">${render(p)}</div>`;
    const back = $("[data-back]", el);
    if (back) back.addEventListener("click", pop);
    const me = $("[data-me]", el);
    if (me) me.addEventListener("click", () => toast("demo 从「那台电脑」开始"));
    opts.bind?.(p);
  };
  return p;
}
function push(p, { replace = false, instant = false } = {}) {
  const prev = stack[stack.length - 1];
  stack.push(p);
  p.draw();
  $("#stack").appendChild(p.el);
  if (instant || !prev) return;
  p.el.style.transform = "translateX(100%)";
  p.el.getBoundingClientRect();
  p.el.classList.add("anim"); prev.el.classList.add("anim", "dimmed");
  p.el.style.transform = "translateX(0)";
  prev.el.style.transform = "translateX(-30%)";
  setTimeout(() => {
    if (replace) {
      // 接好之后：目录页换成详情页，返回直接回到应用列表
      stack.splice(stack.indexOf(prev), 1); prev.el.remove(); p.draw();
    } else if (stack[stack.length - 1] !== prev) prev.el.style.visibility = "hidden";
  }, 430);
}
function pop() {
  if (stack.length < 2) return;
  const top = stack.pop();
  const under = stack[stack.length - 1];
  under.el.style.visibility = "";
  under.draw();
  top.el.classList.add("anim"); under.el.classList.add("anim");
  top.el.style.transform = "translateX(100%)";
  under.el.style.transform = "translateX(0)";
  under.el.classList.remove("dimmed");
  setTimeout(() => top.el.remove(), 430);
}
function refreshAll() { stack.forEach((p) => p.draw()); }
function reset() { stack.splice(0).forEach((p) => p.el.remove()); }

/* ── 页：那台电脑 ─────────────────────────────────────────────────────── */
function machinePage() {
  return makePage("machine", "那台电脑", () => `
    <div class="foot-note" style="padding:6px 16px 12px">你的智能体干活的那台电脑，在云端。</div>
    <div class="list">
      ${[["folder", "文件", "", "files"], ["app-window", "应用", `${S.phone.length + S.desktop.length} 个`, "apps"], ["book-open", "记忆", "", "memory"], ["chart-column", "这周谁用得多", "", "usage"]]
        .map(([i, n, v, k]) => `<button class="mrow" style="--sep:52px" data-go="${k}"><span class="icon-lead">${ic(i, 20, 1.7)}</span><span class="meta"><span class="nm">${n}</span></span>${v ? `<span class="val">${v}</span>` : ""}<span class="chev">${ic("chevron-right", 18)}</span></button>`).join("")}
    </div>`, {
    bind: (p) => $$("[data-go]", p.el).forEach((b) => b.addEventListener("click", () => b.dataset.go === "apps" ? push(appsPage()) : toast("demo 只做了「应用」这一格"))),

/* ── 页：应用 ─────────────────────────────────────────────────────────── */
function appsPage() {
  return makePage("apps", "应用", () => {
    const entryRow = S.entry === "row"
      ? `<div class="list"><button class="mrow action iconed" data-connect><span class="tile" style="background:var(--field);color:var(--brand)">${ic("plus", 22, 2)}</span><span class="meta"><span class="nm">接入新应用</span></span><span class="chev">${ic("chevron-right", 18)}</span></button></div><div class="gap"></div>`
      : "";
    const phone = S.phone.length === 0
      ? `<div class="empty">手机上还没接应用。<br>接好之后，你的智能体会以你的身份用它。${S.entry === "header" ? `<br><button class="btn primary" data-connect>接入应用</button>` : ""}</div>`
      : `<div class="sect">手机上接的</div><div class="list">${S.phone.map((a) => {
          const e = byId(a.id);
          const n = toolsOf(a.id).length;
          const trail = a.status === "needs_login" ? `<span class="val warn">点一下重新登录</span>` : "";
          return `<button class="mrow iconed" data-app="${a.id}">${tile(e.name)}<span class="meta"><span class="nm">${esc(e.name)}</span><span class="pv">${n} 个工具${a.grants.length ? ` · 借给了 ${a.grants.length} 个团队` : ""}</span></span>${trail}${a.status === "ok" ? `<span class="chev">${ic("chevron-right", 18)}</span>` : ""}</button>`;
        }).join("")}</div><div class="foot-note">凭据存在云端，不在这台手机上。你的智能体随时能用，手机关机也行。</div>`;
    const desktop = S.desktop.length === 0 ? "" : `<div class="sect">电脑上接的</div><div class="list">${S.desktop.map(([n, t]) => `<div class="mrow iconed">${tile(n)}<span class="meta"><span class="nm">${esc(n)}</span><span class="pv">${t}</span></span></div>`).join("")}</div><div class="foot-note">在电脑上的 Mr Otto 里接的，要在电脑上管。</div>`;
    return entryRow + phone + desktop;
  }, {
    right: () => S.entry === "header" ? `<button class="nbtn text" data-connect-top>接入</button>` : "",
    bind: (p) => {
      $$("[data-connect], [data-connect-top]", p.el).forEach((b) => b.addEventListener("click", () => push(connectPage())));
      $$("[data-app]", p.el).forEach((b) => b.addEventListener("click", () => {
        const a = phoneOf(b.dataset.app);
        if (a.status === "needs_login") connectDialog(byId(a.id), { relogin: true });
        else push(detailPage(a.id));
      }));
    },
  });
}

/* ── 页：接入目录 ─────────────────────────────────────────────────────── */
let query = "";
function connectPage() {
  const p = makePage("connect", "接入应用", () => `
    <div class="msearch"><label>${ic("search", 18)}<input id="q" placeholder="搜应用" value="${esc(query)}" autocomplete="off"></label></div>
    <div id="cat"></div>`, {
    bind: (pp) => {
      const q = $("#q", pp.el);
      const draw = () => { $("#cat", pp.el).innerHTML = catalogHtml(); bindCat(pp); };
      q.addEventListener("input", () => { query = q.value; draw(); });
      draw();
    },
  });
  return p;
}
function catalogHtml() {
  const qq = query.trim().toLowerCase();
  const hit = (e) => qq === "" || [e.id, e.name, e.description].some((f) => f.toLowerCase().includes(qq));
  const groups = CATEGORIES.map((c) => [c, CATALOG.filter((e) => e.category === c && hit(e))]).filter(([, xs]) => xs.length > 0);
  if (groups.length === 0) return `<div class="empty">没找到「${esc(query)}」。<br>目录外的应用要在电脑上接。</div>`;
  return groups.map(([c, xs]) => `<div class="sect">${esc(c)}</div><div class="list">${xs.map((e) => {
    const connected = !!phoneOf(e.id);
    return `<button class="mrow iconed" data-cat="${e.id}" ${e.blocked && !connected ? 'aria-disabled="true"' : ""}>${tile(e.name)}<span class="meta"><span class="nm">${esc(e.name)}</span><span class="pv">${esc(e.blocked && !connected ? e.blocked : e.description)}</span></span>${connected ? `<span class="val dim">已接入</span>` : ""}</button>`;
  }).join("")}</div>`).join("") + `<div class="foot-note" style="padding-top:14px">只列能在云端跑的应用；要装在电脑上的那几类（本机工具）在电脑上接。</div>`;
}
function bindCat(p) {
  $$("[data-cat]", p.el).forEach((b) => b.addEventListener("click", () => {
    const e = byId(b.dataset.cat);
    if (phoneOf(e.id)) return push(detailPage(e.id));
    if (e.blocked) return toast(e.blocked);
    connectDialog(e, {});
  }));
}

/* ── 页：详情 ─────────────────────────────────────────────────────────── */
function detailPage(id) {
  let showAll = false;
  return makePage("detail:" + id, byId(id).name, () => {
    const a = phoneOf(id);
    if (!a) return `<div class="empty">这个应用已经断开了。</div>`;
    const e = byId(id);
    const tools = toolsOf(id);
    const shown = showAll ? tools : tools.slice(0, 6);
    const days = Math.floor((Date.now() - a.ts) / DAY);
    return `
      <div class="hero">${tile(e.name)}<div class="n">${esc(e.name)}</div><div class="d">${esc(e.description)}</div>
        <div class="st"><span class="dot ${a.status === "ok" ? "" : "warn"}"></span>${a.status === "ok" ? `你的智能体能用 · ${days <= 0 ? "今天接入" : `${days} 天前接入`}` : "登录过期了，智能体暂时用不了"}</div></div>
      ${a.status === "needs_login" ? `<div class="list"><button class="mrow center" data-relogin>重新登录</button></div><div class="gap"></div>` : ""}
      <div class="sect"><span>它能做的</span><span>${tools.length} 个工具</span></div>
      <div class="list">${shown.map((t) => `<div class="mrow mono"><span class="meta"><span class="nm">${esc(t)}</span></span></div>`).join("")}
        ${!showAll && tools.length > 6 ? `<button class="mrow center" data-all style="font-size:16px;font-weight:400">全部 ${tools.length} 个</button>` : ""}</div>
      <div class="sect">借给团队</div>
      <div class="list">${S.teams.map((t) => `<div class="mrow"><span class="meta"><span class="nm">${esc(t.name)}</span></span><button class="sw" role="switch" aria-checked="${a.grants.includes(t.id)}" data-team="${t.id}" aria-label="借给${esc(t.name)}"></button></div>`).join("")}</div>
      <div class="foot-note">借给团队后，团队里的智能体会以你的身份用它。随时能关。</div>
      <div class="gap" style="height:28px"></div>
      <div class="list"><button class="mrow danger" data-off>断开</button></div>`;
  }, {
    bind: (p) => {
      $("[data-all]", p.el)?.addEventListener("click", () => { showAll = true; p.draw(); });
      $("[data-relogin]", p.el)?.addEventListener("click", () => connectDialog(byId(id), { relogin: true }));
      $$("[data-team]", p.el).forEach((b) => b.addEventListener("click", () => {
        const a = phoneOf(id);
        const on = b.getAttribute("aria-checked") !== "true";
        b.setAttribute("aria-checked", String(on));
        $$("[data-team]", p.el).forEach((x) => (x.disabled = true));
        setTimeout(() => {
          a.grants = on ? [...a.grants, b.dataset.team] : a.grants.filter((g) => g !== b.dataset.team);
          $$("[data-team]", p.el).forEach((x) => (x.disabled = false));
          const t = S.teams.find((x) => x.id === b.dataset.team).name;
          toast(on ? `借给了「${t}」` : `不再借给「${t}」`);
        }, 450);
      }));
      $("[data-off]", p.el)?.addEventListener("click", () => {
        const n = byId(id).name;
        openDialog(`<h3>断开 ${esc(n)}？</h3><p class="desc">断开后，你的智能体和借到它的团队都用不了它，云端存的登录凭据会一起删掉。</p>
          <div class="actions"><button class="btn soft" data-close>取消</button><button class="btn danger-solid" id="ok">断开</button></div>`, (d) => {
          $("#ok", d).addEventListener("click", () => {
            closeDialog();
            S.phone = S.phone.filter((x) => x.id !== id);
            pop(); setTimeout(() => toast(`已断开 ${n}`), 250);
          });
        });
      });
    },
  });
}

/* ── 弹窗 ─────────────────────────────────────────────────────────────── */
function openDialog(html, bind) {
  const d = $("#dialog");
  d.innerHTML = html;
  $("#scrim").classList.add("on"); d.classList.add("on");
  $$("[data-close]", d).forEach((b) => b.addEventListener("click", closeDialog));
  bind?.(d);
}
function closeDialog() { $("#scrim").classList.remove("on"); $("#dialog").classList.remove("on"); }
$("#scrim").addEventListener("click", () => { if (!$("#dialog").dataset.busy) closeDialog(); });

/* 接入前那一张（spec §8）：做什么的 + 以你的身份 + 要参数的当场问 */
function connectDialog(e, { relogin }) {
  const browser = e.auth === "oauth";
  const action = browser ? "去登录" : "连接";
  const fields = e.params.map((p) => `<div class="lbl">${esc(p.name === "github_token" ? "GitHub 令牌" : p.name)}</div>
    <input class="field" data-p="${p.name}" ${e.auth === "token" ? 'type="password"' : ""} autocomplete="off" placeholder="${e.auth === "token" ? "粘贴到这里" : ""}">
    <div class="hint">${esc(p.description)}</div>`).join("");
  openDialog(`
    <div class="d-tile">${tile(e.name)}</div>
    <h3>${relogin ? `重新登录 ${esc(e.name)}` : `接入 ${esc(e.name)}`}</h3>
    <p class="desc">${relogin ? "登录过期了。登录之后，借给团队的设置都还在。" : esc(e.description)}</p>
    ${relogin ? "" : `<div class="who">${ic("info", 16)}<span>接好后，你的智能体会以你的身份操作它。${browser ? "登录在 " + esc(e.name) + " 自己的页面上完成，密码不经过 Mr Otto。" : ""}</span></div>`}
    ${relogin ? "" : fields}
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn soft" data-close>取消</button><button class="btn primary" id="go">${action}</button></div>`, (d) => {
    const go = $("#go", d), err = $("#err", d);
    const inputs = $$("[data-p]", d);
    const ready = () => e.params.every((p) => !p.required || (d.querySelector(`[data-p="${p.name}"]`)?.value ?? "").trim() !== "");
    if (!relogin && e.params.length) { go.disabled = !ready(); inputs.forEach((i) => i.addEventListener("input", () => { go.disabled = !ready(); err.textContent = ""; })); }
    go.addEventListener("click", () => {
      err.textContent = "";
      const busy = (on) => { d.dataset.busy = on ? "1" : ""; go.disabled = on; go.innerHTML = on ? `<span class="spin"></span>连接中` : action; $("[data-close]", d).disabled = on; };
      busy(true);
      // 第一跳：POST /px/v1/cloud/connect。token / 免登录在这一跳里就验完了
      setTimeout(() => {
        const o = S.outcome;
        if (!browser) {
          busy(false);
          if (o === "badtoken" && e.auth === "token") { err.textContent = OUTCOME_TEXT.badtoken; return; }
          if (o === "nodcr" || o === "expired" || o === "cancel") { finish(e, relogin); return; }
          if (o === "notools") { err.textContent = "没接上：上游 tools/list 失败（502）"; return; }
          return finish(e, relogin);
        }
        if (o === "nodcr") { busy(false); err.textContent = OUTCOME_TEXT.nodcr; return; }
        busy(false);
        // 交给系统的登录页时，自己这张先让开（留着蒙层）；回来没接上就原样回到这张，接上了就收掉
        d.classList.remove("on");
        openAuth(e, (res) => {
          if (res === "ok") return finish(e, relogin);
          d.classList.add("on");
          if (res !== "cancel") err.textContent = OUTCOME_TEXT[res]; // 人自己关了浏览器：什么都不说
        });
      }, 650);
    });
  });
}

/* 模拟系统授权会话（ASWebAuthenticationSession）：iOS 先在 App 上问一句，继续了才升起厂商自己的页面——
   Mr Otto 看不到密码 */
function openAuth(e, done) {
  const host = { notion: "mcp.notion.com", linear: "mcp.linear.app" }[e.id] || `${e.id}.example.com`;
  const sys = $("#sysalert");
  sys.innerHTML = `<div class="t">“Mr Otto” 想使用 “${host}” 登录</div><div class="m">这将允许该 App 和网站共享有关你的信息。</div><div class="b"><button data-sys-no>取消</button><button data-sys-yes>继续</button></div>`;
  sys.classList.add("on");
  $("[data-sys-no]", sys).addEventListener("click", () => { sys.classList.remove("on"); done("cancel"); });
  $("[data-sys-yes]", sys).addEventListener("click", () => {
    sys.classList.remove("on");
    const el = $("#auth");
    el.innerHTML = `<div class="bar"><button data-x>取消</button><div class="url">${ic("lock", 12, 2)}${host}</div><span style="width:40px"></span></div>
      <div class="body">${tile(e.name)}<h2>Mr Otto 想访问你的 ${esc(e.name)}</h2><p>这是 ${esc(e.name)} 自己的授权页。允许之后回到 Mr Otto。</p>
        <div class="scopes">· 读取你能看到的内容<br>· 替你创建和修改内容</div>
        <button class="allow" data-allow>允许</button></div>`;
    requestAnimationFrame(() => el.classList.add("on"));
    const close = (res) => { el.classList.remove("on"); setTimeout(() => done(res), 380); };
    $("[data-x]", el).addEventListener("click", () => close("cancel"));
    $("[data-allow]", el).addEventListener("click", () => {
      const o = S.outcome;
      close(o === "cancel" ? "cancel" : o === "expired" ? "expired" : o === "notools" ? "notools" : "ok");
    });
  });
}

function finish(e, relogin) {
  closeDialog();
  const prior = phoneOf(e.id);
  if (prior) { prior.status = "ok"; prior.ts = Date.now(); }
  else S.phone.push({ id: e.id, status: "ok", grants: [], ts: Date.now() });
  const top = stack[stack.length - 1];
  if (relogin) { refreshAll(); toast(`${e.name} 重新登录好了`); return; }
  if (top.key === "connect") push(detailPage(e.id), { replace: true });
  else refreshAll();
  setTimeout(() => toast(`接好了。你的智能体现在能用 ${e.name}`), 300);
}

let tt;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ── 跳转 ─────────────────────────────────────────────────────────────── */
function jump(k) {
  closeDialog(); $("#auth").classList.remove("on");
  if (k === "empty") S.phone = [];
  if (k !== "empty" && S.phone.length === 0) S.phone = [{ id: "notion", status: "ok", grants: ["t1"], ts: Date.now() - 3 * DAY }, { id: "linear", status: "needs_login", grants: [], ts: Date.now() - 20 * DAY }];
  reset();
  push(machinePage(), { instant: true });
  push(appsPage(), { instant: true });
  stack[0].el.style.transform = "translateX(-30%)";
  if (k === "connect") { push(connectPage(), { instant: true }); stack[1].el.style.transform = "translateX(-30%)"; }
  if (k === "notion") { push(detailPage("notion"), { instant: true }); stack[1].el.style.transform = "translateX(-30%)"; }
  stack.slice(0, -1).forEach((p) => (p.el.style.visibility = "hidden"));
}

/* 宽屏：整台手机按视口高度缩放 */
function fit() {
  const w = $("#wrap");
  if (innerWidth < 440) { w.style.transform = ""; return; }
  const s = Math.min(1, (innerHeight - 32) / 844);
  w.style.transform = `scale(${s})`;
  w.style.margin = `${(844 * s - 844) / 2}px ${(390 * s - 390) / 2}px`;
}
addEventListener("resize", fit); fit();
renderSide();
jump("apps");
</script>
